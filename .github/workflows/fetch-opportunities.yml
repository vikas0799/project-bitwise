name: Refresh opportunities

on:
  schedule:
    # Every 3 days at 06:00 IST (days 1, 4, 7 … of each month). Each data
    # commit triggers a Vercel deploy, so fewer runs means fewer deploys.
    - cron: '30 0 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The script has no dependencies, so there is nothing to cache.
          package-manager-cache: false
      - name: Fetch live listings
        run: node scripts/fetch-opportunities.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh opportunities data"
            git push
          fi
