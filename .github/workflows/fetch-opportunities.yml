name: Refresh opportunities

on:
  schedule:
    - cron: '30 0 * * *' # daily at 06:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch live listings
        run: node scripts/fetch-opportunities.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/opportunities.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh opportunities data"
            git push
          fi
