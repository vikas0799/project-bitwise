troke="#CBD5E1" stroke-width="1"/><rect x="176" y="206" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="214" y="206" width="38" height="38" rx="0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><rect x="252" y="206" width="38" height="38" rx="0" fill="#E8F0FF" stroke="#8AB2FF" stroke-width="1"/><text x="271" y="225" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="middle">✓</text><rect x="290" y="206" width="38" height="38" rx="0" fill="#E8F0FF" stroke="#8AB2FF" stroke-width="1"/><text x="309" y="225" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="middle">✓</text><rect x="100" y="244" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="138" y="244" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="176" y="244" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="214" y="244" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="252" y="244" width="38" height="38" rx="0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><rect x="290" y="244" width="38" height="38" rx="0" fill="#E8F0FF" stroke="#8AB2FF" stroke-width="1"/><text x="309" y="263" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="middle">✓</text><rect x="100" y="282" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="138" y="282" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="176" y="282" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="214" y="282" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="252" y="282" width="38" height="38" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="290" y="282" width="38" height="38" rx="0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><rect x="372" y="84" width="360" height="104" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="390" y="110" dy="0.35em" font-size="14" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">for (int i = 0; i &lt; n; i++)</text><text x="390" y="136" dy="0.35em" font-size="14" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  for (int j = i + 1; j &lt; n; j++)</text><text x="390" y="162" dy="0.35em" font-size="14" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">    check(a[i], a[j]);</text><text x="374" y="226" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">n = 6</tspan><tspan fill="#334155" font-weight="500">  →  15 pairs (the ✓ cells)</tspan></text><text x="374" y="256" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">pairs = n(n − 1) / 2 ≈ n² / 2</tspan><tspan fill="#0052CC" font-weight="700">  →  O(n²)</tspan></text><text x="374" y="286" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">double n and the work grows about 4×</tspan></text><rect x="100" y="346" width="16" height="16" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="122" y="354" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">pair checked</text><rect x="229.8" y="346" width="16" height="16" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/><text x="251.8" y="354" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">i = j, skipped</text>
