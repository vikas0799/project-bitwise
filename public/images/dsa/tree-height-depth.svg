<rect width="800" height="440" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Depth counts down from the root, height counts up from the leaves</text><line x1="411.4" y1="101.7" x2="318.6" y2="160.3" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="448.6" y1="101.7" x2="541.4" y2="160.3" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="286.3" y1="189.2" x2="248.7" y2="236.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="313.7" y1="189.2" x2="351.3" y2="236.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="573.7" y1="189.2" x2="611.3" y2="236.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="226.9" y1="274.5" x2="210.6" y2="315.5" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="430" cy="90" r="22" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="430" y="90" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle">1</text><circle cx="300" cy="172" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="300" y="172" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">2</text><circle cx="560" cy="172" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="560" y="172" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">3</text><circle cx="235" cy="254" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="235" y="254" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">4</text><circle cx="365" cy="254" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="365" y="254" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">5</text><circle cx="625" cy="254" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="625" y="254" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">6</text><circle cx="202.5" cy="336" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="202.5" y="336" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">7</text><text x="40" y="90" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">depth 0</text><text x="40" y="172" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">depth 1</text><text x="40" y="254" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">depth 2</text><text x="40" y="336" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">depth 3</text><rect x="451.2" y="64" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="474" y="74" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">h = 3</text><rect x="321.2" y="146" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="344" y="156" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">h = 2</text><rect x="581.2" y="146" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="604" y="156" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">h = 1</text><rect x="256.2" y="228" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="279" y="238" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">h = 1</text><rect x="386.2" y="228" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="409" y="238" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">h = 0</text><rect x="646.2" y="228" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="669" y="238" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">h = 0</text><rect x="223.7" y="310" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="246.5" y="320" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">h = 0</text><text x="32" y="392" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Counting edges: a leaf has height 0 and depth = number of edges from the root.</text><text x="32" y="420" dy="0.35em" font-size="14" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan fill="#0A1633" font-weight="700">height(node) = 1 + max(height(left), height(right))</tspan></text>
</svg>
