<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img" aria-label="Reversing the list 1 2 3 4 by turning each next pointer around" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Reversing the list 1 2 3 4 by turning each next pointer around</title>
