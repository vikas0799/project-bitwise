art"><tspan fill="#334155" font-weight="500">total = 1 + 2 + 3 + 6 = </tspan><tspan fill="#059669" font-weight="700">12</tspan></text><text x="32" y="404" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">A Union-Find (DSU) tells in almost O(1) whether two nodes are already connected.</text>
