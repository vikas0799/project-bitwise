<rect width="760" height="790" fill="#FFFFFF"/>
<text x="32" y="30" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The C++ STL containers you use most in DSA</text><rect x="24" y="56" width="348" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="40" y="78" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">vector</text><text x="40" y="208" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">a[i]: O(1) · push_back: O(1)*</text><rect x="54" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="75" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="96" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="117" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="138" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="159" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">4</text><rect x="180" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="201" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="222" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="243" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><rect x="264" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="285" y1="108" x2="285" y2="117" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="285" y="97" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">push_back</text><rect x="388" y="56" width="348" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="404" y="78" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">deque</text><text x="404" y="208" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">push / pop at both ends: O(1)</text><rect x="478" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="499" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="520" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="541" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">7</text><rect x="562" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="583" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="604" y="120" width="42" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="625" y="139" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">8</text><line x1="428" y1="139" x2="474" y2="139" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="696" y1="139" x2="650" y2="139" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="448" y="174" dy="0.35em" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">front</text><text x="674" y="174" dy="0.35em" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">back</text><rect x="24" y="238" width="348" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="40" y="260" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">stack</text><text x="40" y="390" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">push / pop / top: O(1)</text><rect x="154" y="278" width="80" height="30" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="194" y="293" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><rect x="154" y="308" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="194" y="323" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><rect x="154" y="338" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="194" y="353" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><path d="M148 274 L148 374 L240 374 L240 274" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="304" y1="293" x2="246" y2="293" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="310" y="293" dy="0.35em" font-size="13" font-weight="700" fill="#0052CC" text-anchor="start">top</text><rect x="388" y="238" width="348" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="404" y="260" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">queue</text><text x="404" y="390" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">push (back) / pop (front): O(1)</text><rect x="498" y="304" width="44" height="38" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="520" y="323" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="542" y="304" width="44" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="564" y="323" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><rect x="586" y="304" width="44" height="38" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="608" y="323" dy="0.35em" font-size="15" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><line x1="492" y1="323" x2="432" y2="323" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="686" y1="323" x2="636" y2="323" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="460" y="354" dy="0.35em" font-size="12" font-weight="600" fill="#0052CC" text-anchor="middle">front: out</text><text x="662" y="354" dy="0.35em" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">back: in</text><rect x="24" y="420" width="348" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="40" y="442" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">priority_queue</text><text x="40" y="572" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">push / pop: O(log n) · top: O(1)</text><line x1="151.6" y1="476.4" x2="126.4" y2="493.6" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="176.4" y1="476.4" x2="201.6" y2="493.6" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="105.1" y1="514.1" x2="97.9" y2="523.9" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="122.9" y1="514.1" x2="130.1" y2="523.9" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="164" cy="468" r="15" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="164" y="468" dy="0.35em" font-size="13" font-weight="650" fill="#003A91" text-anchor="middle">9</text><circle cx="114" cy="502" r="15" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="114" y="502" dy="0.35em" font-size="13" font-weight="650" fill="#0A1633" text-anchor="middle">5</text><circle cx="214" cy="502" r="15" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="214" y="502" dy="0.35em" font-size="13" font-weight="650" fill="#0A1633" text-anchor="middle">7</text><circle cx="89" cy="536" r="15" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="89" y="536" dy="0.35em" font-size="13" font-weight="650" fill="#0A1633" text-anchor="middle">1</text><circle cx="139" cy="536" r="15" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="139" y="536" dy="0.35em" font-size="13" font-weight="650" fill="#0A1633" text-anchor="middle">3</text><text x="274" y="476" dy="0.35em" font-size="13" font-weight="700" fill="#0052CC" text-anchor="start">top() = largest</text><text x="274" y="500" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">smallest first:</text><text x="274" y="516" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">greater&lt;int&gt;</text><rect x="388" y="420" width="348" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="404" y="442" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">set / map</text><text x="404" y="572" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">insert / find / erase: O(log n)</text><line x1="486.8" y1="492.8" x2="469.2" y2="513.2" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="509.2" y1="492.8" x2="526.8" y2="513.2" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="498" cy="480" r="17" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="498" y="480" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">20</text><circle cx="458" cy="526" r="17" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="458" y="526" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">10</text><circle cx="538" cy="526" r="17" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="538" y="526" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">30</text><text x="598" y="490" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="start">keys stay sorted</text><text x="598" y="512" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">(a balanced BST</text><text x="598" y="528" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">inside)</text><rect x="24" y="602" width="348" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="40" y="624" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">unordered_map / set</text><text x="40" y="754" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">insert / find: O(1) on average</text><rect x="54" y="642" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="71" y="655" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0</text><line x1="88" y1="655" x2="106" y2="655" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="108" y="643" width="84" height="24" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="150" y="655" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">apple: 3</text><rect x="54" y="674" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="71" y="687" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="54" y="706" width="34" height="26" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="71" y="719" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><line x1="88" y1="719" x2="106" y2="719" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="108" y="707" width="84" height="24" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="150" y="719" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">kiwi: 1</text><line x1="192" y1="719" x2="210" y2="719" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="212" y="707" width="84" height="24" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="254" y="719" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">fig: 5</text><rect x="388" y="602" width="348" height="170" rx="14" fill="#E8F0FF" stroke="#8AB2FF" stroke-width="1.5"/><text x="404" y="624" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="start">Pick by the operation you need most</text><text x="404" y="652" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start">index access → vector</text><text x="404" y="674" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start">both ends → deque</text><text x="404" y="696" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start">min or max → priority_queue</text><text x="404" y="718" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start">sorted keys → set / map</text><text x="404" y="740" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start">fast lookup → unordered_map</text><text x="404" y="760" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="start">* amortized, see vector growth</text>
</svg>
