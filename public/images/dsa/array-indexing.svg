<rect width="720" height="250" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">An array keeps its items side by side in memory</text><text x="154" y="84" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">address</text><text x="154" y="128" dy="0.35em" font-size="16" font-weight="700" fill="#0A1633" text-anchor="end">arr</text><text x="154" y="170" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">index</text><text x="210" y="84" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1000</text><text x="290" y="84" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1004</text><text x="370" y="84" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1008</text><text x="450" y="84" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1012</text><text x="530" y="84" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1016</text><rect x="170" y="100" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="210" y="128" dy="0.35em" font-size="20" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">7</text><text x="210" y="170" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0</text><rect x="250" y="100" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="290" y="128" dy="0.35em" font-size="20" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><text x="290" y="170" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="330" y="100" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="370" y="128" dy="0.35em" font-size="20" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">9</text><text x="370" y="170" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="410" y="100" width="80" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="450" y="128" dy="0.35em" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">4</text><text x="450" y="170" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="490" y="100" width="80" height="56" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="530" y="128" dy="0.35em" font-size="20" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><text x="530" y="170" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">4</text><text x="32" y="214" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#D97706" font-weight="700">arr[3]</tspan><tspan fill="#334155" font-weight="500"> is at 1000 + 3 × 4 = </tspan><tspan fill="#D97706" font-weight="700">1012</tspan><tspan fill="#334155" font-weight="500">  →  one step to reach any index: </tspan><tspan fill="#0052CC" font-weight="700">O(1)</tspan></text>
