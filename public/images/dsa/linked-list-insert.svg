260" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><text x="422" y="235" dy="0.35em" font-size="18" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">25</text><circle cx="474" cy="235" r="4.5" fill="#0A1633" stroke="#0A1633" stroke-width="1"/><line x1="204" y1="105" x2="296" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="384" y1="105" x2="476" y2="105" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-bad)"/><rect x="392.4" y="81" width="79.2" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="432" y="91" dy="0.35em" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">✗ old link</text><line x1="564" y1="105" x2="648" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="682" y="105" dy="0.35em" font-size="14" font-weight="700" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">NULL</text><path d="M474 235 C534 235, 532 190, 532 136" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="535.7" y="203.5" width="208.6" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="640" y="214" dy="0.35em" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">① newNode-&gt;next = cur-&gt;next</text><path d="M384 109 C384 170, 422 170, 422 204" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="217.6" y="167.5" width="164.9" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="300" y="178" dy="0.35em" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">② cur-&gt;next = newNode</text><text x="32" y="304" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Do ① before ②. If you change cur-&gt;next first, you lose the link to 30 and the rest of the list.</text>
