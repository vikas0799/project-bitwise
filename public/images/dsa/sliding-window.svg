eight="56" rx="10" fill="none" stroke="#0052CC" stroke-width="2.5"/><text x="420" y="87" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">2 + 1 + 5 = 8</tspan></text><rect x="64" y="140" width="52" height="46" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="90" y="163" dy="0.35em" font-size="18" font-weight="600" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="116" y="140" width="52" height="46" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="142" y="163" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="168" y="140" width="52" height="46" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="194" y="163" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><rect x="220" y="140" width="52" height="46" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="246" y="163" dy="0.35em" font-size="18" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="272" y="140" width="52" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="298" y="163" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="324" y="140" width="52" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="350" y="163" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="111" y="135" width="166" height="56" rx="10" fill="none" stroke="#0052CC" stroke-width="2.5"/><text x="420" y="163" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">8 − 2 + 1 = 7</tspan></text><rect x="64" y="216" width="52" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="90" y="239" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="116" y="216" width="52" height="46" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="142" y="239" dy="0.35em" font-size="18" font-weight="600" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="168" y="216" width="52" height="46" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="194" y="239" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><rect x="220" y="216" width="52" height="46" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="246" y="239" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="272" y="216" width="52" height="46" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="298" y="239" dy="0.35em" font-size="18" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="324" y="216" width="52" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="350" y="239" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="163" y="211" width="166" height="56" rx="10" fill="none" stroke="#0052CC" stroke-width="2.5"/><text x="420" y="239" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#059669" font-weight="700">7 − 1 + 3 = 9</tspan><tspan fill="#059669" font-weight="600">  ← best</tspan></text><rect x="64" y="292" width="52" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="90" y="315" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="116" y="292" width="52" height="46" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="142" y="315" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="168" y="292" width="52" height="46" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="194" y="315" dy="0.35em" font-size="18" font-weight="600" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><rect x="220" y="292" width="52" height="46" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="246" y="315" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="272" y="292" width="52" height="46" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="298" y="315" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="324" y="292" width="52" height="46" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="350" y="315" dy="0.35em" font-size="18" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="215" y="287" width="166" height="56" rx="10" fill="none" stroke="#0052CC" stroke-width="2.5"/><text x="420" y="315" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">9 − 5 + 2 = 6</tspan></text><rect x="64" y="364" width="16" height="16" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="86" y="372" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">in the window</text><rect x="201" y="364" width="16" height="16" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="223" y="372" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">enters</text><rect x="287.9" y="364" width="16" height="16" rx="4" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="309.9" y="372" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">leaves</text><text x="32" y="402" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">One add and one subtract per step, so the scan is O(n) instead of O(n × k).</text>
