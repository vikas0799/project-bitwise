<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="Call stack frames for fact(3) and the values returned as the stack unwinds" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Call stack frames for fact(3) and the values returned as the stack unwinds</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="760" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Call stack for fact(3): each call waits on the one above it</text><rect x="90" y="64" width="300" height="62" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="108" y="85" dy="0.35em" font-size="16" font-weight="700" fill="#065F46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">fact(1)</text><text x="108" y="108" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">n = 1 → base case, returns 1</text><rect x="90" y="140" width="300" height="62" rx="12" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="108" y="161" dy="0.35em" font-size="16" font-weight="700" fill="#003A91" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">fact(2)</text><text x="108" y="184" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">n = 2 → waits for fact(1)</text><rect x="90" y="216" width="300" height="62" rx="12" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="108" y="237" dy="0.35em" font-size="16" font-weight="700" fill="#003A91" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">fact(3)</text><text x="108" y="260" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">n = 3 → waits for fact(2)</text><rect x="90" y="292" width="300" height="62" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="108" y="313" dy="0.35em" font-size="16" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">main()</text><text x="108" y="336" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">calls fact(3)</text><line x1="34" y1="95" x2="82" y2="95" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="30" y="95" dy="0.35em" font-size="13" font-weight="700" fill="#059669" text-anchor="end">top</text><path d="M394 101 C442 101, 442 165, 400 165" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><text x="452" y="133" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="start">returns 1</text><path d="M394 177 C442 177, 442 241, 400 241" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><text x="452" y="209" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="start">returns 2 × 1 = 2</text><path d="M394 253 C442 253, 442 317, 400 317" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><text x="452" y="285" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="start">returns 3 × 2 = 6</text><text x="32" y="378" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Each call gets its own frame. No base case → frames pile up forever → stack overflow.</text>
</svg>
