<svg xmlns="http://www.w3.org/2000/svg" width="780" height="350" viewBox="0 0 780 350" role="img" aria-label="A queue before and after push(40) and pop()" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A queue before and after push(40) and pop()</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="780" height="350" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Queue: first in, first out (FIFO)</text><text x="32" y="98" dy="0.35em" font-size="14" font-weight="700" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Start</text><rect x="180" y="76" width="58" height="44" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="209" y="98" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="238" y="76" width="58" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="267" y="98" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><rect x="296" y="76" width="58" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="325" y="98" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><line x1="209" y1="134" x2="209" y2="123" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="209" y="145" dy="0.35em" font-size="12" font-weight="700" fill="#0052CC" text-anchor="middle">front</text><line x1="325" y1="134" x2="325" y2="123" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="325" y="145" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">back</text><text x="448" y="98" dy="0.35em" font-size="14" font-weight="500" fill="#334155" text-anchor="start">oldest item waits at the front</text><text x="32" y="190" dy="0.35em" font-size="14" font-weight="700" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">push(40)</text><rect x="180" y="168" width="58" height="44" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="209" y="190" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="238" y="168" width="58" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="267" y="190" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><rect x="296" y="168" width="58" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="325" y="190" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><rect x="354" y="168" width="58" height="44" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="383" y="190" dy="0.35em" font-size="18" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">40</text><line x1="209" y1="226" x2="209" y2="215" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="209" y="237" dy="0.35em" font-size="12" font-weight="700" fill="#0052CC" text-anchor="middle">front</text><line x1="383" y1="226" x2="383" y2="215" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="383" y="237" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">back</text><text x="448" y="190" dy="0.35em" font-size="14" font-weight="500" fill="#334155" text-anchor="start">new items join at the back</text><text x="32" y="282" dy="0.35em" font-size="14" font-weight="700" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">pop()</text><rect x="180" y="260" width="58" height="44" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="209" y="282" dy="0.35em" font-size="18" font-weight="600" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="238" y="260" width="58" height="44" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="267" y="282" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><rect x="296" y="260" width="58" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="325" y="282" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><rect x="354" y="260" width="58" height="44" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="383" y="282" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">40</text><line x1="267" y1="318" x2="267" y2="307" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="267" y="329" dy="0.35em" font-size="12" font-weight="700" fill="#0052CC" text-anchor="middle">front</text><line x1="383" y1="318" x2="383" y2="307" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="383" y="329" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">back</text><text x="448" y="282" dy="0.35em" font-size="14" font-weight="500" fill="#334155" text-anchor="start">the front item (10) leaves first</text>
</svg>
