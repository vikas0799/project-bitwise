<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-label="A binary tree where the lowest common ancestor of nodes 6 and 4 is node 5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A binary tree where the lowest common ancestor of nodes 6 and 4 is node 5</title>
