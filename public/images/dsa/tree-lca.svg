<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Lowest common ancestor (LCA) of 6 and 4 is 5</text><line x1="379.9" y1="95" x2="250.1" y2="153" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="420.1" y1="95" x2="549.9" y2="153" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="213.6" y1="176.7" x2="161.4" y2="223.3" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/><line x1="246.4" y1="176.7" x2="298.6" y2="223.3" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/><line x1="553.6" y1="176.7" x2="501.4" y2="223.3" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="586.4" y1="176.7" x2="638.6" y2="223.3" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="304.3" y1="257.2" x2="283.2" y2="294.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="325.7" y1="257.2" x2="346.8" y2="294.8" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/><circle cx="400" cy="86" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="400" y="86" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">3</text><circle cx="230" cy="162" r="22" fill="#D1FAE5" stroke="#059669" stroke-width="2.25"/><text x="230" y="162" dy="0.35em" font-size="16" font-weight="650" fill="#065F46" text-anchor="middle">5</text><circle cx="570" cy="162" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="570" y="162" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">1</text><circle cx="145" cy="238" r="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2.25"/><text x="145" y="238" dy="0.35em" font-size="16" font-weight="650" fill="#92400E" text-anchor="middle">6</text><circle cx="315" cy="238" r="22" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="315" y="238" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle">2</text><circle cx="485" cy="238" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="485" y="238" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">0</text><circle cx="655" cy="238" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="655" y="238" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">8</text><circle cx="272.5" cy="314" r="22" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="272.5" y="314" dy="0.35em" font-size="16" font-weight="650" fill="#0A1633" text-anchor="middle">7</text><circle cx="357.5" cy="314" r="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2.25"/><text x="357.5" y="314" dy="0.35em" font-size="16" font-weight="650" fill="#92400E" text-anchor="middle">4</text><rect x="32" y="360" width="16" height="16" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="54" y="368" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">the two nodes</text><rect x="169" y="360" width="16" height="16" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="191" y="368" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">their LCA</text><rect x="277.3" y="360" width="16" height="16" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="299.3" y="368" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">paths up to the LCA</text><text x="32" y="396" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">The LCA is the deepest node with both nodes in its subtree. A node counts as its own ancestor.</text>
</svg>
