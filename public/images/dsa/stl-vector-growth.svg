<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="A vector doubling its capacity from 1 to 8 as items are pushed" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A vector doubling its capacity from 1 to 8 as items are pushed</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="760" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">vector::push_back: when the vector is full, capacity doubles</text><text x="212" y="90" dy="0.35em" font-size="13" font-weight="600" fill="#334155" text-anchor="end">size 1, capacity 1</text><rect x="230" y="70" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="253" y="90" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><text x="212" y="162" dy="0.35em" font-size="13" font-weight="600" fill="#334155" text-anchor="end">size 2, capacity 2</text><rect x="230" y="142" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="253" y="162" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="276" y="142" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="299" y="162" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><text x="336" y="162" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="start">was full: copied into 2× space</text><text x="212" y="234" dy="0.35em" font-size="13" font-weight="600" fill="#334155" text-anchor="end">size 4, capacity 4</text><rect x="230" y="214" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="253" y="234" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="276" y="214" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="299" y="234" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><rect x="322" y="214" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="345" y="234" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><rect x="368" y="214" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="391" y="234" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">40</text><text x="428" y="234" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="start">was full: copied into 2× space</text><text x="212" y="306" dy="0.35em" font-size="13" font-weight="600" fill="#334155" text-anchor="end">size 5, capacity 8</text><rect x="230" y="286" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="253" y="306" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="276" y="286" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="299" y="306" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><rect x="322" y="286" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="345" y="306" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><rect x="368" y="286" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="391" y="306" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">40</text><rect x="414" y="286" width="46" height="40" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="437" y="306" dy="0.35em" font-size="15" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">50</text><rect x="460" y="286" width="46" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="506" y="286" width="46" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="552" y="286" width="46" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="612" y="306" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="start">was full: copied into 2× space</text><text x="32" y="356" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Copies happen only at sizes 1, 2, 4, 8, …, so push_back is O(1) on average (amortized).</text>
</svg>
