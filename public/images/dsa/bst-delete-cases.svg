<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" role="img" aria-label="Before and after pictures for deleting a leaf, a node with one child and a node with two children" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Before and after pictures for deleting a leaf, a node with one child and a node with two children</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="820" height="570" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Deleting from a BST: three cases</text><text x="32" y="82" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start">Case 1: a leaf</text><text x="32" y="108" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">No children:</text><text x="32" y="128" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">just remove it.</text><text x="400" y="72" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">before</text><line x1="387.4" y1="110.9" x2="367.6" y2="131.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="412.6" y1="110.9" x2="432.4" y2="131.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="400" cy="98" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="400" y="98" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">6</text><circle cx="355" cy="144" r="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.25"/><text x="355" y="144" dy="0.35em" font-size="14" font-weight="650" fill="#9F1239" text-anchor="middle">4</text><circle cx="445" cy="144" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="445" y="144" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">7</text><line x1="510" y1="136" x2="562" y2="136" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><text x="670" y="72" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">after</text><line x1="682.6" y1="110.9" x2="702.4" y2="131.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="670" cy="98" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="670" y="98" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">6</text><circle cx="715" cy="144" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="715" y="144" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">7</text><line x1="32" y1="226" x2="788" y2="226" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="252" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start">Case 2: one child</text><text x="32" y="278" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">One child: link the parent</text><text x="32" y="298" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">straight to that child.</text><text x="400" y="242" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">before</text><line x1="412.6" y1="280.9" x2="432.4" y2="301.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="437.1" y1="330.2" x2="430.4" y2="343.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="400" cy="268" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="400" y="268" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">10</text><circle cx="445" cy="314" r="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.25"/><text x="445" y="314" dy="0.35em" font-size="14" font-weight="650" fill="#9F1239" text-anchor="middle">14</text><circle cx="422.5" cy="360" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="422.5" y="360" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">13</text><line x1="510" y1="306" x2="562" y2="306" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><text x="670" y="242" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">after</text><line x1="682.6" y1="280.9" x2="702.4" y2="301.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="670" cy="268" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="670" y="268" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">10</text><circle cx="715" cy="314" r="18" fill="#D1FAE5" stroke="#059669" stroke-width="2.25"/><text x="715" y="314" dy="0.35em" font-size="14" font-weight="650" fill="#065F46" text-anchor="middle">13</text><line x1="32" y1="396" x2="788" y2="396" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="422" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start">Case 3: two children</text><text x="32" y="448" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">Copy in the inorder successor</text><text x="32" y="468" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">(smallest key on the right),</text><text x="32" y="488" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">then delete the successor.</text><text x="400" y="412" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">before</text><line x1="387.4" y1="450.9" x2="367.6" y2="471.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="412.6" y1="450.9" x2="432.4" y2="471.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="437.1" y1="500.2" x2="430.4" y2="513.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="452.9" y1="500.2" x2="459.6" y2="513.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="400" cy="438" r="18" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.25"/><text x="400" y="438" dy="0.35em" font-size="14" font-weight="650" fill="#9F1239" text-anchor="middle">3</text><circle cx="355" cy="484" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="355" y="484" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">1</text><circle cx="445" cy="484" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="445" y="484" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">6</text><circle cx="422.5" cy="530" r="18" fill="#FEF3C7" stroke="#D97706" stroke-width="2.25"/><text x="422.5" y="530" dy="0.35em" font-size="14" font-weight="650" fill="#92400E" text-anchor="middle">4</text><circle cx="467.5" cy="530" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="467.5" y="530" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">7</text><line x1="510" y1="476" x2="562" y2="476" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><text x="670" y="412" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">after</text><line x1="657.4" y1="450.9" x2="637.6" y2="471.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="682.6" y1="450.9" x2="702.4" y2="471.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="722.9" y1="500.2" x2="729.6" y2="513.8" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="670" cy="438" r="18" fill="#D1FAE5" stroke="#059669" stroke-width="2.25"/><text x="670" y="438" dy="0.35em" font-size="14" font-weight="650" fill="#065F46" text-anchor="middle">4</text><circle cx="625" cy="484" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="625" y="484" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">1</text><circle cx="715" cy="484" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="715" y="484" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">6</text><circle cx="737.5" cy="530" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="737.5" y="530" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">7</text>
</svg>
