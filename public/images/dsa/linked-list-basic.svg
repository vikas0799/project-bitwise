<rect width="780" height="220" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A singly linked list: each node points to the next</text><text x="58" y="115" dy="0.35em" font-size="15" font-weight="700" fill="#0052CC" text-anchor="middle">head</text><line x1="84" y1="115" x2="144" y2="115" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="202" y="76" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0x1A0</text><text x="382" y="76" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0x3F8</text><text x="562" y="76" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0x2C4</text><rect x="150" y="90" width="104" height="50" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><line x1="214" y1="90" x2="214" y2="140" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/><text x="182" y="115" dy="0.35em" font-size="18" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><circle cx="234" cy="115" r="4.5" fill="#0A1633" stroke="#0A1633" stroke-width="1"/><line x1="234" y1="115" x2="326" y2="115" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="330" y="90" width="104" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="394" y1="90" x2="394" y2="140" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="362" y="115" dy="0.35em" font-size="18" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">20</text><circle cx="414" cy="115" r="4.5" fill="#0A1633" stroke="#0A1633" stroke-width="1"/><line x1="414" y1="115" x2="506" y2="115" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="510" y="90" width="104" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><line x1="574" y1="90" x2="574" y2="140" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="542" y="115" dy="0.35em" font-size="18" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><circle cx="594" cy="115" r="4.5" fill="#0A1633" stroke="#0A1633" stroke-width="1"/><line x1="594" y1="115" x2="668" y2="115" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="704" y="115" dy="0.35em" font-size="15" font-weight="700" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">NULL</text><text x="182" y="156" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">data</text><text x="234" y="156" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">next</text><text x="32" y="196" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Nodes can sit anywhere in memory. Only the next pointers hold the list together.</text>
</svg>
