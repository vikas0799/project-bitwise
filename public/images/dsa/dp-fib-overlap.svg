</text><rect x="76.6" y="334" width="48" height="28" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="100.6" y="348" dy="0.35em" font-size="12" font-weight="650" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">f(0)</text><rect x="32" y="384" width="16" height="16" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="54" y="392" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">f(3) is solved 2 times</text><rect x="233.3" y="384" width="16" height="16" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="255.3" y="392" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">f(2) is solved 3 times</text><text x="32" y="420" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Save each answer the first time (memoise) and fib(n) needs O(n) calls instead of about O(2ⁿ).</text>
</svg>
