<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" role="img" aria-label="Inserting 45 into a max-heap and sifting it up past 10 and 30" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Inserting 45 into a max-heap and sifting it up past 10 and 30</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="820" height="410" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Insert 45 into a max-heap: add at the end, then sift up</text><text x="215" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">1. Add 45 at the next free spot</text><line x1="199.6" y1="119.1" x2="135.4" y2="164.9" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="230.4" y1="119.1" x2="294.6" y2="164.9" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="109.1" y1="191.6" x2="83.4" y2="228.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="130.9" y1="191.6" x2="156.6" y2="228.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="299.1" y1="191.6" x2="273.4" y2="228.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="320.9" y1="191.6" x2="346.6" y2="228.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="66.2" y1="261.9" x2="55" y2="294.1" stroke="#D97706" stroke-width="3" stroke-linecap="round"/><circle cx="215" cy="108" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="215" y="108" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">50</text><circle cx="120" cy="176" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="120" y="176" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">30</text><circle cx="310" cy="176" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="310" y="176" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">40</text><circle cx="72.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="72.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">10</text><circle cx="167.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="167.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">20</text><circle cx="262.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="262.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">35</text><circle cx="357.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="357.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">25</text><circle cx="48.8" cy="312" r="19" fill="#FEF3C7" stroke="#D97706" stroke-width="2.25"/><text x="48.8" y="312" dy="0.35em" font-size="14" font-weight="650" fill="#92400E" text-anchor="middle">45</text><line x1="405" y1="200" x2="428" y2="200" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><text x="620" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">2. Swap up while bigger than the parent</text><line x1="604.6" y1="119.1" x2="540.4" y2="164.9" stroke="#059669" stroke-width="3" stroke-linecap="round"/><line x1="635.4" y1="119.1" x2="699.6" y2="164.9" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="514.1" y1="191.6" x2="488.4" y2="228.4" stroke="#059669" stroke-width="3" stroke-linecap="round"/><line x1="535.9" y1="191.6" x2="561.6" y2="228.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="704.1" y1="191.6" x2="678.4" y2="228.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="725.9" y1="191.6" x2="751.6" y2="228.4" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="471.2" y1="261.9" x2="460" y2="294.1" stroke="#059669" stroke-width="3" stroke-linecap="round"/><circle cx="620" cy="108" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="620" y="108" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">50</text><circle cx="525" cy="176" r="19" fill="#D1FAE5" stroke="#059669" stroke-width="2.25"/><text x="525" y="176" dy="0.35em" font-size="14" font-weight="650" fill="#065F46" text-anchor="middle">45</text><circle cx="715" cy="176" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="715" y="176" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">40</text><circle cx="477.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="477.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">30</text><circle cx="572.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="572.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">20</text><circle cx="667.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="667.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">35</text><circle cx="762.5" cy="244" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="762.5" y="244" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">25</text><circle cx="453.8" cy="312" r="19" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="453.8" y="312" dy="0.35em" font-size="14" font-weight="650" fill="#0A1633" text-anchor="middle">10</text><text x="32" y="362" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">45 &gt; 10</tspan><tspan fill="#334155" font-weight="500"> swap,  </tspan><tspan fill="#0A1633" font-weight="700">45 &gt; 30</tspan><tspan fill="#334155" font-weight="500"> swap,  </tspan><tspan fill="#0A1633" font-weight="700">45 &lt; 50</tspan><tspan fill="#334155" font-weight="500"> stop</tspan></text><text x="32" y="390" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">At most one swap per level, so insert costs O(log n).</text>
</svg>
