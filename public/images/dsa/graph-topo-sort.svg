0" dy="0.35em" font-size="14" font-weight="650" fill="#065F46" text-anchor="middle">DBMS</text><rect x="153.1" y="260.3" width="37.8" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="172" y="270" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">in 0</text><rect x="344" y="119" width="132" height="42" rx="12" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="410" y="140" dy="0.35em" font-size="14" font-weight="650" fill="#003A91" text-anchor="middle">DSA</text><rect x="443.1" y="100.3" width="37.8" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="462" y="110" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">in 2</text><rect x="344" y="239" width="132" height="42" rx="12" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="410" y="260" dy="0.35em" font-size="14" font-weight="650" fill="#003A91" text-anchor="middle">Web Dev</text><rect x="443.1" y="220.3" width="37.8" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="462" y="230" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">in 2</text><rect x="614" y="179" width="132" height="42" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.25"/><text x="680" y="200" dy="0.35em" font-size="14" font-weight="650" fill="#5B21B6" text-anchor="middle">Projects</text><rect x="713.1" y="160.3" width="37.8" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="732" y="170" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">in 2</text><text x="32" y="364" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">One valid order: </tspan><tspan fill="#0A1633" font-weight="700">Maths → Programming → DBMS → DSA → Web Dev → Projects</tspan></text><text x="32" y="394" dy="0.35em" font-size="14" font-weight="500" fill="#64748B