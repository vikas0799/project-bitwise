<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" viewBox="0 0 780 290" role="img" aria-label="A one-dimensional DP table for climbing stairs with ways(5) built from ways(4) and ways(3)" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A one-dimensional DP table for climbing stairs with ways(5) built from ways(4) and ways(3)</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="780" height="290" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Climbing stairs: ways(i) = ways(i − 1) + ways(i − 2)</text><text x="104" y="175" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="end">ways</text><rect x="120" y="150" width="76" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="158" y="175" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><text x="158" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0</text><rect x="196" y="150" width="76" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="234" y="175" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><text x="234" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="272" y="150" width="76" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="310" y="175" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><text x="310" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="348" y="150" width="76" height="50" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="386" y="175" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><text x="386" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="424" y="150" width="76" height="50" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="462" y="175" dy="0.35em" font-size="18" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><text x="462" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">4</text><rect x="500" y="150" width="76" height="50" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="538" y="175" dy="0.35em" font-size="18" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">8</text><text x="538" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><rect x="576" y="150" width="76" height="50" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="614" y="175" dy="0.35em" font-size="18" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">13</text><text x="614" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">6</text><text x="104" y="214" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">step i</text><path d="M386 146 C386 96, 528 96, 528 144" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><path d="M462 146 C462 118, 538 118, 538 144" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="274" y="69.5" width="295.9" height="21" rx="10.5" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="422" y="80" dy="0.35em" font-size="13" font-weight="600" fill="#059669" text-anchor="middle">ways(5) = ways(4) + ways(3) = 5 + 3 = 8</text><text x="32" y="262" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Base cases ways(0) = ways(1) = 1. Each new answer reuses two stored ones, so the whole table is O(n).</text>
</svg>
