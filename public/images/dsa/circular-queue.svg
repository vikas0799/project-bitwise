<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="A circular queue of capacity 8 whose items wrap from slot 7 to slot 0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A circular queue of capacity 8 whose items wrap from slot 7 to slot 0</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="780" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Circular queue: the index wraps around with % capacity</text><rect x="221" y="78" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="250" y="98" dy="0.35em" font-size="16" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">30</text><text x="250" y="146" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0</text><rect x="311.5" y="115.5" width="58" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="340.5" y="135.5" dy="0.35em" font-size="16" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">41</text><text x="306.6" y="169.4" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><line x1="394.2" y1="81.8" x2="361.7" y2="114.3" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="407" y="71.9" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">rear</text><rect x="349" y="206" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.75" stroke-dasharray="4 4"/><text x="330" y="226" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="311.5" y="296.5" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.75" stroke-dasharray="4 4"/><text x="306.6" y="282.6" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="221" y="334" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.75" stroke-dasharray="4 4"/><text x="250" y="306" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">4</text><rect x="130.5" y="296.5" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.75" stroke-dasharray="4 4"/><text x="193.4" y="282.6" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><rect x="93" y="206" width="58" height="40" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.75"/><text x="122" y="226" dy="0.35em" font-size="16" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">15</text><text x="170" y="226" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">6</text><line x1="46" y1="226" x2="92" y2="226" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="28" y="226" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="middle">front</text><rect x="130.5" y="115.5" width="58" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="159.5" y="135.5" dy="0.35em" font-size="16" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">22</text><text x="193.4" y="169.4" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">7</text><text x="250" y="216" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">after slot 7</text><text x="250" y="238" dy="0.35em" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">comes slot 0</text><text x="470" y="150" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">capacity = 8</tspan></text><text x="470" y="182" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0052CC" font-weight="700">front = 6</tspan><tspan fill="#334155" font-weight="500">, </tspan><tspan fill="#059669" font-weight="700">rear = 1</tspan></text><text x="470" y="214" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">size = 4</tspan><tspan fill="#334155" font-weight="500"> (slots 6, 7, 0, 1)</tspan></text><text x="470" y="246" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">next push → slot </tspan><tspan fill="#0A1633" font-weight="700">(1 + 1) % 8 = 2</tspan></text><text x="470" y="278" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">No shifting, so push and pop are O(1)</tspan></text>
</svg>
