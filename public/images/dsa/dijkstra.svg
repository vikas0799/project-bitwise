<rect width="820" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Dijkstra from A: always settle the closest unsettled node</text><line x1="113.3" y1="188.4" x2="266.7" y2="111.6" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="180.4" y="139.5" width="19.3" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="190" y="150" dy="0.35em" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">4</text><line x1="113.3" y1="211.6" x2="266.7" y2="288.4" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/><rect x="180.4" y="239.5" width="19.3" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="190" y="250" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="middle">1</text><line x1="290" y1="274" x2="290" y2="126" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/><rect x="280.4" y="189.5" width="19.3" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="290" y="200" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="middle">2</text><line x1="313.5" y1="111.2" x2="476.5" y2="188.8" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/><rect x="385.4" y="139.5" width="19.3" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="395" y="150" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="middle">1</text><line x1="313.5" y1="288.8" x2="476.5" y2="211.2" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><rect x="385.4" y="239.5" width="19.3" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="395" y="250" dy="0.35em" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">5</text><line x1="526" y1="200" x2="674" y2="200" stroke="#0052CC" stroke-width="3" stroke-linecap="round"/><rect x="590.4" y="189.5" width="19.3" height="21" rx="10.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="600" y="200" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="middle">3</text><circle cx="90" cy="200" r="26" fill="#FEF3C7" stroke="#D97706" stroke-width="2.25"/><text x="90" y="200" dy="0.35em" font-size="16" font-weight="650" fill="#92400E" text-anchor="middle">A</text><rect x="63" y="145.8" width="54" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="90" y="156" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="middle">dist 0</text><circle cx="290" cy="100" r="26" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="290" y="100" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle">B</text><rect x="263" y="45.8" width="54" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="290" y="56" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="middle">dist 3</text><circle cx="290" cy="300" r="26" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="290" y="300" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle">C</text><rect x="263" y="333.8" width="54" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="290" y="344" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="middle">dist 1</text><circle cx="500" cy="200" r="26" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="500" y="200" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle">D</text><rect x="473" y="145.8" width="54" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="500" y="156" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="middle">dist 4</text><circle cx="700" cy="200" r="26" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="700" y="200" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle">E</text><rect x="673" y="145.8" width="54" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="700" y="156" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="middle">dist 7</text><text x="32" y="368" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">Settled in order: </tspan><tspan fill="#0A1633" font-weight="700">A (0) → C (1) → B (3) → D (4) → E (7)</tspan></text><text x="32" y="396" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">B is 4 by the direct edge, but 1 + 2 = 3 through C, so the path through C wins.</text>
</svg>
