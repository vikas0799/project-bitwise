ren</text><rect x="220" y="54" width="190" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><line x1="306.6" y1="93.9" x2="280.9" y2="124.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="323.4" y1="93.9" x2="349.1" y2="124.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="267.4" y1="146" x2="256.3" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="277.6" y1="146" x2="288.7" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="352.4" y1="146" x2="341.3" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="315" cy="84" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="315" y="84" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="272.5" cy="134" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="272.5" y="134" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="357.5" cy="134" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="357.5" y="134" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="251.3" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="251.3" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="293.8" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="293.8" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="336.3" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="336.3" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><text x="315" y="222" dy="0.35em" font-size="16" font-weight="700" fill="#0A1633" text-anchor="middle">Complete</text><text x="315" y="246" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">levels full except the last,</text><text x="315" y="264" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">which fills from the left</text><rect x="420" y="54" width="190" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><line x1="506.6" y1="93.9" x2="480.9" y2="124.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="523.4" y1="93.9" x2="549.1" y2="124.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="467.4" y1="146" x2="456.3" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="477.6" y1="146" x2="488.7" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="552.4" y1="146" x2="541.3" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="562.6" y1="146" x2="573.7" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="515" cy="84" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="515" y="84" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="472.5" cy="134" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="472.5" y="134" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="557.5" cy="134" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="557.5" y="134" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="451.3" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="451.3" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="493.8" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="493.8" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="536.3" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="536.3" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="578.8" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="578.8" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><text x="515" y="222" dy="0.35em" font-size="16" font-weight="700" fill="#0A1633" text-anchor="middle">Perfect</text><text x="515" y="246" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">every level is</text><text x="515" y="264" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">completely full</text><rect x="620" y="54" width="190" height="230" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/><line x1="723.4" y1="93.9" x2="749.1" y2="124.1" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><line x1="762.6" y1="146" x2="773.7" y2="172" stroke="#64748B" stroke-width="2" stroke-linecap="round"/><circle cx="715" cy="84" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="715" y="84" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="757.5" cy="134" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="757.5" y="134" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><circle cx="778.8" cy="184" r="13" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.25"/><text x="778.8" y="184" dy="0.35em" font-size="16" font-weight="650" fill="#003A91" text-anchor="middle"></text><text x="715" y="222" dy="0.35em" font-size="16" font-weight="700" fill="#0A1633" text-anchor="middle">Skewed</text><text x="715" y="246" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">one child per node,</text><text x="715" y="264" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">like a