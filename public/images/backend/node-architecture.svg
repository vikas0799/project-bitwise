<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-label="Layers of Node.js from your code through Node APIs, V8 and libuv to the operating system" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Layers of Node.js from your code through Node APIs, V8 and libuv to the operating system</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="860" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">How Node.js runs your JavaScript</text><rect x="40" y="60" width="520" height="52" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="300" y="77" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Your code: app.js</text><text x="300" y="95" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">routes, business logic, async/await</text><line x1="300" y1="116" x2="300" y2="138" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="40" y="140" width="520" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="300" y="157" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Node.js APIs</text><text x="300" y="175" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">http, fs, path, crypto, stream, events</text><line x1="170" y1="196" x2="170" y2="218" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="430" y1="196" x2="430" y2="218" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="40" y="220" width="250" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="165" y="246" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">V8 engine</text><text x="165" y="264" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">compiles and runs JS on ONE thread</text><rect x="310" y="220" width="250" height="70" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="435" y="246" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">libuv</text><text x="435" y="264" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">event loop + thread pool</text><line x1="300" y1="294" x2="300" y2="316" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="40" y="318" width="520" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="300" y="335" dy="0.35em" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">Operating system</text><text x="300" y="353" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">network sockets, files, timers</text><text x="590" y="76" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">Your JS runs on a single thread.</text><text x="590" y="100" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">Slow work (disk, network, crypto)</text><text x="590" y="124" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">is handed to libuv and the OS.</text><text x="590" y="148" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">When it finishes, a callback is</text><text x="590" y="172" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">queued and the event loop runs it.</text><text x="590" y="196" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start"></text><text x="590" y="220" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">So one Node process can serve</text><text x="590" y="244" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">thousands of connections, as long</text><text x="590" y="268" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">as you never block the thread with</text><text x="590" y="292" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">long CPU work.</text>
</svg>
