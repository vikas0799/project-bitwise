<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="A request passing through Express middleware to a route handler, with the auth and error paths" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A request passing through Express middleware to a route handler, with the auth and error paths</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Express: every request flows through a chain of middleware</text><rect x="32" y="80" width="140" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="102" y="105" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">request</text><line x1="174" y1="105" x2="196" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="200" y="80" width="140" height="50" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="270" y="105" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">express.json()</text><line x1="342" y1="105" x2="364" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="353" y="92" dy="0.35em" font-size="11" font-weight="500" fill="#0052CC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">next()</text><rect x="368" y="80" width="140" height="50" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="438" y="105" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">logger</text><line x1="510" y1="105" x2="532" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="521" y="92" dy="0.35em" font-size="11" font-weight="500" fill="#0052CC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">next()</text><rect x="536" y="80" width="140" height="50" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="606" y="105" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">requireAuth</text><line x1="678" y1="105" x2="700" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="689" y="92" dy="0.35em" font-size="11" font-weight="500" fill="#0052CC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">next()</text><rect x="704" y="80" width="140" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="774" y="105" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">route handler</text><line x1="774" y1="134" x2="774" y2="170" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="700" y="172" width="148" height="44" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="774" y="194" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">res.json(data)</text><path d="M 572 134 C 572 190, 520 206, 470 206" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-bad)"/><rect x="300" y="186" width="168" height="44" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="384" y="208" dy="0.35em" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">res.status(401)</text><text x="560" y="250" dy="0.35em" font-size="12" font-weight="500" fill="#E11D48" text-anchor="middle">no valid token: stop here</text><line x1="32" y1="276" x2="848" y2="276" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="300" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Error path: </tspan><tspan fill="#334155" font-weight="500">any middleware can call </tspan><tspan fill="#E11D48" font-weight="700">next(err)</tspan><tspan fill="#334155" font-weight="500"> (or throw in an async handler in Express 5)</tspan></text><rect x="32" y="314" width="360" height="36" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="212" y="332" dy="0.35em" font-size="12.5" font-weight="700" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">(err, req, res, next) =&gt; …  error handler</text><text x="410" y="332" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">defined last, with four parameters</text>
</svg>
