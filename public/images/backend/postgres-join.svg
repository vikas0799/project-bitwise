<rect width="880" height="480" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Relational data: a foreign key links tables, a JOIN combines them</text><text x="32" y="72" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">students</text><rect x="32" y="84" width="90" height="34" rx="0" fill="#E8F0FF" stroke="#0052CC" stroke-width="1"/><text x="77" y="101" dy="0.35em" font-size="13" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">id</text><rect x="122" y="84" width="90" height="34" rx="0" fill="#E8F0FF" stroke="#0052CC" stroke-width="1"/><text x="167" y="101" dy="0.35em" font-size="13" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">name</text><rect x="32" y="118" width="90" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="77" y="135" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="122" y="118" width="90" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="167" y="135" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Asha</text><rect x="32" y="152" width="90" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="77" y="169" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="122" y="152" width="90" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="167" y="169" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Ravi</text><rect x="32" y="186" width="90" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="77" y="203" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="122" y="186" width="90" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="167" y="203" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Meena</text><text x="420" y="72" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">enrolments</text><rect x="420" y="84" width="110" height="34" rx="0" fill="#D1FAE5" stroke="#059669" stroke-width="1"/><text x="475" y="101" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">id</text><rect x="530" y="84" width="110" height="34" rx="0" fill="#D1FAE5" stroke="#059669" stroke-width="1"/><text x="585" y="101" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">student_id</text><rect x="640" y="84" width="110" height="34" rx="0" fill="#D1FAE5" stroke="#059669" stroke-width="1"/><text x="695" y="101" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">course</text><rect x="420" y="118" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="475" y="135" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">10</text><rect x="530" y="118" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="585" y="135" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="640" y="118" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="695" y="135" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">dsa</text><rect x="420" y="152" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="475" y="169" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">11</text><rect x="530" y="152" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="585" y="169" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="640" y="152" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="695" y="169" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">react</text><rect x="420" y="186" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="475" y="203" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">12</text><rect x="530" y="186" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="585" y="203" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="640" y="186" width="110" height="34" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="695" y="203" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">dsa</text><path d="M 585 222 C 585 262, 77 262, 77 226" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-active)"/><rect x="214.5" y="242.3" width="231" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="330" y="252" dy="0.35em" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">student_id references students(id)</text><rect x="32" y="284" width="816" height="40" rx="10" fill="#0d1117" stroke="#0d1117" stroke-width="1.5"/><text x="48" y="304" dy="0.35em" font-size="13" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">SELECT s.name, e.course FROM students s JOIN enrolments e ON e.student_id = s.id;</text><text x="32" y="350" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">result</text><rect x="32" y="362" width="110" height="26" rx="0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="87" y="375" dy="0.35em" font-size="12.5" font-weight="600" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">name</text><rect x="142" y="362" width="110" height="26" rx="0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="197" y="375" dy="0.35em" font-size="12.5" font-weight="600" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">course</text><rect x="32" y="388" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="87" y="401" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Asha</text><rect x="142" y="388" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="197" y="401" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">dsa</text><rect x="32" y="414" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="87" y="427" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Asha</text><rect x="142" y="414" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="197" y="427" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">react</text><rect x="32" y="440" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="87" y="453" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Meena</text><rect x="142" y="440" width="110" height="26" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="197" y="453" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">dsa</text><text x="290" y="400" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">Ravi has no enrolments, so an inner JOIN leaves him out.</text><text x="290" y="424" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">Use LEFT JOIN to keep every student.</text>
