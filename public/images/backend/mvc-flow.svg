<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="Request flow through router, controller, model, database and view in an MVC Express app" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Request flow through router, controller, model, database and view in an MVC Express app</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="860" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">MVC in an Express app: each layer has one job</text><rect x="32" y="150" width="120" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="92" y="169" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Client</text><text x="92" y="187" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">browser / app</text><rect x="200" y="150" width="140" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="270" y="169" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Router</text><text x="270" y="187" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">routes/</text><rect x="390" y="150" width="150" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="465" y="169" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Controller</text><text x="465" y="187" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">controllers/</text><rect x="600" y="70" width="150" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="675" y="89" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Model</text><text x="675" y="107" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">models/</text><rect x="600" y="230" width="150" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="675" y="249" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">View</text><text x="675" y="267" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">views/ or JSON</text><rect x="770" y="70" width="70" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="805" y="98" dy="0.35em" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">DB</text><line x1="156" y1="170" x2="196" y2="170" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="176" y="158" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">HTTP</text><line x1="344" y1="178" x2="386" y2="178" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="544" y1="164" x2="596" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="596" y1="92" x2="544" y2="150" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arrow-good)"/><line x1="754" y1="98" x2="766" y2="98" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="544" y1="192" x2="596" y2="250" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 600 272 C 300 330, 120 300, 92 212" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-active)"/><text x="330" y="322" dy="0.35em" font-size="12.5" font-weight="600" fill="#D97706" text-anchor="middle">response: rendered HTML or JSON</text><text x="470" y="118" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" transform="rotate(-40 470 118)">asks for data</text><text x="32" y="62" dy="0.35em" font-size="12.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Router: </tspan><tspan fill="#334155" font-weight="500">maps URL + method to a controller</tspan></text><text x="32" y="84" dy="0.35em" font-size="12.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Controller: </tspan><tspan fill="#334155" font-weight="500">handles the request, no SQL, no HTML</tspan></text><text x="32" y="106" dy="0.35em" font-size="12.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Model: </tspan><tspan fill="#334155" font-weight="500">data rules and database access</tspan></text><text x="32" y="128" dy="0.35em" font-size="12.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">View: </tspan><tspan fill="#334155" font-weight="500">turns data into HTML (or send JSON)</tspan></text>
</svg>
