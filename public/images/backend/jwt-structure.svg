<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="The three dot-separated parts of a JSON Web Token and what each contains" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The three dot-separated parts of a JSON Web Token and what each contains</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="300" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Inside a JWT: header . payload . signature</text><rect x="32" y="62" width="200" height="36" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="132" y="80" dy="0.35em" font-size="12" font-weight="600" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">eyJhbGciOiJIUzI1NiJ9</text><text x="237" y="80" dy="0.35em" font-size="22" font-weight="800" fill="#0A1633" text-anchor="middle">.</text><text x="36" y="126" dy="0.35em" font-size="13.5" font-weight="700" fill="#9F1239" text-anchor="start">Header</text><text x="36" y="152" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{ &quot;alg&quot;: &quot;HS256&quot;,</text><text x="36" y="174" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  &quot;typ&quot;: &quot;JWT&quot; }</text><rect x="246" y="62" width="340" height="36" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="416" y="80" dy="0.35em" font-size="12" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">eyJzdWIiOiI0MiIsInJvbGUiOi…</text><text x="591" y="80" dy="0.35em" font-size="22" font-weight="800" fill="#0A1633" text-anchor="middle">.</text><text x="250" y="126" dy="0.35em" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="start">Payload (claims)</text><text x="250" y="152" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{ &quot;sub&quot;: &quot;42&quot;,</text><text x="250" y="174" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  &quot;role&quot;: &quot;student&quot;,</text><text x="250" y="196" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  &quot;exp&quot;: 1767225600 }</text><rect x="600" y="62" width="236" height="36" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="718" y="80" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">SflKxwRJSMeKKF2QT4fwpM</text><text x="604" y="126" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="start">Signature</text><text x="604" y="152" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HMAC-SHA256(</text><text x="604" y="174" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  header + &quot;.&quot; + payload,</text><text x="604" y="196" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  secret)</text><text x="32" y="244" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">The payload is only </tspan><tspan fill="#E11D48" font-weight="700">base64-encoded, not encrypted</tspan><tspan fill="#334155" font-weight="500">: anyone can read it, so never put passwords or secrets in it.</tspan></text><text x="32" y="270" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">The signature proves the token was issued by your server and not </tspan><tspan fill="#0A1633" font-weight="700">changed</tspan><tspan fill="#334155" font-weight="500">.</tspan></text>
</svg>
