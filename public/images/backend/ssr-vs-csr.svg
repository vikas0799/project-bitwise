<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Timelines comparing server-side rendering and client-side rendering" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Timelines comparing server-side rendering and client-side rendering</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Server-side vs client-side rendering: who builds the HTML?</text><text x="32" y="96" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="start">SSR (EJS, Next.js)</text><rect x="200" y="72" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="275" y="97" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">request page</text><line x1="352" y1="97" x2="366" y2="97" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="370" y="72" width="150" height="50" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="445" y="97" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">server gets data</text><line x1="522" y1="97" x2="536" y2="97" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="540" y="72" width="150" height="50" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="615" y="97" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">server sends full HTML</text><line x1="692" y1="97" x2="706" y2="97" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="710" y="72" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="785" y="97" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">JS adds interactivity</text><rect x="544.6" y="130.3" width="140.8" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="615" y="140" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">content visible here</text><text x="32" y="216" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="start">CSR (React SPA)</text><rect x="200" y="192" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="275" y="217" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">request page</text><line x1="352" y1="217" x2="366" y2="217" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="370" y="192" width="150" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="445" y="217" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">empty HTML + JS</text><line x1="522" y1="217" x2="536" y2="217" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="540" y="192" width="150" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="615" y="217" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">JS runs, fetches API</text><line x1="692" y1="217" x2="706" y2="217" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="710" y="192" width="150" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="785" y="217" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">JS renders content</text><rect x="714.6" y="250.3" width="140.8" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="785" y="260" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">content visible here</text><text x="32" y="318" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">SSR: faster first view and better SEO. CSR: simpler server, app-like navigation. Modern frameworks mix both.</text>
</svg>
