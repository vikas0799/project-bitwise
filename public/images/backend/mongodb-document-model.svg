<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="A MongoDB database, collection and example student document with embedded fields" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A MongoDB database, collection and example student document with embedded fields</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">MongoDB stores documents in collections, not rows in tables</text><rect x="32" y="62" width="180" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="122" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">database</text><text x="122" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">bitwise</text><line x1="122" y1="110" x2="122" y2="134" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="32" y="136" width="180" height="44" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="122" y="149" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">collection</text><text x="122" y="167" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">students</text><line x1="122" y1="184" x2="122" y2="208" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="32" y="210" width="180" height="44" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="122" y="223" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">documents</text><text x="122" y="241" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">one per student</text><rect x="250" y="62" width="330" height="234" rx="12" fill="#0d1117" stroke="#0d1117" stroke-width="1.5"/><text x="268" y="84" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{</text><text x="268" y="106" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  _id: ObjectId(&quot;66f1…&quot;),</text><text x="268" y="128" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  name: &quot;Asha&quot;,</text><text x="268" y="150" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  skills: [&quot;js&quot;, &quot;node&quot;],</text><text x="268" y="172" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  address: { city: &quot;Delhi&quot; },</text><text x="268" y="194" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  enrolments: [</text><text x="268" y="216" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">    { course: &quot;dsa&quot;, progress: 40 }</text><text x="268" y="238" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  ]</text><text x="268" y="260" dy="0.35em" font-size="12.5" font-weight="500" fill="#E6EDF3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">}</text><text x="610" y="80" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="start">Flexible shape:</text><text x="610" y="100" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">documents in one collection can differ</text><text x="610" y="136" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="start">Embedded data:</text><text x="610" y="156" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">address and enrolments live inside</text><text x="610" y="192" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="start">JSON-like:</text><text x="610" y="212" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">maps naturally to JS objects</text><text x="610" y="248" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="start">_id:</text><text x="610" y="268" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">unique id added automatically</text><text x="32" y="376" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">SQL equivalent: a students table plus separate addresses and enrolments tables joined by keys.</text>
</svg>
