<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The control plane with api-server, etcd, scheduler and controller manager manages worker nodes that run kubelet, kube-proxy and pods" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The control plane with api-server, etcd, scheduler and controller manager manages worker nodes that run kubelet, kube-proxy and pods</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A Kubernetes cluster: a control plane and worker nodes</text><rect x="32" y="170" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="87" y="189" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">you</text><text x="87" y="207" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">kubectl / CI</text><rect x="180" y="60" width="270" height="320" rx="12" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="315" y="84" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Control plane (the brain)</text><rect x="200" y="104" width="230" height="50" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="315" y="120" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">api-server</text><text x="315" y="138" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">the only front door</text><rect x="200" y="170" width="230" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="315" y="186" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">etcd</text><text x="315" y="204" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">stores the desired state</text><rect x="200" y="236" width="230" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="315" y="252" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">scheduler</text><text x="315" y="270" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">picks a node for each pod</text><rect x="200" y="302" width="230" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="315" y="318" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">controller manager</text><text x="315" y="336" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">loops that fix differences</text><line x1="146" y1="198" x2="196" y2="132" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="141.7" y="140.5" width="36.6" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="160" y="150" dy="0.35em" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">YAML</text><rect x="500" y="60" width="368" height="154" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="520" y="82" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">worker node 1</text><rect x="520" y="98" width="150" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="595" y="109" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">kubelet</text><text x="595" y="127" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">runs pods, reports health</text><rect x="520" y="150" width="150" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="595" y="161" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">kube-proxy</text><text x="595" y="179" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Service networking</text><rect x="690" y="98" width="78" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="729" y="109" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">pod</text><text x="729" y="127" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">api</text><rect x="778" y="98" width="78" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="817" y="109" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">pod</text><text x="817" y="127" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">api</text><rect x="690" y="150" width="78" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="729" y="161" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">pod</text><text x="729" y="179" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">api</text><line x1="434" y1="128" x2="500" y2="118" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="500" y="226" width="368" height="154" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="520" y="248" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">worker node 2</text><rect x="520" y="264" width="150" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="595" y="275" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">kubelet</text><text x="595" y="293" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">runs pods, reports health</text><rect x="520" y="316" width="150" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="595" y="327" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">kube-proxy</text><text x="595" y="345" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Service networking</text><rect x="690" y="264" width="78" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="729" y="275" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">pod</text><text x="729" y="293" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">api</text><rect x="778" y="264" width="78" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="817" y="275" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">pod</text><text x="817" y="293" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">api</text><rect x="690" y="316" width="78" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="729" y="327" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">pod</text><text x="729" y="345" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">new</text><line x1="434" y1="128" x2="500" y2="284" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="32" y="404" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">You declare what you want; controllers keep comparing it to what is running and act on any difference.</text>
</svg>
