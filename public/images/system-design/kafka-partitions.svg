<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A topic is split into partitions; the key picks the partition</text><text x="110" y="78" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">producer</text><rect x="40" y="96" width="140" height="38" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="110" y="115" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">key order-41</text><rect x="40" y="146" width="140" height="38" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="110" y="165" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">key order-42</text><rect x="40" y="196" width="140" height="38" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="110" y="215" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">key order-43</text><rect x="220" y="140" width="130" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="285" y="159" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">hash(key) %</text><text x="285" y="177" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">6 partitions</text><line x1="184" y1="115" x2="216" y2="168" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><line x1="184" y1="165" x2="216" y2="168" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><line x1="184" y1="215" x2="216" y2="168" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="398" y="83" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="end">P0</text><rect x="408" y="66" width="54" height="34" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="435" y="83" dy="0.35em" font-size="11.5" font-weight="500" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Libe