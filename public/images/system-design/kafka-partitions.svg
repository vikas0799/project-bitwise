t" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2  OrderShipped</text><text x="730" y="158" dy="0.35em" font-size="12" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3  OrderDelivered</text><text x="730" y="196" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="start">Same key → same partition</text><text x="730" y="216" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start">→ strict order for that key.</text><text x="730" y="248" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="start">No order between</text><text x="730" y="268" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start">different partitions.</text><text x="32" y="344" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Measured: three orders landed on partitions 2, 0 and 4, and each order’s four events kept their order.</text>
