<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="A short-lived access token expires, the client swaps its refresh token for a new pair, and reuse of an old refresh token revokes the whole family" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A short-lived access token expires, the client swaps its refresh token for a new pair, and reuse of an old refresh token revokes the whole family</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="500" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Access + refresh tokens with rotation and reuse detection</text><rect x="40" y="64" width="160" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="120" y="84" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Client</text><line x1="120" y1="104" x2="120" y2="476" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><rect x="360" y="64" width="160" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="440" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Auth API</text><text x="440" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">issues tokens</text><line x1="440" y1="104" x2="440" y2="476" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><rect x="680" y="64" width="160" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="760" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Token store</text><text x="760" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">refresh token family</text><line x1="760" y1="104" x2="760" y2="476" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><circle cx="90" cy="142" r="10" fill="#0A1633"/><text x="90" y="142" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="124" y1="142" x2="434" y2="142" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="136.2" y="120" width="287.5" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="280" y="130" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">API call with access token (lives 15 min)</text><circle cx="90" cy="186" r="10" fill="#0A1633"/><text x="90" y="186" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="436" y1="186" x2="126" y2="186" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-bad)"/><rect x="190" y="164" width="180" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="280" y="174" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">401: access token expired</text><circle cx="90" cy="230" r="10" fill="#0A1633"/><text x="90" y="230" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="124" y1="230" x2="434" y2="230" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="122.8" y="208" width="314.4" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="280" y="218" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">POST /auth/refresh (cookie: refresh token R1)</text><circle cx="90" cy="274" r="10" fill="#0A1633"/><text x="90" y="274" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="444" y1="274" x2="754" y2="274" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="466.3" y="252" width="267.4" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="600" y="262" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">R1 valid and unused? yes, mark it used</text><circle cx="90" cy="318" r="10" fill="#0A1633"/><text x="90" y="318" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><line x1="436" y1="318" x2="126" y2="318" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="156.4" y="296" width="247.2" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="280" y="306" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">new access token + refresh token R2</text><circle cx="90" cy="362" r="10" fill="#0A1633"/><text x="90" y="362" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><line x1="124" y1="362" x2="434" y2="362" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="186.6" y="340" width="186.7" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="280" y="350" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">a thief replays the old R1</text><circle cx="90" cy="406" r="10" fill="#0A1633"/><text x="90" y="406" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><line x1="444" y1="406" x2="754" y2="406" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="466.3" y="384" width="267.4" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="600" y="394" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">R1 was already used: revoke the family</text><circle cx="90" cy="450" r="10" fill="#0A1633"/><text x="90" y="450" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><line x1="436" y1="450" x2="126" y2="450" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-bad)"/><rect x="132.9" y="428" width="294.2" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="280" y="438" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">401: everyone on this family logs in again</text>
</svg>
