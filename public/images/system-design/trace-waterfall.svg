<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="A trace waterfall for an enroll request showing nested spans, where a database query takes most of the time" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A trace waterfall for an enroll request showing nested spans, where a database query takes most of the time</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="330" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A trace: one request, broken into timed spans</text><line x1="300" y1="64" x2="840" y2="64" stroke="#CBD5E1" stroke-width="1" stroke-linecap="round"/><line x1="300" y1="60" x2="300" y2="280" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="300" y="52" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">0 ms</text><line x1="435" y1="60" x2="435" y2="280" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="435" y="52" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">60 ms</text><line x1="570" y1="60" x2="570" y2="280" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="570" y="52" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">120 ms</text><line x1="705" y1="60" x2="705" y2="280" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="705" y="52" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">180 ms</text><line x1="840" y1="60" x2="840" y2="280" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="840" y="52" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">240 ms</text><text x="40" y="89" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">POST /api/courses/42/enroll</text><rect x="300" y="78" width="540" height="22" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="846" y="89" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="start">240 ms</text><text x="58" y="123" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">auth middleware</text><rect x="304.5" y="112" width="6.8" height="22" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="317.3" y="123" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="start">3 ms</text><text x="58" y="157" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">enroll (service)</text><rect x="313.5" y="146" width="517.5" height="22" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="837" y="157" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="start">230 ms</text><text x="76" y="191" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">SELECT … FOR UPDATE</text><rect x="318" y="180" width="477" height="22" rx="4" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="801" y="191" dy="0.35em" font-size="11" font-weight="600" fill="#E11D48" text-anchor="start">212 ms</text><text x="76" y="225" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">INSERT enrollments</text><rect x="797.3" y="214" width="13.5" height="22" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="816.8" y="225" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="start">6 ms</text><text x="76" y="259" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">enqueue welcome email</text><rect x="813" y="248" width="13.5" height="22" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="832.5" y="259" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="start">6 ms</text><text x="40" y="300" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">The database lock wait takes 212 of the 240 ms. Without a trace you would only know &quot;enroll is slow&quot;.</text>
</svg>
