<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Two withdraw calls interleave at their await points, both read 100, both pass the check, and both pay out" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Two withdraw calls interleave at their await points, both read 100, both pass the check, and both pay out</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A race condition with no threads at all</text><text x="32" y="104" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="start">withdraw(100) #1</text><rect x="210" y="80" width="150" height="48" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="285" y="104" dy="0.35em" font-size="11.5" font-weight="700" fill="#003A91" text-anchor="middle">read balance → 100</text><rect x="426" y="80" width="150" height="48" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="501" y="104" dy="0.35em" font-size="11.5" font-weight="700" fill="#003A91" text-anchor="middle">check 100 ≥ 100 ✓</text><rect x="642" y="80" width="150" height="48" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="717" y="104" dy="0.35em" font-size="11.5" font-weight="700" fill="#003A91" text-anchor="middle">write 100 − 100 = 0</text><text x="32" y="196" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="start">withdraw(100) #2</text><rect x="318" y="172" width="150" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="393" y="196" dy="0.35em" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">read balance → 100</text><rect x="534" y="172" width="150" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="609" y="196" dy="0.35em" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">check 100 ≥ 100 ✓</text><rect x="750" y="172" width="150" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="825" y="196" dy="0.35em" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">write 100 − 100 = 0</text><line x1="210" y1="300" x2="868" y2="300" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="540" y="320" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">time  (each &quot;await&quot; lets the other call run)</text><rect x="210" y="248" width="650" height="36" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="535" y="266" dy="0.35em" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">Both checks pass before either write: 200 paid out from a balance of 100</text>
</svg>
