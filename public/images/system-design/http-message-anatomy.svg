<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="An HTTP request and response, each with a start line, headers, a blank line and a JSON body" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>An HTTP request and response, each with a start line, headers, a blank line and a JSON body</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Every HTTP message has the same four parts</text><text x="32" y="66" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start">Request (client to server)</text><rect x="32" y="84" width="410" height="226" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="40" y="94" width="394" height="26" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1"/><text x="50" y="107" dy="0.35em" font-size="13.5" font-weight="500" fill="#003A91" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">POST /api/orders HTTP/1.1</text><text x="426" y="107" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">request line</text><rect x="40" y="124" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="50" y="137" dy="0.35em" font-size="13.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Host: api.foodapp.in</text><text x="426" y="137" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">headers</text><rect x="40" y="154" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="50" y="167" dy="0.35em" font-size="13.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Content-Type: application/json</text><rect x="40" y="184" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="50" y="197" dy="0.35em" font-size="13.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Authorization: Bearer eyJhbGc…</text><rect x="40" y="214" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="50" y="227" dy="0.35em" font-size="13.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Content-Length: 29</text><rect x="40" y="244" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/><text x="426" y="257" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">blank line</text><rect x="40" y="274" width="394" height="26" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1"/><text x="50" y="287" dy="0.35em" font-size="13.5" font-weight="500" fill="#065F46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{&quot;itemId&quot;: 12, &quot;quantity&quot;: 2}</text><text x="426" y="287" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">body</text><text x="458" y="66" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="start">Response (server to client)</text><rect x="458" y="84" width="410" height="196" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="466" y="94" width="394" height="26" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1"/><text x="476" y="107" dy="0.35em" font-size="13.5" font-weight="500" fill="#003A91" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HTTP/1.1 201 Created</text><text x="852" y="107" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">status line</text><rect x="466" y="124" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="476" y="137" dy="0.35em" font-size="13.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Content-Type: application/json</text><text x="852" y="137" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">headers</text><rect x="466" y="154" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="476" y="167" dy="0.35em" font-size="13.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Location: /api/orders/981</text><rect x="466" y="184" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="476" y="197" dy="0.35em" font-size="13.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Content-Length: 31</text><rect x="466" y="214" width="394" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4"/><text x="852" y="227" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">blank line</text><rect x="466" y="244" width="394" height="26" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1"/><text x="476" y="257" dy="0.35em" font-size="13.5" font-weight="500" fill="#065F46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{&quot;id&quot;: 981, &quot;status&quot;: &quot;placed&quot;}</text><text x="852" y="257" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="end">body</text><line x1="32" y1="336" x2="868" y2="336" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="360" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">The blank line </tspan><tspan fill="#334155" font-weight="500">tells the parser that the headers are over and the body starts.</tspan></text><text x="32" y="384" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Content-Length </tspan><tspan fill="#334155" font-weight="500">says how many bytes of body to read before the next message begins.</tspan></text>
</svg>
