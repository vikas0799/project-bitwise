<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Logs answer what happened, metrics show patterns over time, and traces show where a single request spent its time" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Logs answer what happened, metrics show patterns over time, and traces show where a single request spent its time</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="330" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The three pillars of observability</text><rect x="32" y="66" width="266" height="200" rx="14" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="165" y="96" dy="0.35em" font-size="18" font-weight="800" fill="#003A91" text-anchor="middle">Logs</text><text x="165" y="122" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="middle">What happened?</text><text x="165" y="158" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">one record per event</text><rect x="48" y="176" width="234" height="66" rx="8" fill="#FFFFFF" stroke="#0052CC" stroke-width="1"/><text x="58" y="198" dy="0.35em" font-size="11.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{&quot;level&quot;:&quot;warn&quot;,&quot;userId&quot;:7,</text><text x="58" y="220" dy="0.35em" font-size="11.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&quot;msg&quot;:&quot;enrollment failed&quot;}</text><rect x="318" y="66" width="266" height="200" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="451" y="96" dy="0.35em" font-size="18" font-weight="800" fill="#065F46" text-anchor="middle">Metrics</text><text x="451" y="122" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="middle">What is the pattern?</text><text x="451" y="158" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">numbers over time</text><rect x="334" y="176" width="234" height="66" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="344" y="198" dy="0.35em" font-size="11.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">820 req/s · 1.2% errors</text><text x="344" y="220" dy="0.35em" font-size="11.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">p99 latency 340 ms</text><rect x="604" y="66" width="266" height="200" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="737" y="96" dy="0.35em" font-size="18" font-weight="800" fill="#5B21B6" text-anchor="middle">Traces</text><text x="737" y="122" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="middle">Where did the time go?</text><text x="737" y="158" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">one request, end to end</text><rect x="620" y="176" width="234" height="66" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/><text x="630" y="198" dy="0.35em" font-size="11.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">API 240 ms → DB 220 ms</text><text x="630" y="220" dy="0.35em" font-size="11.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">← the slow step</text><text x="32" y="296" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Tie them together with one id: the same trace id in every log line and span lets you jump from an alert to the logs to the exact slow step.</text>
</svg>
