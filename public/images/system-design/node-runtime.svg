<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The Node.js main thread runs JavaScript, microtasks and the event loop, while libuv uses OS readiness APIs for sockets and a thread pool for files, DNS, crypto and compression" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The Node.js main thread runs JavaScript, microtasks and the event loop, while libuv uses OS readiness APIs for sockets and a thread pool for files, DNS, crypto and compression</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Inside Node.js: one JavaScript thread, plenty of help</text><rect x="32" y="60" width="300" height="290" rx="12" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="182" y="84" dy="0.35em" font-size="15" font-weight="700" fill="#003A91" text-anchor="middle">Main thread</text><rect x="56" y="104" width="252" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="182" y="121" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">your JavaScript</text><text x="182" y="139" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">handlers, callbacks, after-await code</text><rect x="56" y="176" width="252" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="182" y="193" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">microtasks</text><text x="182" y="211" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">promise callbacks, process.nextTick</text><rect x="56" y="248" width="252" height="76" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="182" y="277" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">event loop</text><text x="182" y="295" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">timers → poll (I/O) → check → close</text><rect x="400" y="60" width="468" height="290" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="634" y="84" dy="0.35em" font-size="15" font-weight="700" fill="#0A1633" text-anchor="middle">libuv</text><rect x="424" y="104" width="200" height="96" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="524" y="143" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">OS readiness</text><text x="524" y="161" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">epoll · kqueue · IOCP</text><text x="524" y="218" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">sockets: HTTP, DB, Redis</text><text x="524" y="236" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">no extra threads needed</text><rect x="644" y="104" width="200" height="96" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="744" y="130" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">thread pool</text><rect x="668" y="150" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><rect x="708" y="150" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><rect x="748" y="150" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><rect x="788" y="150" width="30" height="22" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/><text x="744" y="186" dy="0.35em" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">4 threads by default</text><text x="744" y="218" dy="0.35em" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">fs, dns.lookup, crypto, zlib</text><text x="744" y="236" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">resize: UV_THREADPOOL_SIZE</text><rect x="424" y="266" width="420" height="58" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="634" y="286" dy="0.35em" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">worker_threads</text><text x="634" y="304" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">your own CPU-heavy JavaScript on other cores</text><line x1="312" y1="276" x2="420" y2="160" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="420" y1="150" x2="312" y2="266" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="32" y="378" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">The event loop hands slow work to libuv and runs the callback when it finishes. Only your JavaScript is single-threaded.</text>
</svg>
