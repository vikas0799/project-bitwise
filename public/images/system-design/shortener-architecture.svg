<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="Browsers reach a CDN, a load balancer and stateless app servers with local caches; the servers use Redis for cache, ids and a click stream, and Postgres for links; a worker turns clicks into counts" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Browsers reach a CDN, a load balancer and stateless app servers with local caches; the servers use Redis for cache, ids and a click stream, and Postgres for links; a worker turns clicks into counts</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="460" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">URL shortener: the whole system</text><rect x="32" y="190" width="100" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="82" y="218" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">browser</text><rect x="170" y="190" width="110" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="225" y="209" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">CDN / edge</text><text x="225" y="227" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">caches redirects</text><rect x="318" y="190" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="373" y="209" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">load</text><text x="373" y="227" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">balancer</text><line x1="136" y1="218" x2="166" y2="218" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="284" y1="218" x2="314" y2="218" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="470" y="110" width="150" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="545" y="129" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">app server 1</text><text x="545" y="147" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">local LRU, id block</text><line x1="432" y1="218" x2="466" y2="138" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="470" y="190" width="150" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="545" y="209" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">app server 2</text><text x="545" y="227" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">local LRU, id block</text><line x1="432" y1="218" x2="466" y2="218" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="470" y="270" width="150" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="545" y="289" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">app server 3</text><text x="545" y="307" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">local LRU, id block</text><line x1="432" y1="218" x2="466" y2="298" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="690" y="80" width="180" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="780" y="99" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">Redis</text><text x="780" y="117" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">cache, id counter, clicks</text><rect x="690" y="200" width="180" height="70" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="780" y="217" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Postgres</text><text x="780" y="235" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">links table (primary</text><text x="780" y="253" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">+ read replicas)</text><rect x="690" y="330" width="180" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="780" y="349" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">analytics worker</text><text x="780" y="367" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">batches click events</text><rect x="470" y="380" width="150" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="545" y="396" dy="0.35em" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">analytics store</text><text x="545" y="414" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">ClickHouse, BigQuery</text><line x1="624" y1="138" x2="686" y2="108" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-special)"/><line x1="624" y1="218" x2="686" y2="230" stroke="#059669" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="780" y1="140" x2="780" y2="196" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><text x="788" y="168" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">misses</text><path d="M 870 108 C 900 108, 900 358, 874 358" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-active)"/><text x="886" y="240" dy="0.35em" font-size="11" font-weight="500" fill="#D97706" text-anchor="middle" transform="rotate(-90 886 240)">stream</text><line x1="686" y1="370" x2="624" y2="398" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-active)"/><line x1="780" y1="330" x2="780" y2="274" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arrow-active)"/><text x="788" y="304" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">click counts</text><text x="32" y="330" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Redirect path: edge → app (L1) → Redis → Postgres.</text><text x="32" y="352" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Clicks never touch the database on the request path.</text>
</svg>
