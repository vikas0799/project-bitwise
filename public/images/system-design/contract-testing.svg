<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" role="img" aria-label="The consumer test writes a contract file, the provider replays it against the real API; renaming a field the consumer uses makes provider verification fail" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The consumer test writes a contract file, the provider replays it against the real API; renaming a field the consumer uses makes provider verification fail</title>
