<rect width="900" height="312" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Contract testing: each side tested alone, against the same contract</text><text x="170" y="74" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle">Consumer’s CI</text><rect x="40" y="92" width="260" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="170" y="111" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">web-app tests</text><text x="170" y="129" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">run against a Pact mock provider</text><line x1="304" y1="120" x2="362" y2="120" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="366" y="88" width="168" height="64" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="450" y="111" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">contract file</text><text x="450" y="129" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">request → expected response</text><line x1="538" y1="120" x2="596" y2="120" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><text x="730" y="74" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">Provider’s CI</text><rect x="600" y="92" width="260" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="730" y="111" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">course-api verification</text><text x="730" y="129" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">replays the contract on the real API</text><text x="450" y="176" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">shared through a Pact Broker or the repository</text><rect x="40" y="206" width="400" height="82" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="240" y="230" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Provider unchanged</text><text x="240" y="254" dy="0.35em" font-size="12.5" font-weight="500" fill="#065F46" text-anchor="middle">✔ verification passes</text><rect x="460" y="206" width="400" height="82" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="660" y="230" dy="0.35em" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">Provider renames title → name</text><text x="660" y="254" dy="0.35em" font-size="12" font-weight="500" fill="#9F1239" text-anchor="middle">✖ &quot;Actual map is missing the following keys: title&quot;</text><text x="660" y="274" dy="0.35em" font-size="11.5" font-weight="500" fill="#9F1239" text-anchor="middle">caught before deploy, without running both services</text>
</svg>
