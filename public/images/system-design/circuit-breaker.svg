<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-label="The closed, open and half-open states of a circuit breaker and the transitions between them" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The closed, open and half-open states of a circuit breaker and the transitions between them</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="372" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Circuit breaker: stop calling a service that keeps failing</text><rect x="60" y="120" width="200" height="72" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="160" y="147" dy="0.35em" font-size="15" font-weight="700" fill="#065F46" text-anchor="middle">CLOSED</text><text x="160" y="165" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">calls go through normally</text><rect x="340" y="120" width="200" height="72" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="440" y="147" dy="0.35em" font-size="15" font-weight="700" fill="#9F1239" text-anchor="middle">OPEN</text><text x="440" y="165" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">fail fast, no calls sent</text><rect x="620" y="120" width="200" height="72" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="720" y="147" dy="0.35em" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">HALF-OPEN</text><text x="720" y="165" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">let one trial call through</text><line x1="264" y1="140" x2="336" y2="140" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="232.8" y="96.3" width="134.4" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="300" y="106" dy="0.35em" font-size="11.5" font-weight="600" fill="#E11D48" text-anchor="middle">N failures in a row</text><line x1="544" y1="140" x2="616" y2="140" stroke="#D97706" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-active)"/><rect x="525.7" y="96.3" width="108.6" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/><text x="580" y="106" dy="0.35em" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">cooldown passed</text><path d="M 720 196 C 720 250, 440 250, 440 198" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-bad)"/><rect x="496.7" y="228.3" width="166.6" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="580" y="238" dy="0.35em" font-size="11.5" font-weight="600" fill="#E11D48" text-anchor="middle">trial fails → open again</text><path d="M 700 196 C 660 340, 200 340, 160 198" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="349.9" y="294.3" width="160.1" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="430" y="304" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">trial succeeds → closed</text><text x="32" y="352" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">While open, return a fallback (cached data, a default, &quot;feature unavailable&quot;) instead of waiting on timeouts.</text>
</svg>
