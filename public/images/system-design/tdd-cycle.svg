<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="The TDD loop: write a failing test, make it pass with the simplest code, refactor with tests green, and repeat" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The TDD loop: write a failing test, make it pass with the simplest code, refactor with tests green, and repeat</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="300" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Test-driven development: red, green, refactor</text><circle cx="140" cy="140" r="56" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.5"/><text x="140" y="140" dy="0.35em" font-size="17" font-weight="700" fill="#9F1239" text-anchor="middle">Red</text><text x="140" y="222" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">write a test for the next small behaviour</text><text x="140" y="240" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">watch it fail</text><circle cx="450" cy="140" r="56" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/><text x="450" y="140" dy="0.35em" font-size="17" font-weight="700" fill="#065F46" text-anchor="middle">Green</text><text x="450" y="222" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">write the simplest code that makes it pass</text><circle cx="760" cy="140" r="56" fill="#E8F0FF" stroke="#0052CC" stroke-width="2.5"/><text x="760" y="140" dy="0.35em" font-size="17" font-weight="700" fill="#003A91" text-anchor="middle">Refactor</text><text x="760" y="222" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">clean up while all tests stay green</text><line x1="200" y1="140" x2="390" y2="140" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="510" y1="140" x2="700" y2="140" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><path d="M 760 84 C 760 50, 140 50, 140 80" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-bad)"/><rect x="373.4" y="49" width="153.1" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="450" y="59" dy="0.35em" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">repeat in small steps</text><text x="32" y="280" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Writing the test first forces you to decide the behaviour and the interface before the implementation.</text>
</svg>
