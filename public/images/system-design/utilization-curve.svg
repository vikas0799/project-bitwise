l="#E11D48" text-anchor="end">200 ms</text><text x="650" y="96" dy="0.35em" font-size="13" font-weight="700" fill="#334155" text-anchor="start">A request that takes 10 ms of work:</text><text x="650" y="118" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start"></text><text x="650" y="140" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">50% busy  → about 20 ms</text><text x="650" y="162" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">80% busy  → about 50 ms</text><text x="650" y="184" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">90% busy  → about 100 ms</text><text x="650" y="206" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">95% busy  → about 200 ms</text><text x="650" y="228" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start"></text><text x="650" y="250" dy="0.35em" font-size="13" font-weight="700" fill="#E11D48" text-anchor="start">The work never got slower.</text><text x="650" y="272" dy="0.35em" font-size="13" font-weight="700" fill="#E11D48" text-anchor="start">The time is spent waiting</text><text x="650" y="294" dy="0.35em" font-size="13" font-weight="700" fill="#E11D48" text-anchor="start">in the queue.</text>
</svg>
