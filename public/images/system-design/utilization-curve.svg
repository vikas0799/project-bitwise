<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Average time per request rising slowly up to about 70 percent utilization and then sharply as utilization approaches 100 percent" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Average time per request rising slowly up to about 70 percent utilization and then sharply as utilization approaches 100 percent</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Why servers slow down sharply as they get busy</text><line x1="90" y1="330" x2="620" y2="330" stroke="#0A1633" stroke-width="1.5" stroke-linecap="round"/><line x1="90" y1="330" x2="90" y2="70" stroke="#0A1633" stroke-width="1.5" stroke-linecap="round"/><text x="90" y="346" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">0%</text><text x="194" y="346" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">20%</text><text x="298" y="346" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">40%</text><text x="402" y="346" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">60%</text><text x="506" y="346" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">80%</text><text x="610" y="346" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">100%</text><text x="80" y="330" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end">0</text><text x="80" y="267.5" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end">100</text><line x1="90" y1="267.5" x2="610" y2="267.5" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="80" y="205" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end">200</text><line x1="90" y1="205" x2="610" y2="205" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="80" y="142.5" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end">300</text><line x1="90" y1="142.5" x2="610" y2="142.5" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="80" y="80" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="end">400</text><line x1="90" y1="80" x2="610" y2="80" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="350" y="368" dy="0.35em" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">utilization (how busy the server is)</text><text x="40" y="205" dy="0.35em" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 40 205)">time per request (ms)</text><rect x="402" y="80" width="104" height="250" rx="0" fill="#D1FAE5" stroke="none" stroke-width="1.5"/><text x="454" y="94" dy="0.35em" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">target zone</text><path d="M 90.0 323.8 L 92.6 323.7 L 95.2 323.7 L 97.8 323.7 L 100.4 323.6 L 103.0 323.6 L 105.6 323.6 L 108.2 323.5 L 110.8 323.5 L 113.4 323.5 L 116.0 323.4 L 118.6 323.4 L 121.2 323.4 L 123.8 323.3 L 126.4 323.3 L 129.0 323.2 L 131.6 323.2 L 134.2 323.2 L 136.8 323.1 L 139.4 323.1 L 142.0 323.1 L 144.6 323.0 L 147.2 323.0 L 149.8 322.9 L 152.4 322.9 L 155.0 322.9 L 157.6 322.8 L 160.2 322.8 L 162.8 322.7 L 165.4 322.7 L 168.0 322.6 L 170.6 322.6 L 173.2 322.6 L 175.8 322.5 L 178.4 322.5 L 181.0 322.4 L 183.6 322.4 L 186.2 322.3 L 188.8 322.3 L 191.4 322.2 L 194.0 322.2 L 196.6 322.1 L 199.2 322.1 L 201.8 322.0 L 204.4 322.0 L 207.0 321.9 L 209.6 321.9 L 212.2 321.8 L 214.8 321.8 L 217.4 321.7 L 220.0 321.7 L 222.6 321.6 L 225.2 321.6 L 227.8 321.5 L 230.4 321.4 L 233.0 321.4 L 235.6 321.3 L 238.2 321.3 L 240.8 321.2 L 243.4 321.1 L 246.0 321.1 L 248.6 321.0 L 251.2 320.9 L 253.8 320.9 L 256.4 320.8 L 259.0 320.7 L 261.6 320.7 L 264.2 320.6 L 266.8 320.5 L 269.4 320.5 L 272.0 320.4 L 274.6 320.3 L 277.2 320.2 L 279.8 320.2 L 282.4 320.1 L 285.0 320.0 L 287.6 319.9 L 290.2 319.8 L 292.8 319.8 L 295.4 319.7 L 298.0 319.6 L 300.6 319.5 L 303.2 319.4 L 305.8 319.3 L 308.4 319.2 L 311.0 319.1 L 313.6 319.0 L 316.2 318.9 L 318.8 318.8 L 321.4 318.7 L 324.0 318.6 L 326.6 318.5 L 329.2 318.4 L 331.8 318.3 L 334.4 318.2 L 337.0 318.1 L 339.6 318.0 L 342.2 317.9 L 344.8 317.7 L 347.4 317.6 L 350.0 317.5 L 352.6 317.4 L 355.2 317.2 L 357.8 317.1 L 36