<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Asha on server 1 and Ravi on server 2 are in the same room; server 1 publishes to Redis, which delivers to server 2, which sends to Ravi" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Asha on server 1 and Ravi on server 2 are in the same room; server 1 publishes to Redis, which delivers to server 2, which sends to Ravi</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Scaling WebSockets: servers share messages through a backplane</text><rect x="32" y="90" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="97" y="106" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">asha</text><text x="97" y="124" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">room sd-batch</text><rect x="32" y="230" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="97" y="246" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">ravi</text><text x="97" y="264" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">room sd-batch</text><rect x="32" y="300" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="97" y="316" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">meera</text><text x="97" y="334" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">room dsa-batch</text><rect x="250" y="84" width="170" height="62" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="335" y="106" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">server 1</text><text x="335" y="124" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">asha’s socket lives here</text><rect x="250" y="250" width="170" height="80" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="335" y="272" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">server 2</text><text x="335" y="290" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">ravi’s and meera’s</text><text x="335" y="308" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">sockets live here</text><line x1="166" y1="115" x2="246" y2="115" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)" marker-start="url(#arrow-plain)"/><line x1="166" y1="255" x2="246" y2="280" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)" marker-start="url(#arrow-plain)"/><line x1="166" y1="325" x2="246" y2="305" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)" marker-start="url(#arrow-plain)"/><rect x="540" y="168" width="160" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="620" y="194" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">Redis pub/sub</text><text x="620" y="212" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">channel room:sd-batch</text><line x1="424" y1="110" x2="536" y2="186" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="452.3" y="120.5" width="67.4" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="486" y="130" dy="0.35em" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">1 publish</text><line x1="536" y1="224" x2="424" y2="280" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="452.3" y="258.5" width="67.4" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="486" y="268" dy="0.35em" font-size="11" font-weight="600" fill="#7C3AED" text-anchor="middle">2 deliver</text><text x="710" y="96" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="start">Tested with two servers:</text><text x="710" y="120" dy="0.35em" font-size="12" font-weight="500" fill="#E11D48" text-anchor="start">backplane off: ravi misses it</text><text x="710" y="140" dy="0.35em" font-size="12" font-weight="500" fill="#059669" text-anchor="start">backplane on: ravi gets it</text><text x="710" y="160" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">meera (other room): never</text><text x="710" y="280" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">Each server only knows</text><text x="710" y="298" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">its own sockets; the bus</text><text x="710" y="316" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">makes them act as one.</text><text x="32" y="386" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Redis pub/sub is fire-and-forget; keep recent messages (a list or stream) so reconnecting clients can catch up.</text>
</svg>
