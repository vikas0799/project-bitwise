<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Design-first writes the spec before code and generates from it; code-first generates the spec from route code and schemas; both validate against it in CI" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Design-first writes the spec before code and generates from it; code-first generates the spec from route code and schemas; both validate against it in CI</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="330" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Design-first vs code-first</text><text x="32" y="94" dy="0.35em" font-size="13.5" font-weight="700" fill="#0052CC" text-anchor="start">Design-first</text><rect x="190" y="70" width="152" height="48" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="266" y="94" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">write openapi.yaml</text><line x1="344" y1="94" x2="358" y2="94" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="362" y="70" width="152" height="48" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="438" y="94" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">review with frontend</text><line x1="516" y1="94" x2="530" y2="94" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="534" y="70" width="152" height="48" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="610" y="94" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">generate types, mocks</text><line x1="688" y1="94" x2="702" y2="94" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="706" y="70" width="152" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="782" y="94" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">implement server</text><text x="32" y="184" dy="0.35em" font-size="13.5" font-weight="700" fill="#059669" text-anchor="start">Code-first</text><rect x="190" y="160" width="152" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="266" y="184" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">write routes + Zod</text><line x1="344" y1="184" x2="358" y2="184" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="362" y="160" width="152" height="48" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="438" y="184" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">generate the spec</text><line x1="516" y1="184" x2="530" y2="184" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="534" y="160" width="152" height="48" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="610" y="184" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">serve docs</text><line x1="688" y1="184" x2="702" y2="184" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="706" y="160" width="152" height="48" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="782" y="184" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">generate clients</text><rect x="190" y="242" width="668" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="524" y="260" dy="0.35em" font-size="12.5" font-weight="600" fill="#92400E" text-anchor="middle">Either way: keep the spec in git, validate requests and responses against it,</text><text x="524" y="278" dy="0.35em" font-size="12.5" font-weight="600" fill="#92400E" text-anchor="middle">and fail CI on breaking changes.</text><text x="32" y="266" dy="0.35em" font-size="13.5" font-weight="700" fill="#D97706" text-anchor="start">Both</text>
</svg>
