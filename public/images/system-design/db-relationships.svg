<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Three ways tables relate</text><text x="32" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">One-to-one</text><text x="32" y="90" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">each user has at most one profile</text><rect x="32" y="112" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.75"/><path d="M32 120 Q32 112 40 112 L214 112 Q222 112 222 120 L222 140 L32 140 Z" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.75"/><text x="127" y="126" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">users</text><text x="42" y="154" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">id</text><text x="212" y="154" dy="0.35em" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="end">PK</text><text x="42" y="176" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">email</text><text x="42" y="198" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">full_name</text><rect x="32" y="252" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.75"/><path d="M32 260 Q32 252 40 252 L214 252 Q222 252 222 260 L222 280 L32 280 Z" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="127" y="266" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">user_profiles</text><text x="42" y="294" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">user_id</text><text x="212" y="294" dy="0.35em" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="end">PK + FK</text><text x="42" y="316" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">bio</text><text x="42" y="338" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">phone</text><line x1="127" y1="210" x2="127" y2="250" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="137.2" y="220" width="45.6" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="160" y="230" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle">1 : 1</text><text x="300" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">One-to-many</text><text x="300" y="90" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">a course has many lessons</text><rect x="300" y="112" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.75"/><path d="M300 120 Q300 112 308 112 L482 112 Q490 112 490 120 L490 140 L300 140 Z" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.75"/><text x="395" y="126" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">courses</text><text x="310" y="154" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">id</text><text x="480" y="154" dy="0.35em" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="end">PK</text><text x="310" y="176" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">title</text><text x="310" y="198" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">slug</text><rect x="300" y="252" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.75"/><path d="M300 260 Q300 252 308 252 L482 252 Q490 252 490 260 L490 280 L300 280 Z" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="395" y="266" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">lessons</text><text x="310" y="294" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">id</text><text x="480" y="294" dy="0.35em" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="end">PK</text><text x="310" y="316" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">course_id</text><text x="480" y="316" dy="0.35em" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="end">FK</text><text x="310" y="338" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">position</text><line x1="395" y1="210" x2="395" y2="250" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="395.1" y="220" width="65.8" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="428" y="230" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle">1 : many</text><text x="568" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">Many-to-many</text><text x="568" y="90" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">students and courses, both ways</text><rect x="568" y="112" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.75"/><path d="M568 120 Q568 112 576 112 L690 112 Q698 112 698 120 L698 140 L568 140 Z" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.75"/><text x="633" y="126" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">users</text><text x="578" y="154" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">id</text><text x="688" y="154" dy="0.35em" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="end">PK</text><rect x="738" y="112" width="130" height="56" rx="8" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.75"/><path d="M738 120 Q738 112 746 112 L860 112 Q868 112 868 120 L868 140 L738 140 Z" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.75"/><text x="803" y="126" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">courses</text><text x="748" y="154" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">id</text><text x="858" y="154" dy="0.35em" font-size="10.5" font-weight="700" fill="#D97706" text-anchor="end">PK</text><rect x="618" y="252" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.75"/><path d="M618 260 Q618 252 626 252 L810 252 Q818 252 818 260 L818 280 L618 280 Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.75"/><text x="718" y="266" dy="0.35em" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">enrollments</text><text x="628" y="294" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">user_id</text><text x="808" y="294" dy="0.35em" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="end">PK + FK</text><text x="628" y="316" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">course_id</text><text x="808" y="316" dy="0.35em" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="end">PK + FK</text><text x="628" y="338" dy="0.35em" font-size="12.5" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">progress</text><line x1="633" y1="168" x2="680" y2="248" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="803" y1="168" x2="756" y2="248" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="32" y="382" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Many-to-many needs a linking table. The pair (user_id, course_id) is its primary key, so each enrollment exists only once.</text>
