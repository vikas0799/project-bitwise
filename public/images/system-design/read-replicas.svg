<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="App servers send writes to the primary and reads to replicas, which receive changes from the primary through asynchronous replication" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>App servers send writes to the primary and reads to replicas, which receive changes from the primary through asynchronous replication</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="390" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Read replicas: one primary for writes, copies for reads</text><rect x="40" y="160" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="115" y="191" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">app servers</text><text x="115" y="209" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">read/write router</text><rect x="340" y="64" width="190" height="64" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="435" y="87" dy="0.35em" font-size="15" font-weight="700" fill="#003A91" text-anchor="middle">primary</text><text x="435" y="105" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">all writes</text><rect x="620" y="166" width="190" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="715" y="185" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">replica 1</text><text x="715" y="203" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">read-only copy</text><rect x="620" y="266" width="190" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="715" y="285" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">replica 2</text><text x="715" y="303" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">read-only copy</text><line x1="194" y1="180" x2="336" y2="104" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="182.1" y="118.5" width="159.8" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="262" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#0052CC" text-anchor="middle">INSERT · UPDATE · DELETE</text><line x1="194" y1="214" x2="616" y2="194" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="194" y1="226" x2="616" y2="294" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="329.3" y="222.5" width="141.4" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="400" y="232" dy="0.35em" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">SELECT (most traffic)</text><path d="M 534 96 L 715 96 L 715 160" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-active)"/><path d="M 534 108 L 850 108 L 850 294 L 816 294" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow-active)"/><rect x="553.9" y="70.5" width="172.2" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="640" y="80" dy="0.35em" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">replication stream (async)</text><line x1="32" y1="340" x2="868" y2="340" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="364" dy="0.35em" font-size="12.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Replication lag: </tspan><tspan fill="#334155" font-weight="500">a replica is always slightly behind. Send a user’s reads to the primary right after they write.</tspan></text>
</svg>
