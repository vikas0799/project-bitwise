<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Vertical scaling replaces a small server with a bigger one, while horizontal scaling puts several stateless servers behind a load balancer" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Vertical scaling replaces a small server with a bigger one, while horizontal scaling puts several stateless servers behind a load balancer</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Scaling up vs scaling out</text><text x="210" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Vertical: a bigger machine</text><rect x="60" y="150" width="90" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="105" y="176" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">server</text><text x="105" y="194" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">2 CPU · 4 GB</text><line x1="154" y1="185" x2="196" y2="185" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="200" y="100" width="170" height="170" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="285" y="176" dy="0.35em" font-size="15" font-weight="700" fill="#003A91" text-anchor="middle">server</text><text x="285" y="194" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">32 CPU · 128 GB</text><text x="60" y="300" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Simple: no code changes.</text><text x="60" y="320" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">But there is a biggest machine, and one box can still fail.</text><line x1="450" y1="64" x2="450" y2="330" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="680" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Horizontal: more machines</text><rect x="480" y="150" width="110" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="535" y="176" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">load</text><text x="535" y="194" dy="0.35em" font-size="13.5" font-weight="500" fill="#64748B" text-anchor="middle">balancer</text><rect x="640" y="96" width="120" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="700" y="112" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">server 1</text><text x="700" y="130" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">stateless</text><line x1="594" y1="185" x2="636" y2="121" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="764" y1="121" x2="800" y2="185" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="640" y="160" width="120" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="700" y="176" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">server 2</text><text x="700" y="194" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">stateless</text><line x1="594" y1="185" x2="636" y2="185" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="764" y1="185" x2="800" y2="185" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="640" y="224" width="120" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="700" y="240" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">server 3</text><text x="700" y="258" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">stateless</text><line x1="594" y1="185" x2="636" y2="249" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="764" y1="249" x2="800" y2="185" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><rect x="804" y="160" width="70" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="839" y="185" dy="0.35em" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle">DB</text><text x="480" y="300" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">No ceiling, survives a server failing.</text><text x="480" y="320" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Needs stateless servers and shared data.</text>
</svg>
