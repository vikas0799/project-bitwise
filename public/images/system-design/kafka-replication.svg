<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A partition leader on broker 1 replicates to followers on brokers 2 and 3; with min.insync.replicas of 2, writes succeed with one broker down and are refused with two down" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A partition leader on broker 1 replicates to followers on brokers 2 and 3; with min.insync.replicas of 2, writes succeed with one broker down and are refused with two down</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Replication: one leader, followers in sync, acks=all</text><rect x="32" y="140" width="120" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="92" y="159" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">producer</text><text x="92" y="177" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">acks=all</text><rect x="260" y="70" width="190" height="58" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="355" y="90" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">broker 1</text><text x="355" y="108" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">partition 0: leader</text><rect x="260" y="160" width="190" height="58" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="355" y="180" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">broker 2</text><text x="355" y="198" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">partition 0: follower, in sync</text><rect x="260" y="250" width="190" height="58" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="355" y="270" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">broker 3</text><text x="355" y="288" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">partition 0: follower, in sync</text><line x1="156" y1="160" x2="256" y2="100" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="184.6" y="110.5" width="42.8" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="206" y="120" dy="0.35em" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">write</text><path d="M 355 132 L 355 156" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><path d="M 452 99 C 500 99, 500 279, 454 279" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><text x="522" y="190" dy="0.35em" font-size="11.5" font-weight="500" fill="#059669" text-anchor="start">copy</text><text x="560" y="82" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="start">min.insync.replicas = 2</text><text x="560" y="116" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">3 brokers up</text><text x="560" y="134" dy="0.35em" font-size="12" font-weight="500" fill="#059669" text-anchor="start">write OK</text><text x="560" y="160" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">broker 3 down</text><text x="560" y="178" dy="0.35em" font-size="12" font-weight="500" fill="#059669" text-anchor="start">new leaders elected, write OK</text><text x="560" y="204" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">brokers 2 and 3 down</text><text x="560" y="222" dy="0.35em" font-size="12" font-weight="500" fill="#E11D48" text-anchor="start">write refused: NotEnoughReplicas</text><text x="560" y="248" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">both restarted</text><text x="560" y="266" dy="0.35em" font-size="12" font-weight="500" fill="#059669" text-anchor="start">replicas catch up, write OK</text><text x="32" y="346" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">The write succeeds only when at least 2 copies have it, so losing one broker never loses an acknowledged write.</text>
</svg>
