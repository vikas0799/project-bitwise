<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="A client, CDN, load balancer, three stateless API servers and a database, labelled with the REST constraints each layer represents" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A client, CDN, load balancer, three stateless API servers and a database, labelled with the REST constraints each layer represents</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Fielding's constraints, in a real deployment</text><rect x="32" y="120" width="130" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="97" y="143" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Client</text><text x="97" y="161" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">React / mobile app</text><rect x="200" y="120" width="130" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="265" y="143" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">CDN</text><text x="265" y="161" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">caches responses</text><rect x="368" y="120" width="140" height="64" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="438" y="143" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Load balancer</text><text x="438" y="161" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">picks any server</text><rect x="548" y="70" width="150" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="623" y="86" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">API server A</text><text x="623" y="104" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">stateless</text><rect x="548" y="132" width="150" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="623" y="148" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">API server B</text><text x="623" y="166" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">stateless</text><rect x="548" y="194" width="150" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="623" y="210" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">API server C</text><text x="623" y="228" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">stateless</text><rect x="738" y="120" width="130" height="64" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="803" y="143" dy="0.35em" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">Database</text><text x="803" y="161" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">shared state</text><line x1="166" y1="152" x2="196" y2="152" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="334" y1="152" x2="364" y2="152" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="512" y1="152" x2="544" y2="95" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="702" y1="95" x2="734" y2="152" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="512" y1="152" x2="544" y2="157" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="702" y1="157" x2="734" y2="152" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="512" y1="152" x2="544" y2="219" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="702" y1="219" x2="734" y2="152" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="40" y="268" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Client-server: </tspan><tspan fill="#334155" font-weight="500">the UI and the data/logic live apart and change independently.</tspan></text><text x="40" y="290" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Layered system: </tspan><tspan fill="#334155" font-weight="500">the client only talks to the next layer; it can't tell a CDN from the origin.</tspan></text><text x="40" y="312" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Cacheable: </tspan><tspan fill="#334155" font-weight="500">every response says whether it may be stored (Cache-Control, ETag).</tspan></text><text x="40" y="334" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Stateless: </tspan><tspan fill="#334155" font-weight="500">each request carries everything, so any API server can answer it.</tspan></text><text x="40" y="356" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Uniform interface: </tspan><tspan fill="#334155" font-weight="500">resources at URLs, HTTP methods, self-describing JSON, everywhere.</tspan></text>
</svg>
