<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Latency of CPU caches, RAM, SSD, hard disk and an India to US network round trip, with the same times scaled so an L1 read takes one second" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Latency of CPU caches, RAM, SSD, hard disk and an India to US network round trip, with the same times scaled so an L1 read takes one second</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">How long things take, and the same times scaled up to human size</text><text x="32" y="66" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">If one L1 cache read took 1 second…</text><text x="32" y="103" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">L1 CPU cache</text><text x="252" y="103" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">~1 ns</text><rect x="340" y="91" width="46" height="24" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="396" y="103" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="start">1 second</text><text x="32" y="147" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">L2 CPU cache</text><text x="252" y="147" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">~4 ns</text><rect x="340" y="135" width="73.6" height="24" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="423.6" y="147" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="start">4 seconds</text><text x="32" y="191" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">L3 CPU cache</text><text x="252" y="191" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">~15 ns</text><rect x="340" y="179" width="101.2" height="24" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="451.2" y="191" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="start">15 seconds</text><text x="32" y="235" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">RAM (Redis lives here)</text><text x="252" y="235" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">~100 ns</text><rect x="340" y="223" width="138" height="24" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="488" y="235" dy="0.35em" font-size="13" font-weight="600" fill="#92400E" text-anchor="start">~2 minutes</text><text x="32" y="279" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">SSD read</text><text x="252" y="279" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">~100 µs</text><rect x="340" y="267" width="276" height="24" rx="6" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="626" y="279" dy="0.35em" font-size="13" font-weight="600" fill="#003A91" text-anchor="start">~1 day</text><text x="32" y="323" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">Hard disk seek</text><text x="252" y="323" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">~10 ms</text><rect x="340" y="311" width="368" height="24" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="718" y="323" dy="0.35em" font-size="13" font-weight="600" fill="#5B21B6" text-anchor="start">~4 months</text><text x="32" y="367" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">India → US round trip</text><text x="252" y="367" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">~200 ms</text><rect x="340" y="355" width="427.8" height="24" rx="6" fill="#FFE4E6" stroke="#E11D48" stroke-width="1.5"/><text x="777.8" y="367" dy="0.35em" font-size="13" font-weight="600" fill="#9F1239" text-anchor="start">~6 years</text><text x="32" y="404" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Bar lengths are on a log scale. Each step down is roughly 10 to 1,000 times slower than the one above.</text>
</svg>
