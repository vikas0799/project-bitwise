<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="The backend holds identity, run state and limits, sends messages to the model, and validates, authorizes and executes any tool call the model proposes before returning the result" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The backend holds identity, run state and limits, sends messages to the model, and validates, authorizes and executes any tool call the model proposes before returning the result</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The backend owns the loop. The model proposes the next step.</text><rect x="32" y="60" width="836" height="280" rx="14" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="60" y="86" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="start">Your backend</text><rect x="56" y="110" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="141" y="131" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">authenticated user</text><text x="141" y="149" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">and tenant (trusted)</text><rect x="56" y="190" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="141" y="211" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">run state</text><text x="141" y="229" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">messages, steps, budget</text><rect x="56" y="270" width="170" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="141" y="286" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">limits</text><text x="141" y="304" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">steps, time, tool calls</text><rect x="350" y="150" width="200" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="450" y="177" dy="0.35em" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">model</text><text x="450" y="195" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">proposes: answer, or</text><text x="450" y="213" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">call tool X with args Y</text><line x1="230" y1="175" x2="346" y2="185" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="235" y="156.8" width="106.1" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="288" y="166" dy="0.35em" font-size="10.5" font-weight="600" fill="#0052CC" text-anchor="middle">messages + tools</text><rect x="668" y="104" width="180" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="758" y="120" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">validate arguments</text><text x="758" y="138" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">JSON Schema</text><rect x="668" y="166" width="180" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="758" y="182" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">authorize</text><text x="758" y="200" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">is this user allowed?</text><rect x="668" y="228" width="180" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="758" y="244" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">execute allowlisted tool</text><text x="758" y="262" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">timeout, idempotency key</text><rect x="668" y="290" width="180" height="40" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="758" y="310" dy="0.35em" font-size="12" font-weight="700" fill="#9F1239" text-anchor="middle">approval for risky writes</text><line x1="554" y1="180" x2="664" y2="129" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="580.5" y="130.8" width="59" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="610" y="140" dy="0.35em" font-size="10.5" font-weight="600" fill="#7C3AED" text-anchor="middle">tool_use</text><line x1="758" y1="154" x2="758" y2="162" stroke="#D97706" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-active)"/><line x1="758" y1="216" x2="758" y2="224" stroke="#D97706" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-active)"/><path d="M 664 253 C 600 253, 560 230, 554 220" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="565.7" y="252.8" width="76.7" height="18.5" rx="9.25" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="604" y="262" dy="0.35em" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">tool_result</text><text x="32" y="372" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">The model never gets a database connection, a URL to build, or the power to approve its own actions.</text>
</svg>
