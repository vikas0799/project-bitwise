<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="A loop of inspect, plan, act, observe and evaluate, with exits for a final answer, approval, step limit, deadline, and refusal or truncation" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A loop of inspect, plan, act, observe and evaluate, with exits for a final answer, approval, step limit, deadline, and refusal or truncation</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Loop engineering: inspect, plan, act, observe, evaluate</text><ellipse cx="290" cy="215" rx="180" ry="128" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/><rect x="212" y="61" width="156" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="290" y="78" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">Inspect</text><text x="290" y="96" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">state, identity, budget</text><rect x="383.2" y="149.4" width="156" height="52" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="461.2" y="166.4" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">Plan</text><text x="461.2" y="184.4" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">model proposes a step</text><rect x="317.8" y="292.6" width="156" height="52" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="395.8" y="309.6" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Act</text><text x="395.8" y="327.6" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">validate + run tools</text><rect x="106.2" y="292.6" width="156" height="52" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="184.2" y="309.6" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Observe</text><text x="184.2" y="327.6" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">append a bounded result</text><rect x="40.8" y="149.4" width="156" height="52" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="118.8" y="166.4" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">Evaluate</text><text x="118.8" y="184.4" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">done? allowed to continue?</text><text x="290" y="207" dy="0.35em" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">one step</text><text x="290" y="227" dy="0.35em" font-size="13" font-weight="600" fill="#64748B" text-anchor="middle">per iteration</text><text x="560" y="82" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">Every loop needs exits:</text><text x="560" y="114" dy="0.35em" font-size="13" font-weight="700" fill="#059669" text-anchor="start">answer</text><text x="560" y="132" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">the model replies with no tool call</text><text x="560" y="160" dy="0.35em" font-size="13" font-weight="700" fill="#D97706" text-anchor="start">approval</text><text x="560" y="178" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">a risky write waits for a person</text><text x="560" y="206" dy="0.35em" font-size="13" font-weight="700" fill="#E11D48" text-anchor="start">step limit</text><text x="560" y="224" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">too many iterations: typed failure</text><text x="560" y="252" dy="0.35em" font-size="13" font-weight="700" fill="#E11D48" text-anchor="start">deadline</text><text x="560" y="270" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">too much wall-clock time</text><text x="560" y="298" dy="0.35em" font-size="13" font-weight="700" fill="#E11D48" text-anchor="start">refusal / truncation</text><text x="560" y="316" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="start">check stop_reason first</text><text x="32" y="386" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">An agent’s reliability comes from the loop’s state, limits and stop conditions, not from giving the model more freedom.</text>
</svg>
