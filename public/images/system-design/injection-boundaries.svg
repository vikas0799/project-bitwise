<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="User input flows through the backend into SQL, shell commands and HTML, where it can become SQL injection, command injection or XSS" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>User input flows through the backend into SQL, shell commands and HTML, where it can become SQL injection, command injection or XSS</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Injection: user data crossing into another language and running as code</text><rect x="32" y="150" width="150" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="107" y="173" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">User input</text><text x="107" y="191" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">forms, URLs, headers</text><rect x="310" y="140" width="180" height="84" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="400" y="173" dy="0.35em" font-size="14.5" font-weight="700" fill="#003A91" text-anchor="middle">Your backend</text><text x="400" y="191" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">speaks several languages</text><line x1="186" y1="182" x2="306" y2="182" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="640" y="70" width="230" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="755" y="88" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Database</text><text x="755" y="106" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">SQL</text><line x1="494" y1="182" x2="636" y2="97" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="518.1" y="129.2" width="95.7" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="566" y="138.9" dy="0.35em" font-size="11.5" font-weight="600" fill="#E11D48" text-anchor="middle">SQL injection</text><rect x="640" y="160" width="230" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="755" y="178" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Operating system</text><text x="755" y="196" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">shell commands</text><line x1="494" y1="182" x2="636" y2="187" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="505.3" y="174.8" width="121.5" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="566" y="184.5" dy="0.35em" font-size="11.5" font-weight="600" fill="#E11D48" text-anchor="middle">command injection</text><rect x="640" y="250" width="230" height="54" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="755" y="268" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Browser</text><text x="755" y="286" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">HTML + JavaScript</text><line x1="494" y1="182" x2="636" y2="277" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="550.3" y="220.4" width="31.3" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="566" y="230.2" dy="0.35em" font-size="11.5" font-weight="600" fill="#E11D48" text-anchor="middle">XSS</text><line x1="32" y1="318" x2="868" y2="318" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="340" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#0A1633" font-weight="700">The fix is always the same idea: </tspan><tspan fill="#334155" font-weight="500">keep data and code separate (parameters, argument arrays, escaping and sanitising).</tspan></text>
</svg>
