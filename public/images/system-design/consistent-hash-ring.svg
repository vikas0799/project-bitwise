<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="A hash ring with four shards and a new fifth shard; only the keys in the arc before the new shard move to it" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A hash ring with four shards and a new fifth shard; only the keys in the arc before the new shard move to it</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="430" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Consistent hashing: adding a shard moves only its neighbour’s keys</text><circle cx="230" cy="236" r="140" fill="none" stroke="#CBD5E1" stroke-width="10"/><path d="M 361.6 283.9 A 140 140 0 0 1 289.2 362.9" fill="none" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="277.9" cy="104.4" r="11" fill="#0052CC" stroke="#FFFFFF" stroke-width="2"/><text x="289.5" y="72.5" dy="0.35em" font-size="13" font-weight="700" fill="#0052CC" text-anchor="middle">s0</text><circle cx="361.6" cy="283.9" r="11" fill="#0052CC" stroke="#FFFFFF" stroke-width="2"/><text x="393.5" y="295.5" dy="0.35em" font-size="13" font-weight="700" fill="#0052CC" text-anchor="middle">s1</text><circle cx="182.1" cy="367.6" r="11" fill="#0052CC" stroke="#FFFFFF" stroke-width="2"/><text x="170.5" y="399.5" dy="0.35em" font-size="13" font-weight="700" fill="#0052CC" text-anchor="middle">s2</text><circle cx="98.4" cy="188.1" r="11" fill="#0052CC" stroke="#FFFFFF" stroke-width="2"/><text x="66.5" y="176.5" dy="0.35em" font-size="13" font-weight="700" fill="#0052CC" text-anchor="middle">s3</text><circle cx="289.2" cy="362.9" r="11" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/><text x="303.5" y="393.7" dy="0.35em" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">s4 (new)</text><circle cx="337.2" cy="146" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="367.9" cy="211.7" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="340.3" cy="322.2" r="5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="316.2" cy="346.3" r="5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="249.5" cy="374.6" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="215.4" cy="375.2" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="108.8" cy="306" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="90.1" cy="240.9" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="140" cy="128.8" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="205.7" cy="98.1" r="5" fill="#0A1633" stroke="#FFFFFF" stroke-width="1.5"/><text x="230" y="226" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">hash(key) lands on the ring;</text><text x="230" y="246" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">walk clockwise to a shard</text><text x="470" y="104" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">Going from 4 to 5 shards, 100,000 keys:</text><text x="470" y="128" dy="0.35em" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start"></text><text x="470" y="152" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">hash(key) % shards</text><text x="470" y="176" dy="0.35em" font-size="13.5" font-weight="600" fill="#E11D48" text-anchor="start">79.7% of keys move to a different shard</text><text x="470" y="200" dy="0.35em" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start"></text><text x="470" y="224" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">consistent hashing (100 virtual nodes each)</text><text x="470" y="248" dy="0.35em" font-size="13.5" font-weight="600" fill="#059669" text-anchor="start">19.8% of keys move, all of them to the new shard</text><text x="470" y="272" dy="0.35em" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start"></text><text x="470" y="296" dy="0.35em" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start">Only the keys in the purple arc change owner.</text><text x="470" y="320" dy="0.35em" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start">Virtual nodes spread each shard around the</text><text x="470" y="344" dy="0.35em" font-size="13.5" font-weight="500" fill="#334155" text-anchor="start">ring so the load stays even.</text>
</svg>
