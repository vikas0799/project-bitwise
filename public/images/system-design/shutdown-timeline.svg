<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="After SIGTERM the app stops taking new traffic, drains in-flight requests, stops workers and closes the database and Redis before exiting, well before the SIGKILL deadline" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>After SIGTERM the app stops taking new traffic, drains in-flight requests, stops workers and closes the database and Redis before exiting, well before the SIGKILL deadline</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Graceful shutdown: what happens after SIGTERM</text><line x1="60" y1="300" x2="860" y2="300" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="60" y="318" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">0 s</text><text x="800" y="318" dy="0.35em" font-size="11.5" font-weight="700" fill="#E11D48" text-anchor="middle">30 s (grace period)</text><line x1="800" y1="80" x2="800" y2="300" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="740" y="64" width="120" height="46" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="800" y="78" dy="0.35em" font-size="13.5" font-weight="700" fill="#9F1239" text-anchor="middle">SIGKILL</text><text x="800" y="96" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">no cleanup</text><rect x="40" y="130" width="110" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="95" y="149" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">SIGTERM</text><text x="95" y="167" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">or Ctrl+C (SIGINT)</text><rect x="166" y="130" width="146" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="239" y="149" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">1. stop new traffic</text><text x="239" y="167" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">readiness 503, close port</text><line x1="239" y1="190" x2="239" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="318" y="206" width="146" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="391" y="225" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">2. drain</text><text x="391" y="243" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">finish in-flight requests</text><line x1="391" y1="266" x2="391" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="470" y="130" width="146" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="543" y="149" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">3. stop workers</text><text x="543" y="167" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">finish the current job</text><line x1="543" y1="190" x2="543" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="622" y="206" width="146" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="695" y="225" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">4. close DB, then Redis</text><text x="695" y="243" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">reverse order of opening</text><line x1="695" y1="266" x2="695" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><text x="735" y="286" dy="0.35em" font-size="12.5" font-weight="700" fill="#059669" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">exit(0)</text><text x="32" y="350" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Finish well inside the grace period. If cleanup hangs, exit yourself before the platform sends SIGKILL.</text>
</svg>
