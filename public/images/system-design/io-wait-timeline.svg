<rect width="900" height="336" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">One API request: a little computing, a lot of waiting</text><text x="136" y="92" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="end">request 1</text><rect x="150" y="76" width="5" height="32" rx="3" fill="#0052CC" stroke="#0052CC" stroke-width="1"/><rect x="155" y="76" width="125" height="32" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/><text x="217.5" y="92" dy="0.35em" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="middle">DB query</text><rect x="280" y="76" width="5" height="32" rx="3" fill="#0052CC" stroke="#0052CC" stroke-width="1"/><rect x="285" y="76" width="125" height="32" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/><text x="347.5" y="92" dy="0.35em" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="middle">DB query</text><rect x="410" y="76" width="5" height="32" rx="3" fill="#0052CC" stroke="#0052CC" stroke-width="1"/><rect x="415" y="76" width="125" height="32" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/><text x="477.5" y="92" dy="0.35em" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="middle">Redis + DB</text><rect x="540" y="76" width="5" height="32" rx="3" fill="#0052CC" stroke="#0052CC" stroke-width="1"/><rect x="545" y="76" width="125" height="32" rx="3" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/><text x="607.5" y="92" dy="0.35em" font-size="11.5" font-weight="600" fill="#92400E" text-anchor="middle">email API</text><rect x="670" y="76" width="5" height="32" rx="3" fill="#0052CC" stroke="#0052CC" stroke-width="1"/><text x="150" y="130" dy="0.35em" font-size="12.5" font-weight="700" fill="#0052CC" text-anchor="start">CPU busy ~10 ms</text><text x="675" y="130" dy="0.35em" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="end">waiting ~200 ms</text><line x1="32" y1="160" x2="868" y2="160" stroke="#E2E8F0" stroke-width="1" strok