<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336" role="img" aria-label="One request spends about 10 ms computing and about 200 ms waiting for I/O; with concurrency, other requests use the CPU during the waits" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>One request spends about 10 ms computing and about 200 ms waiting for I/O; with concurrency, other requests use the CPU during the waits</title>
