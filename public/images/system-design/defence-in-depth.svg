<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-label="Nested security layers from the network edge through identity, authorization and input handling, surrounding the data and business logic" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Nested security layers from the network edge through identity, authorization and input handling, surrounding the data and business logic</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="390" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Defence in depth: an attacker has to get through every layer</text><rect x="60" y="60" width="780" height="300" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.75"/><text x="80" y="80" dy="0.35em" font-size="12.5" font-weight="600" fill="#64748B" text-anchor="start">Network: HTTPS everywhere, firewall, WAF, rate limits</text><rect x="94" y="86.5" width="712" height="247" rx="16" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.75"/><text x="114" y="106.5" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">Edge: security headers, CORS, request size limits</text><rect x="128" y="113" width="644" height="193.9" rx="16" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.75"/><text x="148" y="133" dy="0.35em" font-size="12.5" font-weight="600" fill="#003A91" text-anchor="start">Identity: authentication, MFA, sessions with safe cookies</text><rect x="162" y="139.6" width="576" height="140.9" rx="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.75"/><text x="182" y="159.6" dy="0.35em" font-size="12.5" font-weight="600" fill="#5B21B6" text-anchor="start">Authorization: roles AND ownership checks in every query</text><rect x="196" y="166.1" width="508" height="87.8" rx="16" fill="#FEF3C7" stroke="#D97706" stroke-width="1.75"/><text x="216" y="186.1" dy="0.35em" font-size="12.5" font-weight="600" fill="#92400E" text-anchor="start">Input: validation, parameterized queries, sanitised HTML</text><rect x="330" y="236" width="240" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="450" y="260" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">your data and business logic</text><text x="32" y="376" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">No single layer is perfect. Logging, monitoring and patched dependencies wrap around all of them.</text>
</svg>
