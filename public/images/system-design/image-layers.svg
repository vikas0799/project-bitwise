<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Dockerfile instructions map to layers; after editing the source, the base, dependency and install layers come from cache and only the later layers rebuild" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Dockerfile instructions map to layers; after editing the source, the base, dependency and install layers come from cache and only the later layers rebuild</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Each Dockerfile instruction is a cached layer</text><rect x="32" y="66" width="400" height="38" rx="6" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="46" y="85" dy="0.35em" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">FROM node:22-slim</text><line x1="436" y1="85" x2="474" y2="85" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="478" y="66" width="250" height="38" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="603" y="85" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">base image layers</text><text x="746" y="85" dy="0.35em" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">reused from cache</text><rect x="32" y="112" width="400" height="38" rx="6" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="46" y="131" dy="0.35em" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">WORKDIR /app</text><line x1="436" y1="131" x2="474" y2="131" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="478" y="112" width="250" height="38" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="603" y="131" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">tiny</text><text x="746" y="131" dy="0.35em" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">reused from cache</text><rect x="32" y="158" width="400" height="38" rx="6" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="46" y="177" dy="0.35em" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">COPY package.json package-lock.json ./</text><line x1="436" y1="177" x2="474" y2="177" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="478" y="158" width="250" height="38" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="603" y="177" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">dependency list</text><text x="746" y="177" dy="0.35em" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">reused from cache</text><rect x="32" y="204" width="400" height="38" rx="6" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="46" y="223" dy="0.35em" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">RUN npm ci --omit=dev</text><line x1="436" y1="223" x2="474" y2="223" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="478" y="204" width="250" height="38" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="603" y="223" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">node_modules (the slow step)</text><text x="746" y="223" dy="0.35em" font-size="12.5" font-weight="700" fill="#059669" text-anchor="start">reused from cache</text><rect x="32" y="250" width="400" height="38" rx="6" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="46" y="269" dy="0.35em" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">COPY src ./src</text><line x1="436" y1="269" x2="474" y2="269" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="478" y="250" width="250" height="38" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="603" y="269" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">your code: you edited a file</text><text x="746" y="269" dy="0.35em" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="start">rebuilt</text><rect x="32" y="296" width="400" height="38" rx="6" fill="#0F172A" stroke="#0F172A" stroke-width="1.5"/><text x="46" y="315" dy="0.35em" font-size="12.5" font-weight="500" fill="#E2E8F0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">CMD [&quot;node&quot;, &quot;src/server.js&quot;]</text><line x1="436" y1="315" x2="474" y2="315" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="478" y="296" width="250" height="38" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="603" y="315" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">metadata</text><text x="746" y="315" dy="0.35em" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="start">rebuilt</text><text x="32" y="354" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">When a layer changes, it and every layer after it are rebuilt. Put what changes least at the top.</text><text x="32" y="376" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Measured: editing server.js rebuilt in 0.6 s with this order, 4.5 s when the code was copied before npm install.</text>
</svg>
