<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A fixed five-step chain runs every step for every request, while an agent uses zero to three tools depending on the question" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A fixed five-step chain runs every step for every request, while an agent uses zero to three tools depending on the question</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A fixed chain of LLM calls vs an agent that chooses</text><text x="32" y="76" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">Fixed chain: every request pays for every step</text><rect x="32" y="92" width="148" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="106" y="114" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">classify</text><line x1="182" y1="114" x2="198" y2="114" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="202" y="92" width="148" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="276" y="114" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">fetch order</text><line x1="352" y1="114" x2="368" y2="114" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="372" y="92" width="148" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="446" y="114" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">fetch policy</text><line x1="522" y1="114" x2="538" y2="114" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="542" y="92" width="148" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="616" y="114" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">draft reply</text><line x1="692" y1="114" x2="708" y2="114" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="712" y="92" width="148" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="786" y="114" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">check reply</text><text x="32" y="180" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">Agent: steps depend on what the request needs</text><rect x="32" y="198" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="157" y="215" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">&quot;Do you issue certificates?&quot;</text><line x1="286" y1="215" x2="306" y2="215" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="310" y="198" width="380" height="34" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="500" y="215" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">answer directly</text><text x="704" y="215" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">1 model call, 0 tools</text><rect x="32" y="242" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="157" y="259" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">&quot;Where is my order?&quot;</text><line x1="286" y1="259" x2="306" y2="259" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="310" y="242" width="380" height="34" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="500" y="259" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">get_order → answer</text><text x="704" y="259" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">2 model calls, 1 tool</text><rect x="32" y="286" width="250" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="157" y="303" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">&quot;Can I get a refund?&quot;</text><line x1="286" y1="303" x2="306" y2="303" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="310" y="286" width="380" height="34" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="500" y="303" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">get_enrollment + policy → request_refund → answer</text><text x="704" y="303" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">3 model calls, 3 tools</text><text x="32" y="346" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Use a fixed workflow when the steps are known; an agent where the next step really depends on what it finds.</text>
</svg>
