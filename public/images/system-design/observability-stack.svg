<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Services send logs, metrics and traces through an OpenTelemetry collector to Loki, Prometheus and Tempo, viewed in Grafana with alerts sent through Alertmanager" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Services send logs, metrics and traces through an OpenTelemetry collector to Loki, Prometheus and Tempo, viewed in Grafana with alerts sent through Alertmanager</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A typical open-source observability stack</text><rect x="32" y="140" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="107" y="166" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Your services</text><text x="107" y="184" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">pino · prom-client · OTel</text><rect x="232" y="140" width="150" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="307" y="166" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">OTel Collector</text><text x="307" y="184" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">receive, filter, route</text><line x1="186" y1="175" x2="228" y2="175" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="440" y="70" width="180" height="50" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="530" y="86" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle">Loki / Elasticsearch</text><text x="530" y="104" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">logs</text><line x1="386" y1="175" x2="436" y2="95" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="624" y1="95" x2="676" y2="175" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="440" y="150" width="180" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="530" y="166" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">Prometheus</text><text x="530" y="184" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">metrics</text><line x1="386" y1="175" x2="436" y2="175" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="624" y1="175" x2="676" y2="175" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="440" y="230" width="180" height="50" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="530" y="246" dy="0.35em" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="middle">Tempo / Jaeger</text><text x="530" y="264" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">traces</text><line x1="386" y1="175" x2="436" y2="255" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="624" y1="255" x2="676" y2="175" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="680" y="140" width="100" height="70" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="730" y="166" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle">Grafana</text><text x="730" y="184" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">dashboards</text><rect x="656" y="250" width="220" height="50" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="766" y="266" dy="0.35em" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">Alertmanager</text><text x="766" y="284" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">→ Slack / PagerDuty</text><line x1="730" y1="214" x2="730" y2="246" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="32" y="330" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Managed alternatives bundle all of this: Datadog, New Relic, Grafana Cloud, Honeycomb; Sentry for errors.</text>
</svg>
