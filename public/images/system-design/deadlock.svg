<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Two transactions each holding a lock on one wallet row and waiting for the other, forming a deadlock that Postgres breaks by aborting one" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Two transactions each holding a lock on one wallet row and waiting for the other, forming a deadlock that Postgres breaks by aborting one</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A deadlock: each transaction waits for a lock the other holds</text><rect x="60" y="90" width="200" height="60" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="160" y="111" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Transaction A</text><text x="160" y="129" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">transfer: wallet 1 → 2</text><rect x="620" y="90" width="200" height="60" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="720" y="111" dy="0.35em" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">Transaction B</text><text x="720" y="129" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">transfer: wallet 2 → 1</text><rect x="60" y="230" width="200" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="160" y="249" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle">row: wallet 1</text><text x="160" y="267" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">locked by A</text><rect x="620" y="230" width="200" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="720" y="249" dy="0.35em" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="middle">row: wallet 2</text><text x="720" y="267" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">locked by B</text><line x1="160" y1="154" x2="160" y2="226" stroke="#0052CC" stroke-width="2.5" stroke-linecap="round"/><rect x="137.9" y="180.3" width="44.2" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#0052CC" stroke-width="1"/><text x="160" y="190" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">holds</text><line x1="720" y1="154" x2="720" y2="226" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/><rect x="697.9" y="180.3" width="44.2" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1"/><text x="720" y="190" dy="0.35em" font-size="11.5" font-weight="600" fill="#7C3AED" text-anchor="middle">holds</text><line x1="264" y1="140" x2="616" y2="248" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-bad)"/><line x1="616" y1="140" x2="264" y2="248" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrow-bad)"/><rect x="366.8" y="158" width="146.4" height="20" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="440" y="168" dy="0.35em" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">A waits for wallet 2</text><rect x="366.8" y="212" width="146.4" height="20" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="440" y="222" dy="0.35em" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">B waits for wallet 1</text><line x1="32" y1="310" x2="848" y2="310" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="334" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#334155" font-weight="500">Postgres notices the cycle and aborts one with error </tspan><tspan fill="#E11D48" font-weight="700">40P01</tspan><tspan fill="#334155" font-weight="500">. Retry it, and always lock rows in the same order (e.g. lower id first).</tspan></text>
</svg>
