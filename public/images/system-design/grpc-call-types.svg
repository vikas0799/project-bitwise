<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Unary, server streaming, client streaming and bidirectional streaming gRPC calls shown as message arrows between client and server" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Unary, server streaming, client streaming and bidirectional streaming gRPC calls shown as message arrows between client and server</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The four kinds of gRPC call</text><rect x="32" y="60" width="200" height="270" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="132" y="82" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Unary</text><text x="132" y="102" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">1 request → 1 response</text><text x="72" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">client</text><text x="192" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">server</text><line x1="72" y1="138" x2="72" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="192" y1="138" x2="192" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="76" y1="150" x2="186" y2="162" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="188" y1="162" x2="78" y2="174" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="132" y="314" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GetCourse</text><rect x="246" y="60" width="200" height="270" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="346" y="82" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Server streaming</text><text x="346" y="102" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">1 request → many responses</text><text x="286" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">client</text><text x="406" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">server</text><line x1="286" y1="138" x2="286" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="406" y1="138" x2="406" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="290" y1="150" x2="400" y2="162" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="402" y1="162" x2="292" y2="174" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="402" y1="198" x2="292" y2="210" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="402" y1="234" x2="292" y2="246" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="346" y="314" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">ListLessons</text><rect x="460" y="60" width="200" height="270" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="560" y="82" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Client streaming</text><text x="560" y="102" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">many requests → 1 response</text><text x="500" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">client</text><text x="620" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">server</text><line x1="500" y1="138" x2="500" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="620" y1="138" x2="620" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="504" y1="150" x2="614" y2="162" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="504" y1="186" x2="614" y2="198" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="504" y1="222" x2="614" y2="234" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="616" y1="248.4" x2="506" y2="260.4" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="560" y="314" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">UploadProgress</text><rect x="674" y="60" width="200" height="270" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="774" y="82" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Bidirectional</text><text x="774" y="102" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">both sides send any time</text><text x="714" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">client</text><text x="834" y="128" dy="0.35em" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">server</text><line x1="714" y1="138" x2="714" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="834" y1="138" x2="834" y2="296" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="718" y1="150" x2="828" y2="162" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="718" y1="200.4" x2="828" y2="212.4" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="830" y1="187.2" x2="720" y2="199.2" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="830" y1="237.6" x2="720" y2="249.6" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="774" y="314" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Doubts (chat)</text>
</svg>
