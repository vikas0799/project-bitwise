<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="A client sends requests with a token through a load balancer to three stateless servers that share one database" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A client sends requests with a token through a load balancer to three stateless servers that share one database</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Stateless servers: any server can answer any request</text><rect x="32" y="150" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="107" y="173" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Client</text><text x="107" y="191" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">sends a token every time</text><line x1="186" y1="182" x2="256" y2="182" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="166.7" y="124.3" width="108.6" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="221" y="134" dy="0.35em" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">request + token</text><rect x="260" y="150" width="160" height="64" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="340" y="173" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Load balancer</text><text x="340" y="191" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">picks any server</text><rect x="530" y="70" width="170" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="615" y="93" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Server A</text><text x="615" y="111" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">keeps nothing about you</text><line x1="424" y1="182" x2="526" y2="102" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="704" y1="102" x2="742" y2="182" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="470" y="94" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">request 1</text><rect x="530" y="150" width="170" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="615" y="173" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Server B</text><text x="615" y="191" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">keeps nothing about you</text><line x1="424" y1="182" x2="526" y2="182" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="704" y1="182" x2="742" y2="182" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="470" y="170" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">request 3</text><rect x="530" y="230" width="170" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="615" y="253" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Server C</text><text x="615" y="271" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">keeps nothing about you</text><line x1="424" y1="182" x2="526" y2="262" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="704" y1="262" x2="742" y2="182" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="470" y="270" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">request 2</text><rect x="746" y="150" width="110" height="64" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="801" y="173" dy="0.35em" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">Database</text><text x="801" y="191" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">shared data</text><line x1="32" y1="324" x2="848" y2="324" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="348" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Why it scales: </tspan><tspan fill="#334155" font-weight="500">no request depends on memory left behind by an earlier one,</tspan></text><text x="32" y="372" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">so you can add servers, restart them or lose one, and users never notice.</tspan></text>
</svg>
