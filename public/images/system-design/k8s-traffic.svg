<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Traffic flows from users through an Ingress or Gateway to a Service, which forwards to ready pods that match its label selector; a pod failing readiness gets no traffic" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Traffic flows from users through an Ingress or Gateway to a Service, which forwards to ready pods that match its label selector; a pod failing readiness gets no traffic</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">From the internet to a pod</text><rect x="32" y="150" width="100" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="82" y="178" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">users</text><rect x="170" y="140" width="162" height="76" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="251" y="169" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">Ingress / Gateway</text><text x="251" y="187" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">TLS, host and path rules</text><rect x="370" y="140" width="150" height="76" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="445" y="160" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">Service</text><text x="445" y="178" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">course-api</text><text x="445" y="196" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">stable name and IP</text><line x1="136" y1="178" x2="166" y2="178" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="336" y1="178" x2="366" y2="178" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="600" y="70" width="140" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="670" y="89" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">pod</text><text x="670" y="107" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">app: course-api · ready</text><line x1="524" y1="178" x2="596" y2="98" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="600" y="150" width="140" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="670" y="169" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">pod</text><text x="670" y="187" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">app: course-api · ready</text><line x1="524" y1="178" x2="596" y2="178" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="600" y="230" width="140" height="56" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="670" y="249" dy="0.35em" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">pod</text><text x="670" y="267" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">app: course-api · not ready</text><line x1="524" y1="178" x2="596" y2="258" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/><text x="445" y="236" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">selects pods labelled</text><text x="445" y="252" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">app: course-api</text><rect x="760" y="62" width="120" height="236" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820" y="84" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">Deployment</text><text x="820" y="104" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">keeps 3 replicas</text><text x="820" y="180" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">replaces pods</text><text x="820" y="198" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">that die</text><line x1="744" y1="98" x2="760" y2="98" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="32" y="350" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Pods come and go with new IPs. The Service tracks the ready pods by label, so callers never need a pod’s address.</text>
</svg>
