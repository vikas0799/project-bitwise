<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="A pipeline goes from push to test, build, scan, push to registry and deploy; CI covers the checks and CD covers shipping" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A pipeline goes from push to test, build, scan, push to registry and deploy; CI covers the checks and CD covers shipping</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="300" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A CI/CD pipeline: every merge takes the same path</text><rect x="32" y="80" width="122" height="64" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="93" y="103" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">push</text><text x="93" y="121" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">git commit</text><line x1="156" y1="112" x2="172" y2="112" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="174" y="80" width="122" height="64" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="235" y="103" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">test</text><text x="235" y="121" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">lint, unit, integration</text><line x1="298" y1="112" x2="314" y2="112" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="316" y="80" width="122" height="64" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="377" y="103" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">build</text><text x="377" y="121" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">image: git-&lt;sha&gt;</text><line x1="440" y1="112" x2="456" y2="112" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="458" y="80" width="122" height="64" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="519" y="103" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">scan</text><text x="519" y="121" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">known vulnerabilities</text><line x1="582" y1="112" x2="598" y2="112" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="600" y="80" width="122" height="64" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="661" y="103" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">push</text><text x="661" y="121" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">to the registry</text><line x1="724" y1="112" x2="740" y2="112" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="742" y="80" width="122" height="64" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="803" y="103" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">deploy</text><text x="803" y="121" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">rolling update</text><rect x="32" y="172" width="548" height="36" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="306" y="190" dy="0.35em" font-size="12.5" font-weight="600" fill="#003A91" text-anchor="middle">CI: is this change safe? Runs on every pull request.</text><rect x="600" y="172" width="268" height="36" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="734" y="190" dy="0.35em" font-size="12.5" font-weight="600" fill="#065F46" text-anchor="middle">CD: ship it, automatically.</text><text x="32" y="246" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Any failing step stops the pipeline. The image that passed the tests is the exact image that runs in production.</text><text x="32" y="268" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Tagging by commit SHA means you always know which code is running, and rolling back is redeploying an older tag.</text>
</svg>
