<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="An origin server far away and three CDN points of presence in Delhi, Mumbai and Chennai serving nearby users from cache" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>An origin server far away and three CDN points of presence in Delhi, Mumbai and Chennai serving nearby users from cache</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A CDN keeps copies near users, so most requests never reach the origin</text><rect x="32" y="160" width="170" height="70" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="117" y="186" dy="0.35em" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle">Origin server</text><text x="117" y="204" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">one region, far away</text><rect x="390" y="80" width="170" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="475" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">Delhi PoP</text><text x="475" y="117" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">edge servers + cache</text><line x1="386" y1="108" x2="206" y2="195" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="700" y="86" width="168" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="784" y="108" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">users nearby</text><line x1="696" y1="108" x2="564" y2="108" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="390" y="170" width="170" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="475" y="189" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">Mumbai PoP</text><text x="475" y="207" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">edge servers + cache</text><line x1="386" y1="198" x2="206" y2="195" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="700" y="176" width="168" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="784" y="198" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">users nearby</text><line x1="696" y1="198" x2="564" y2="198" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="390" y="260" width="170" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="475" y="279" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">Chennai PoP</text><text x="475" y="297" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">edge servers + cache</text><line x1="386" y1="288" x2="206" y2="195" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="700" y="266" width="168" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="784" y="288" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">users nearby</text><line x1="696" y1="288" x2="564" y2="288" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="244.9" y="110.3" width="102.2" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="296" y="120" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">only on a miss</text><rect x="604.7" y="60.3" width="50.6" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="630" y="70" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">~10 ms</text><rect x="254.6" y="290.3" width="82.8" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="296" y="300" dy="0.35em" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle">~150–250 ms</text><line x1="32" y1="336" x2="868" y2="336" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="358" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Hit: </tspan><tspan fill="#334155" font-weight="500">the PoP already has the file and answers immediately. </tspan><tspan fill="#0A1633" font-weight="700">Miss: </tspan><tspan fill="#334155" font-weight="500">it fetches from the origin once, caches it for its TTL,</tspan></text><text x="32" y="380" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">then serves every later user in that region from the copy.</tspan></text>
</svg>
