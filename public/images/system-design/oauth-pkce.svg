<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="Sign in with Google using the OAuth authorization code flow with PKCE, from the click to the API call" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Sign in with Google using the OAuth authorization code flow with PKCE, from the click to the API call</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="540" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">OAuth 2.0 authorization code flow with PKCE</text><rect x="40" y="64" width="160" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="120" y="84" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Browser</text><line x1="120" y1="104" x2="120" y2="516" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><rect x="260" y="64" width="160" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="340" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Your app</text><text x="340" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">the client</text><line x1="340" y1="104" x2="340" y2="516" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><rect x="480" y="64" width="160" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="560" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Google</text><text x="560" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">authorization server</text><line x1="560" y1="104" x2="560" y2="516" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><rect x="700" y="64" width="160" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="780" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#5B21B6" text-anchor="middle">Google API</text><text x="780" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">resource server</text><line x1="780" y1="104" x2="780" y2="516" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><circle cx="90" cy="142" r="10" fill="#0A1633"/><text x="90" y="142" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><line x1="124" y1="142" x2="334" y2="142" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="133.3" y="120" width="193.4" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="230" y="130" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">click &quot;Sign in with Google&quot;</text><circle cx="90" cy="186" r="10" fill="#0A1633"/><text x="90" y="186" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M 340 178 C 380 178, 380 198, 344 198" fill="none" stroke="#0A1633" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><text x="388" y="188" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">make state + code_verifier, send only SHA-256(verifier)</text><circle cx="90" cy="230" r="10" fill="#0A1633"/><text x="90" y="230" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="336" y1="230" x2="126" y2="230" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="126.6" y="208" width="206.9" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="230" y="218" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">redirect to Google /authorize</text><circle cx="90" cy="274" r="10" fill="#0A1633"/><text x="90" y="274" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="124" y1="274" x2="554" y2="274" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="213" y="252" width="253.9" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="340" y="262" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">user logs in and approves the scopes</text><circle cx="90" cy="318" r="10" fill="#0A1633"/><text x="90" y="318" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><line x1="556" y1="318" x2="126" y2="318" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="213" y="296" width="253.9" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="340" y="306" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">redirect to /callback?code=…&amp;state=…</text><circle cx="90" cy="362" r="10" fill="#0A1633"/><text x="90" y="362" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><line x1="124" y1="362" x2="334" y2="362" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="116.5" y="340" width="227" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="230" y="350" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">GET /callback (app checks state)</text><circle cx="90" cy="406" r="10" fill="#0A1633"/><text x="90" y="406" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><line x1="344" y1="406" x2="554" y2="406" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="333.1" y="384" width="233.8" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="450" y="394" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">POST /token: code + code_verifier</text><circle cx="90" cy="450" r="10" fill="#0A1633"/><text x="90" y="450" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><line x1="556" y1="450" x2="346" y2="450" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="366.7" y="428" width="166.6" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="450" y="438" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">access token + ID token</text><circle cx="90" cy="494" r="10" fill="#0A1633"/><text x="90" y="494" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><line x1="344" y1="494" x2="774" y2="494" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="443.1" y="472" width="233.8" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="560" y="482" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">API call with Bearer access token</text>
</svg>
