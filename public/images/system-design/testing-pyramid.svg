<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" role="img" aria-label="A pyramid with many fast unit tests at the base, fewer integration tests in the middle and a few end-to-end tests at the top" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A pyramid with many fast unit tests at the base, fewer integration tests in the middle and a few end-to-end tests at the top</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="370" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The testing pyramid</text><path d="M 260 70 L 260 70 L 328.14814814814815 150 L 191.85185185185185 150 Z" fill="#FFE4E6" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="124" dy="0.35em" font-size="14" font-weight="700" fill="#9F1239" text-anchor="middle">End-to-end</text><path d="M 191.85185185185185 150 L 328.14814814814815 150 L 404.8148148148148 240 L 115.18518518518519 240 Z" fill="#FEF3C7" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="189" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Integration</text><text x="260" y="209" dy="0.35em" font-size="11.5" font-weight="500" fill="#92400E" text-anchor="middle">real DB, HTTP, contracts</text><path d="M 115.18518518518519 240 L 404.8148148148148 240 L 490 340 L 30 340 Z" fill="#D1FAE5" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="284" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="middle">Unit</text><text x="260" y="304" dy="0.35em" font-size="11.5" font-weight="500" fill="#065F46" text-anchor="middle">many, fast, isolated</text><line x1="530" y1="330" x2="530" y2="84" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="546" y="96" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">slower, costlier, more realistic</text><text x="546" y="116" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">harder to tell what broke</text><text x="546" y="304" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">faster, cheaper, more precise</text><text x="546" y="324" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">one failure points at one function</text><text x="546" y="196" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="start">Measured in this chapter:</text><text x="546" y="218" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="start">21 unit tests: ~0.2 s</text><text x="546" y="238" dy="0.35em" font-size="12.5" font-weight="600" fill="#D97706" text-anchor="start">3 Postgres integration tests: ~3 s</text>
</svg>
