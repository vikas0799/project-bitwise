<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A request passing through the entry point, middleware, router, controller, service and repository to the database, with the request context alongside" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A request passing through the entry point, middleware, router, controller, service and repository to the database, with the request context alongside</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Inside the server: one job per layer</text><rect x="25" y="80" width="106" height="56" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="78" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#94A3B8" text-anchor="middle">Port 3000</text><text x="78" y="117" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">entry point</text><line x1="133" y1="108" x2="147" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="149" y="80" width="106" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="202" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle">Middleware</text><text x="202" y="117" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">every request</text><line x1="257" y1="108" x2="271" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="273" y="80" width="106" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="326" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle">Router</text><text x="326" y="117" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">method + path</text><line x1="381" y1="108" x2="395" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="397" y="80" width="106" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">Controller</text><text x="450" y="117" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">HTTP in and out</text><line x1="505" y1="108" x2="519" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="521" y="80" width="106" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="574" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">Service</text><text x="574" y="117" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">business logic</text><line x1="629" y1="108" x2="643" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="645" y="80" width="106" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="698" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="middle">Repository</text><text x="698" y="117" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">database queries</text><line x1="753" y1="108" x2="767" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="769" y="80" width="106" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="822" y="99" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Database</text><text x="822" y="117" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Postgres, Redis</text><text x="40" y="176" dy="0.35em" font-size="13.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Middleware: </tspan><tspan fill="#334155" font-weight="500">CORS, logging, auth, rate limits. Can stop a request early.</tspan></text><text x="40" y="200" dy="0.35em" font-size="13.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Controller: </tspan><tspan fill="#334155" font-weight="500">read the request, validate, call a service, choose the status code.</tspan></text><text x="40" y="224" dy="0.35em" font-size="13.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Service: </tspan><tspan fill="#334155" font-weight="500">the real work. Knows nothing about HTTP: no req, no res, no status codes.</tspan></text><text x="40" y="248" dy="0.35em" font-size="13.5" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Repository: </tspan><tspan fill="#334155" font-weight="500">builds and runs queries. One method, one kind of result.</tspan></text><rect x="149" y="284" width="354" height="44" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="326" y="298" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">request context: req.id, req.user, signal</text><text x="326" y="316" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">shared by middleware, router and controller</text><text x="519" y="298" dy="0.35em" font-size="12.5" font-weight="600" fill="#334155" text-anchor="start">Services get plain values</text><text x="519" y="316" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">(userId, signal), never req itself.</text>
</svg>
