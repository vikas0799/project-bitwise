<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="A JavaScript object is serialized to JSON, parsed into a Go struct on the server, and the response makes the same trip back" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A JavaScript object is serialized to JSON, parsed into a Go struct on the server, and the response makes the same trip back</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="470" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">One request, four conversions</text><text x="150" y="70" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Client: React app (JavaScript)</text><text x="450" y="70" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Network: only text travels</text><text x="750" y="70" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Server: Go API</text><rect x="345" y="84" width="210" height="296" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="32" y="100" width="236" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="150" y="119" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{ itemId: 12, qty: 2 }</text><text x="150" y="137" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">JS object</text><rect x="358" y="100" width="184" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450" y="119" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{&quot;itemId&quot;:12,&quot;qty&quot;:2}</text><text x="450" y="137" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">JSON text</text><rect x="632" y="100" width="236" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="750" y="119" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Order{ItemID: 12, Qty: 2}</text><text x="750" y="137" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Go struct</text><line x1="272" y1="128" x2="354" y2="128" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><line x1="546" y1="128" x2="628" y2="128" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><circle cx="313" cy="128" r="11" fill="#0052CC" stroke="#FFFFFF" stroke-width="2"/><text x="313" y="128" dy="0.35em" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="587" cy="128" r="11" fill="#059669" stroke="#FFFFFF" stroke-width="2"/><text x="587" y="128" dy="0.35em" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="313" y="176" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">JSON.stringify</text><text x="587" y="176" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">json.Unmarshal</text><line x1="750" y1="160" x2="750" y2="192" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="652" y="196" width="196" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="750" y="210" dy="0.35em" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle">save order to DB</text><text x="750" y="228" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">business logic</text><line x1="750" y1="246" x2="750" y2="278" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="632" y="282" width="236" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="750" y="301" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Order{ID: 981}</text><text x="750" y="319" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Go struct</text><rect x="358" y="282" width="184" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450" y="301" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{&quot;id&quot;:981}</text><text x="450" y="319" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">JSON text</text><rect x="32" y="282" width="236" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="150" y="301" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{ id: 981 }</text><text x="150" y="319" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">JS object</text><line x1="628" y1="310" x2="546" y2="310" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="354" y1="310" x2="272" y2="310" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><circle cx="587" cy="310" r="11" fill="#059669" stroke="#FFFFFF" stroke-width="2"/><text x="587" y="310" dy="0.35em" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="313" cy="310" r="11" fill="#0052CC" stroke="#FFFFFF" stroke-width="2"/><text x="313" y="310" dy="0.35em" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="587" y="360" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">json.Marshal</text><text x="313" y="360" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">JSON.parse</text><line x1="32" y1="400" x2="868" y2="400" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="424" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Serialize </tspan><tspan fill="#334155" font-weight="500">(1, 3): native data → JSON before sending.   </tspan><tspan fill="#0A1633" font-weight="700">Deserialize </tspan><tspan fill="#334155" font-weight="500">(2, 4): JSON → native data after receiving.</tspan></text><text x="32" y="448" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Neither side needs to know the other side's language. They only agree on JSON.</text>
</svg>
