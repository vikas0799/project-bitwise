<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Defaults, an environment file, environment variables and a secret manager merged by priority, validated with Zod into one frozen config object" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Defaults, an environment file, environment variables and a secret manager merged by priority, validated with Zod into one frozen config object</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Build one config object from several sources, then validate it</text><rect x="32" y="70" width="300" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="182" y="87" dy="0.35em" font-size="13.5" font-weight="700" fill="#94A3B8" text-anchor="middle">1. defaults</text><text x="182" y="105" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">config/default.yaml</text><text x="348" y="96" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">port 3000, pool 10, flags off</text><rect x="32" y="134" width="300" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="182" y="151" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">2. environment file</text><text x="182" y="169" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">config/production.yaml</text><text x="348" y="160" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">pool 50, new checkout for IN</text><rect x="32" y="198" width="300" height="52" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="182" y="215" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="middle">3. environment variables</text><text x="182" y="233" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">PORT, DATABASE_URL, LOG_LEVEL</text><text x="348" y="224" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">set by the platform per deploy</text><rect x="32" y="262" width="300" height="52" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="182" y="279" dy="0.35em" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="middle">4. secret manager</text><text x="182" y="297" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Vault, AWS SSM, GCP Secret Manager</text><text x="348" y="288" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">JWT secret, DB password, API keys</text><text x="182" y="336" dy="0.35em" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">later layers override earlier ones ↓</text><path d="M 610 96 C 660 96, 660 205, 690 205" fill="none" stroke="#0A1633" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><path d="M 610 300 C 660 300, 660 205, 690 205" fill="none" stroke="#0A1633" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="694" y="150" width="82" height="110" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="735" y="196" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">merge</text><text x="735" y="214" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">+ Zod</text><line x1="780" y1="205" x2="794" y2="205" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="798" y="150" width="82" height="110" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="839" y="196" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">config</text><text x="839" y="214" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">frozen, typed</text><text x="694" y="282" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Invalid or missing? Exit</text><text x="694" y="300" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">before serving traffic,</text><text x="694" y="318" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">with a clear list.</text>
</svg>
