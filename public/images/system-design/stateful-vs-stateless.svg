<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="With sessions in server memory, a second request routed to another server fails; with sessions in Redis, any server can answer" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>With sessions in server memory, a second request routed to another server fails; with sessions in Redis, any server can answer</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Where the session lives decides whether you can scale out</text><text x="225" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#E11D48" text-anchor="middle">Stateful: session in server memory</text><rect x="20" y="160" width="100" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="70" y="179" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">load</text><text x="70" y="197" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">balancer</text><rect x="190" y="96" width="140" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="260" y="115" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">server A</text><text x="260" y="133" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">session: user 42</text><rect x="190" y="222" width="140" height="56" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="260" y="241" dy="0.35em" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle">server B</text><text x="260" y="259" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">no session</text><line x1="124" y1="180" x2="186" y2="128" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="124" y1="196" x2="186" y2="248" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="117.4" y="126.5" width="61.3" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="148" y="136" dy="0.35em" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">1 log in</text><rect x="114.3" y="230.5" width="67.4" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="148" y="240" dy="0.35em" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">2 GET /me</text><text x="260" y="306" dy="0.35em" font-size="12.5" font-weight="700" fill="#E11D48" text-anchor="middle">B has never seen you: 401</text><line x1="450" y1="60" x2="450" y2="330" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="675" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">Stateless: session in a shared store</text><rect x="470" y="160" width="100" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="520" y="179" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">load</text><text x="520" y="197" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="middle">balancer</text><rect x="640" y="96" width="140" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="710" y="115" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">server A</text><text x="710" y="133" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">keeps nothing</text><rect x="640" y="222" width="140" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="710" y="241" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">server B</text><text x="710" y="259" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">keeps nothing</text><line x1="574" y1="180" x2="636" y2="128" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="574" y1="196" x2="636" y2="248" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="567.4" y="126.5" width="61.3" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="598" y="136" dy="0.35em" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">1 log in</text><rect x="564.3" y="230.5" width="67.4" height="19" rx="9.5" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="598" y="240" dy="0.35em" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">2 GET /me</text><rect x="800" y="160" width="80" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="840" y="179" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">Redis</text><text x="840" y="197" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">sessions</text><line x1="784" y1="124" x2="800" y2="176" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="784" y1="250" x2="800" y2="200" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="710" y="306" dy="0.35em" font-size="12.5" font-weight="700" fill="#059669" text-anchor="middle">B finds the session in Redis: 200</text><text x="32" y="356" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Tested with two Express servers: MemoryStore gave 401 on server B, connect-redis gave 200.</text>
</svg>
