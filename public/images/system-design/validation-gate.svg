<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="A bad request reaching the database and failing with 500, compared with the same request rejected by validation with a clear 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A bad request reaching the database and failing with 500, compared with the same request rejected by validation with a clear 400</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Same bad request, with and without validation</text><text x="32" y="70" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">WITHOUT VALIDATION</text><rect x="32" y="88" width="180" height="46" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="122" y="102" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">POST /api/books</text><text x="122" y="120" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">{ &quot;title&quot;: null }</text><line x1="216" y1="111" x2="246" y2="111" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="250" y="88" width="130" height="46" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="315" y="111" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Controller</text><rect x="410" y="88" width="130" height="46" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="475" y="111" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Service</text><rect x="570" y="88" width="130" height="46" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="635" y="111" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="middle">Repository</text><rect x="730" y="88" width="130" height="46" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="795" y="111" dy="0.35em" font-size="13.5" font-weight="700" fill="#9F1239" text-anchor="middle">Postgres</text><line x1="384" y1="111" x2="406" y2="111" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><line x1="544" y1="111" x2="566" y2="111" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><line x1="704" y1="111" x2="726" y2="111" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><path d="M 795 138 C 795 180, 600 186, 140 186 L 140 160" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-bad)"/><rect x="279.2" y="176" width="381.6" height="20" rx="10" fill="#FFFFFF" stroke="#E11D48" stroke-width="1"/><text x="470" y="186" dy="0.35em" font-size="12" font-weight="600" fill="#E11D48" text-anchor="middle">500 Internal Server Error: &quot;null value in column title&quot;</text><text x="32" y="214" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">The database finds the problem, after a connection, a query and maybe an email already went out.</text><line x1="32" y1="240" x2="868" y2="240" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="266" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">WITH VALIDATION</text><rect x="32" y="284" width="180" height="46" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="122" y="298" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">POST /api/books</text><text x="122" y="316" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">{ &quot;title&quot;: null }</text><line x1="216" y1="307" x2="246" y2="307" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="250" y="284" width="130" height="46" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="315" y="298" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="middle">Controller</text><text x="315" y="316" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">validates first</text><rect x="410" y="284" width="130" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="475" y="307" dy="0.35em" font-size="13.5" font-weight="700" fill="#94A3B8" text-anchor="middle">Service</text><rect x="570" y="284" width="130" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="635" y="307" dy="0.35em" font-size="13.5" font-weight="700" fill="#94A3B8" text-anchor="middle">Repository</text><rect x="730" y="284" width="130" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="795" y="307" dy="0.35em" font-size="13.5" font-weight="700" fill="#94A3B8" text-anchor="middle">Postgres</text><line x1="384" y1="307" x2="406" y2="307" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/><line x1="544" y1="307" x2="566" y2="307" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/><line x1="704" y1="307" x2="726" y2="307" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/><path d="M 315 334 C 315 362, 200 366, 140 366 L 140 338" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="203" y="360" width="253.9" height="20" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="330" y="370" dy="0.35em" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">400 Bad Request: &quot;title is required&quot;</text><text x="560" y="368" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Rejected at the door. Nothing else runs.</text>
</svg>
