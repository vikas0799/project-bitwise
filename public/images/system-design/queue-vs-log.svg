<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="In a queue each job goes to one worker and is deleted; in a log events stay at their offsets and each consumer group reads at its own position" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>In a queue each job goes to one worker and is deleted; in a log events stay at their offsets and each consumer group reads at its own position</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A queue hands out work once. A log keeps history for everyone.</text><text x="210" y="72" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Queue (RabbitMQ, SQS)</text><rect x="32" y="100" width="80" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="72" y="122" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">producer</text><rect x="140" y="100" width="56" height="44" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="168" y="122" dy="0.35em" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">job 4</text><rect x="202" y="100" width="56" height="44" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="230" y="122" dy="0.35em" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">job 3</text><rect x="264" y="100" width="56" height="44" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="292" y="122" dy="0.35em" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">job 2</text><line x1="116" y1="122" x2="136" y2="122" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="330" y1="122" x2="360" y2="100" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="330" y1="122" x2="360" y2="146" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="364" y="76" width="66" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="397" y="96" dy="0.35em" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">worker</text><rect x="364" y="128" width="66" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="397" y="148" dy="0.35em" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">worker</text><text x="210" y="200" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="middle">each job goes to one worker</text><text x="210" y="220" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="middle">and is deleted once acknowledged</text><line x1="450" y1="60" x2="450" y2="330" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="680" y="72" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Log (Kafka)</text><rect x="476" y="100" width="44" height="40" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="498" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0</text><rect x="524" y="100" width="44" height="40" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="546" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1</text><rect x="572" y="100" width="44" height="40" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="594" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">2</text><rect x="620" y="100" width="44" height="40" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="642" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">3</text><rect x="668" y="100" width="44" height="40" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="690" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">4</text><rect x="716" y="100" width="44" height="40" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="738" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">5</text><rect x="764" y="100" width="44" height="40" rx="4" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><text x="786" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">6</text><rect x="812" y="100" width="44" height="40" rx="4" fill="#FFFFFF" stroke="#0052CC" stroke-width="1.5" stroke-dasharray="4 3"/><text x="834" y="120" dy="0.35em" font-size="12" font-weight="600" fill="#003A91" text-anchor="middle">next</text><line x1="498" y1="196" x2="498" y2="146" stroke="#D97706" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-active)"/><rect x="442" y="196" width="112" height="34" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="498" y="204" dy="0.35em" font-size="11.5" font-weight="700" fill="#92400E" text-anchor="middle">search indexer</text><text x="498" y="222" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">at offset 0</text><line x1="594" y1="248" x2="594" y2="146" stroke="#059669" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="538" y="248" width="112" height="34" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="594" y="256" dy="0.35em" font-size="11.5" font-weight="700" fill="#065F46" text-anchor="middle">orders service</text><text x="594" y="274" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">at offset 2</text><line x1="738" y1="196" x2="738" y2="146" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow-special)"/><rect x="682" y="196" width="112" height="34" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="738" y="204" dy="0.35em" font-size="11.5" font-weight="700" fill="#5B21B6" text-anchor="middle">analytics</text><text x="738" y="222" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">at offset 5</text><text x="680" y="316" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">append at the end; reading removes nothing;</text><text x="680" y="334" dy="0.35em" font-size="12" font-weight="500" fill="#334155" text-anchor="middle">each group keeps its own position</text>
</svg>
