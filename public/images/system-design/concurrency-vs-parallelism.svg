<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Concurrency interleaves tasks A, B and C on one core; parallelism runs tasks on two cores at the same time" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Concurrency interleaves tasks A, B and C on one core; parallelism runs tasks on two cores at the same time</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="320" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Concurrency vs parallelism</text><text x="32" y="72" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">Concurrency: one core switches between tasks whenever one is waiting</text><text x="150" y="103" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="end">core 1</text><rect x="162" y="88" width="700" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><rect x="162" y="91" width="67" height="24" rx="3" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.2"/><text x="195.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">A</text><rect x="232" y="91" width="53" height="24" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="258.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">B</text><rect x="288" y="91" width="81" height="24" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/><text x="328.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">C</text><rect x="372" y="91" width="67" height="24" rx="3" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.2"/><text x="405.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">A</text><rect x="442" y="91" width="67" height="24" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="475.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">B</text><rect x="512" y="91" width="81" height="24" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/><text x="552.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">C</text><rect x="596" y="91" width="53" height="24" rx="3" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.2"/><text x="622.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">A</text><rect x="652" y="91" width="67" height="24" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="685.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">B</text><rect x="722" y="91" width="137" height="24" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/><text x="790.5" y="103" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">C</text><text x="32" y="168" dy="0.35em" font-size="13.5" font-weight="600" fill="#0A1633" text-anchor="start">Parallelism: several cores run tasks at the same instant</text><text x="150" y="199" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="end">core 1</text><rect x="162" y="184" width="700" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><rect x="162" y="187" width="277" height="24" rx="3" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.2"/><text x="300.5" y="199" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">A</text><rect x="442" y="187" width="207" height="24" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/><text x="545.5" y="199" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">C</text><rect x="652" y="187" width="207" height="24" rx="3" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.2"/><text x="755.5" y="199" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">A</text><text x="150" y="237" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="end">core 2</text><rect x="162" y="222" width="700" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><rect x="162" y="225" width="207" height="24" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="265.5" y="237" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">B</text><rect x="372" y="225" width="207" height="24" rx="3" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/><text x="475.5" y="237" dy="0.35em" font-size="12" font-weight="700" fill="#5B21B6" text-anchor="middle">C</text><rect x="582" y="225" width="277" height="24" rx="3" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="720.5" y="237" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">B</text><text x="32" y="290" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Node.js gives you concurrency on one thread out of the box; worker threads, cluster or more processes add parallelism.</text>
</svg>
