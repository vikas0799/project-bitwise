<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="A sequential scan checking every row compared with a B-tree index lookup that jumps to the matching row" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A sequential scan checking every row compared with a B-tree index lookup that jumps to the matching row</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Finding one row: scan everything, or use an index</text><text x="32" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#E11D48" text-anchor="start">Sequential scan (no index)</text><rect x="60" y="90" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="72" y="104" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Course 17</text><text x="246" y="104" dy="0.35em" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="start">no</text><rect x="60" y="124" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="72" y="138" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Course 3</text><text x="246" y="138" dy="0.35em" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="start">no</text><rect x="60" y="158" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="72" y="172" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Course 42</text><text x="246" y="172" dy="0.35em" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="start">no</text><rect x="60" y="192" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="72" y="206" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Course 8</text><text x="246" y="206" dy="0.35em" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="start">no</text><rect x="60" y="226" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="72" y="240" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Course 29</text><text x="246" y="240" dy="0.35em" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="start">no</text><rect x="60" y="260" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="72" y="274" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">…</text><text x="246" y="274" dy="0.35em" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="start"></text><rect x="60" y="294" width="170" height="28" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="72" y="308" dy="0.35em" font-size="12.5" font-weight="500" fill="#065F46" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Course 9</text><text x="246" y="308" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="start">found</text><path d="M 44 96 L 44 314" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-bad)"/><text x="32" y="340" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Reads rows one by one until it finds a match.</text><text x="32" y="360" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">50,000 rows → up to 50,000 checks.</text><line x1="330" y1="64" x2="330" y2="360" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="360" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="start">Index lookup (B-tree)</text><rect x="560" y="92" width="120" height="34" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="620" y="109" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&lt; M | ≥ M</text><rect x="420" y="168" width="120" height="34" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="480" y="185" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&lt; C | C–M</text><rect x="700" y="168" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="760" y="185" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">M–T | ≥ T</text><rect x="344" y="244" width="120" height="34" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="404" y="261" dy="0.35em" font-size="12.5" font-weight="700" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">A … B</text><rect x="480" y="244" width="180" height="34" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="570" y="261" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Course 9 → row 4182</text><line x1="600" y1="130" x2="500" y2="164" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="640" y1="130" x2="740" y2="164" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/><line x1="456" y1="206" x2="410" y2="240" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)"/><line x1="500" y1="206" x2="560" y2="240" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><path d="M 664 261 L 775 261 L 775 298" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="700" y="302" width="150" height="34" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="775" y="319" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">row 4182 on disk</text><text x="360" y="340" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">A sorted tree: a few hops, then jump straight to the row.</text><text x="360" y="360" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Faster reads, slightly slower writes (the index must be updated).</text>
</svg>
