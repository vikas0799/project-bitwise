<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Short polling, long polling, Server-Sent Events and WebSockets compared on a timeline showing when news reaches the client" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Short polling, long polling, Server-Sent Events and WebSockets compared on a timeline showing when news reaches the client</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Four ways to get updates from the server</text><line x1="330" y1="62" x2="330" y2="360" stroke="#E11D48" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="610" y1="62" x2="610" y2="360" stroke="#E11D48" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><text x="330" y="56" dy="0.35em" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">news</text><text x="610" y="56" dy="0.35em" font-size="11" font-weight="600" fill="#E11D48" text-anchor="middle">news</text><text x="32" y="84" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">Short polling</text><text x="32" y="102" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">ask every few seconds</text><line x1="210" y1="90" x2="860" y2="90" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><line x1="230" y1="84" x2="246" y2="98" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><line x1="252" y1="98" x2="268" y2="84" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><line x1="380" y1="84" x2="396" y2="98" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><line x1="402" y1="98" x2="418" y2="84" stroke="#059669" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="530" y1="84" x2="546" y2="98" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><line x1="552" y1="98" x2="568" y2="84" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><line x1="680" y1="84" x2="696" y2="98" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><line x1="702" y1="98" x2="718" y2="84" stroke="#059669" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="830" y1="84" x2="846" y2="98" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><line x1="852" y1="98" x2="868" y2="84" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)"/><text x="860" y="116" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">mostly empty answers; news waits for the next poll</text><text x="32" y="154" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">Long polling</text><text x="32" y="172" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">server holds the request open</text><line x1="210" y1="160" x2="860" y2="160" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><path d="M 220 154 L 330 168" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="332" y1="168" x2="340" y2="156" stroke="#059669" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-good)"/><path d="M 350 154 L 610 168" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="612" y1="168" x2="620" y2="156" stroke="#059669" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-good)"/><path d="M 630 154 L 850 168" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="860" y="186" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">answer as soon as there is news, then ask again</text><text x="32" y="224" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">Server-Sent Events</text><text x="32" y="242" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">one endless HTTP response</text><line x1="210" y1="230" x2="860" y2="230" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><rect x="220" y="222" width="630" height="16" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.5"/><line x1="330" y1="238" x2="330" y2="250" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="610" y1="238" x2="610" y2="250" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="860" y="262" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">server → client only; auto-reconnect built in</text><text x="32" y="294" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start">WebSocket</text><text x="32" y="312" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="start">one upgraded TCP connection</text><line x1="210" y1="300" x2="860" y2="300" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><rect x="220" y="292" width="630" height="16" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><line x1="330" y1="308" x2="330" y2="320" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="610" y1="308" x2="610" y2="320" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="460" y1="320" x2="460" y2="308" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><line x1="760" y1="320" x2="760" y2="308" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-special)"/><text x="860" y="334" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="end">both sides send whenever they like</text><text x="32" y="384" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Simplest first: polling for rare updates, SSE for one-way push, WebSockets only when the client also talks a lot.</text>
</svg>
