<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Client code calls a generated stub that encodes protobuf and sends it over an HTTP/2 stream to a server skeleton that decodes it and runs the handler" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Client code calls a generated stub that encodes protobuf and sends it over an HTTP/2 stream to a server skeleton that decodes it and runs the handler</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="330" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A remote call that looks local: stubs hide the network</text><text x="200" y="66" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Client process</text><text x="700" y="66" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Server process</text><rect x="40" y="84" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="115" y="103" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">your code</text><text x="115" y="121" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">client.GetCourse({id: 42})</text><rect x="210" y="84" width="150" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="285" y="103" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">stub (generated)</text><text x="285" y="121" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">encode → protobuf</text><rect x="540" y="84" width="150" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="615" y="103" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">server skeleton</text><text x="615" y="121" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">decode protobuf</text><rect x="710" y="84" width="150" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="785" y="103" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">your handler</text><text x="785" y="121" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">GetCourse(call)</text><line x1="194" y1="112" x2="206" y2="112" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="364" y1="112" x2="536" y2="112" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="389.3" y="86.3" width="121.5" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#0052CC" stroke-width="1"/><text x="450" y="96" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">HTTP/2 + protobuf</text><line x1="694" y1="112" x2="706" y2="112" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 785 144 C 785 210, 115 210, 115 144" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="257.2" y="186.3" width="385.5" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#059669" stroke-width="1"/><text x="450" y="196" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">the result (or a gRPC status code) comes back the same way</text><line x1="32" y1="236" x2="868" y2="236" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="260" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#0A1633" font-weight="700">The network is still there. </tspan><tspan fill="#334155" font-weight="500">A local call can't time out, get lost or arrive twice. A remote one can.</tspan></text><text x="32" y="284" dy="0.35em" font-size="13" text-anchor="start"><tspan fill="#334155" font-weight="500">So every call needs a </tspan><tspan fill="#0A1633" font-weight="700">deadline</tspan><tspan fill="#334155" font-weight="500">, error handling for </tspan><tspan fill="#E11D48" font-weight="700">UNAVAILABLE</tspan><tspan fill="#334155" font-weight="500">, and care with retries.</tspan></text>
</svg>
