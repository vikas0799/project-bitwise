<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="A synchronous signup that waits on the email API compared with one that enqueues a background job and responds immediately while a worker retries" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A synchronous signup that waits on the email API compared with one that enqueues a background job and responds immediately while a worker retries</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Signup: wait for the email provider, or hand the email to a worker</text><text x="32" y="72" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">SYNCHRONOUS</text><rect x="32" y="86" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="107" y="106" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">validate + save user</text><rect x="186" y="86" width="330" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="351" y="106" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">call the email API … waiting … (1–5 s)</text><rect x="520" y="86" width="120" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="580" y="106" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">respond</text><text x="656" y="90" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Slow signup. If the email API</text><text x="656" y="107" dy="0.35em" font-size="12.5" font-weight="600" fill="#E11D48" text-anchor="start">is down: a 500, or &quot;check your</text><text x="656" y="124" dy="0.35em" font-size="12.5" font-weight="600" fill="#E11D48" text-anchor="start">email&quot; that never arrives.</text><line x1="32" y1="160" x2="868" y2="160" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="186" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">WITH A BACKGROUND JOB</text><rect x="32" y="200" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="107" y="220" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">validate + save user</text><rect x="186" y="200" width="110" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="241" y="220" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">enqueue job</text><rect x="300" y="200" width="120" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="360" y="220" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">201 Created</text><text x="440" y="220" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="start">← the user is done in ~50 ms</text><text x="32" y="282" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">WORKER (separate process)</text><line x1="241" y1="244" x2="241" y2="292" stroke="#0052CC" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#arrow-brand)"/><rect x="186" y="296" width="150" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="261" y="316" dy="0.35em" font-size="12.5" font-weight="700" fill="#003A91" text-anchor="middle">pick up the job</text><rect x="340" y="296" width="120" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="400" y="316" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">call email API</text><rect x="464" y="296" width="110" height="40" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="519" y="316" dy="0.35em" font-size="12.5" font-weight="700" fill="#9F1239" text-anchor="middle">fails: retry</text><rect x="578" y="296" width="120" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="638" y="316" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">call again</text><rect x="702" y="296" width="120" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="762" y="316" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">sent, ACK</text><text x="32" y="372" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">The API never waits for the email provider, and a provider outage turns into a delayed email, not a failed signup.</text>
</svg>
