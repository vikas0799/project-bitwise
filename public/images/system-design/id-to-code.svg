<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Ids are reserved from a Redis counter in blocks, shuffled with an invertible formula, and encoded as seven base62 characters" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Ids are reserved from a Redis counter in blocks, shuffled with an invertible formula, and encoded as seven base62 characters</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="260" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">From a counter to a short code</text><rect x="32" y="76" width="190" height="62" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="127" y="98" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">Redis INCRBY 1000</text><text x="127" y="116" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">reserve ids 5,000,001…5,001,000</text><line x1="224" y1="107" x2="242" y2="107" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="246" y="76" width="190" height="62" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="341" y="98" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">next id</text><text x="341" y="116" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">5,000,042</text><line x1="438" y1="107" x2="456" y2="107" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="460" y="76" width="190" height="62" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="555" y="98" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">shuffle</text><text x="555" y="116" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">(A·id + B) mod 62⁷</text><line x1="652" y1="107" x2="670" y2="107" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="674" y="76" width="190" height="62" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="769" y="98" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">base62, 7 chars</text><text x="769" y="116" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">e.g. 27DYaFl</text><text x="32" y="176" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Without the shuffle, ids 1000–1003 become 00000g8 00000g9 00000ga 00000gb: anyone can guess the next link.</text><text x="32" y="198" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">With it: 27DYaFl ErmM2mE gL5zU3X T4OnLLg. It hides the sequence from casual guessing; it is not encryption.</text><text x="32" y="230" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">62⁷ ≈ 3.5 trillion codes. Reserving ids in blocks served about 495,000 ids/s vs 21,000/s with one INCR per id.</text>
</svg>
