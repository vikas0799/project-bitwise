<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Writing to the database and Kafka separately can leave them out of sync; the outbox pattern writes the order and the event in one transaction and a relay publishes it" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Writing to the database and Kafka separately can leave them out of sync; the outbox pattern writes the order and the event in one transaction and a relay publishes it</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The dual-write problem and the outbox fix</text><text x="210" y="70" dy="0.35em" font-size="13.5" font-weight="700" fill="#E11D48" text-anchor="middle">Dual write: two separate systems</text><rect x="40" y="96" width="120" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="100" y="121" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">order service</text><rect x="260" y="84" width="140" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="330" y="104" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">1. INSERT order</text><rect x="260" y="140" width="140" height="40" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="330" y="160" dy="0.35em" font-size="12" font-weight="700" fill="#9F1239" text-anchor="middle">2. publish event</text><line x1="164" y1="114" x2="256" y2="104" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="164" y1="128" x2="256" y2="160" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="210" y="210" dy="0.35em" font-size="12" font-weight="500" fill="#E11D48" text-anchor="middle">crash between 1 and 2: the order exists,</text><text x="210" y="228" dy="0.35em" font-size="12" font-weight="500" fill="#E11D48" text-anchor="middle">but no event is ever sent</text><line x1="450" y1="56" x2="450" y2="340" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="680" y="70" dy="0.35em" font-size="13.5" font-weight="700" fill="#059669" text-anchor="middle">Outbox: one local transaction</text><rect x="476" y="88" width="230" height="110" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="591" y="108" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">BEGIN … COMMIT</text><rect x="492" y="120" width="198" height="30" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="591" y="135" dy="0.35em" font-size="11.5" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">INSERT INTO orders</text><rect x="492" y="158" width="198" height="30" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="591" y="173" dy="0.35em" font-size="11.5" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">INSERT INTO outbox</text><rect x="740" y="136" width="120" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="800" y="152" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">relay</text><text x="800" y="170" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">or Debezium</text><line x1="710" y1="168" x2="736" y2="164" stroke="#D97706" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-active)"/><rect x="740" y="236" width="120" height="44" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="800" y="258" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">Kafka</text><line x1="800" y1="190" x2="800" y2="232" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="591" y="228" dy="0.35em" font-size="12" font-weight="500" fill="#065F46" text-anchor="middle">both rows commit, or neither</text><text x="591" y="246" dy="0.35em" font-size="12" font-weight="500" fill="#065F46" text-anchor="middle">relay retries until published</text><text x="591" y="264" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="middle">(at least once: keep consumers idempotent)</text><text x="32" y="330" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Measured: an invalid order rolled back with no outbox row; the relay published the two valid orders, then found nothing left.</text>
</svg>
