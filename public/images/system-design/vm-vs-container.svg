<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Virtual machines each run a guest OS and kernel on a hypervisor, while containers share the host kernel and only package their libraries and app" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Virtual machines each run a guest OS and kernel on a hypervisor, while containers share the host kernel and only package their libraries and app</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Virtual machines vs containers</text><text x="222" y="72" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Virtual machines: each has its own OS</text><rect x="32" y="296" width="380" height="40" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="222" y="316" dy="0.35em" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">hardware</text><rect x="32" y="248" width="380" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="222" y="268" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">hypervisor</text><rect x="32" y="196" width="120" height="44" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="92" y="218" dy="0.35em" font-size="12" font-weight="700" fill="#9F1239" text-anchor="middle">guest OS + kernel</text><rect x="162" y="196" width="120" height="44" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="222" y="218" dy="0.35em" font-size="12" font-weight="700" fill="#9F1239" text-anchor="middle">guest OS + kernel</text><rect x="292" y="196" width="120" height="44" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="352" y="218" dy="0.35em" font-size="12" font-weight="700" fill="#9F1239" text-anchor="middle">guest OS + kernel</text><rect x="32" y="154" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="92" y="171" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">libraries</text><rect x="162" y="154" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="222" y="171" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">libraries</text><rect x="292" y="154" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="352" y="171" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">libraries</text><rect x="32" y="106" width="120" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="92" y="126" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">app A</text><rect x="162" y="106" width="120" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="222" y="126" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">app B</text><rect x="292" y="106" width="120" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="352" y="126" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">app C</text><line x1="450" y1="60" x2="450" y2="340" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="678" y="72" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Containers: one shared kernel</text><rect x="488" y="296" width="380" height="40" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="678" y="316" dy="0.35em" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle">hardware</text><rect x="488" y="248" width="380" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="678" y="268" dy="0.35em" font-size="12" font-weight="700" fill="#065F46" text-anchor="middle">host OS + one Linux kernel</text><rect x="488" y="206" width="380" height="34" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="678" y="223" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">container runtime (containerd, runc)</text><rect x="488" y="164" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="548" y="181" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">libraries</text><rect x="618" y="164" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="678" y="181" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">libraries</text><rect x="748" y="164" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="808" y="181" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">libraries</text><rect x="488" y="116" width="120" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="548" y="136" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">app A</text><rect x="618" y="116" width="120" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="678" y="136" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">app B</text><rect x="748" y="116" width="120" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="808" y="136" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">app C</text><text x="32" y="376" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">VM: gigabytes, boots an OS in seconds, strong isolation.</text><text x="488" y="376" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Container: megabytes, starts a process in milliseconds,</text><text x="488" y="396" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">isolation from kernel features (namespaces, cgroups).</text>
</svg>
