<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="The top-level keys of an OpenAPI document: info, servers, security, paths, components and tags, with paths referencing component schemas" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The top-level keys of an OpenAPI document: info, servers, security, paths, components and tags, with paths referencing component schemas</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Anatomy of an OpenAPI document</text><rect x="32" y="170" width="150" height="60" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="107" y="191" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">openapi.yaml</text><text x="107" y="209" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">version 3.1.0</text><rect x="250" y="62" width="130" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="315" y="82" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">info</text><line x1="186" y1="200" x2="246" y2="82" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="446" y="82" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">title, version, description</text><rect x="250" y="118" width="130" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="315" y="138" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">servers</text><line x1="186" y1="200" x2="246" y2="138" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="446" y="138" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">production, staging, local URLs</text><rect x="250" y="174" width="130" height="40" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="315" y="194" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">security</text><line x1="186" y1="200" x2="246" y2="194" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="446" y="194" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">default auth for every operation</text><rect x="250" y="230" width="130" height="40" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="315" y="250" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">paths</text><line x1="186" y1="200" x2="246" y2="250" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="446" y="250" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">/courses → get, post → parameters, requestBody, responses</text><rect x="250" y="286" width="130" height="40" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="315" y="306" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">components</text><line x1="186" y1="200" x2="246" y2="306" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="446" y="306" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">reusable schemas, responses, securitySchemes</text><rect x="250" y="342" width="130" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="315" y="362" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">tags</text><line x1="186" y1="200" x2="246" y2="362" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><text x="446" y="362" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">groups operations in the docs</text><path d="M 382 258 C 428 258, 428 306, 386 306" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-special)"/><text x="432" y="283" dy="0.35em" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">$ref</text><text x="32" y="404" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">One machine-readable file describes every endpoint, input, output, status code and auth requirement.</text>
</svg>
