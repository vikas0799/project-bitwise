<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="A producer enqueues JSON jobs into a broker, several workers process them and acknowledge success, failures retry with backoff and land in a dead-letter queue when retries run out" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A producer enqueues JSON jobs into a broker, several workers process them and acknowledge success, failures retry with backoff and land in a dead-letter queue when retries run out</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">How a task queue works</text><rect x="32" y="110" width="160" height="70" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="112" y="136" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Producer</text><text x="112" y="154" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">your API: enqueue + return</text><line x1="196" y1="145" x2="262" y2="145" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="197.2" y="118.3" width="63.5" height="19.5" rx="9.75" fill="#FFFFFF" stroke="#0052CC" stroke-width="1"/><text x="229" y="128" dy="0.35em" font-size="11.5" font-weight="600" fill="#0052CC" text-anchor="middle">JSON job</text><rect x="266" y="104" width="240" height="82" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/><text x="386" y="120" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">Queue / broker (Redis, RabbitMQ, SQS)</text><rect x="280" y="136" width="48" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="304" y="153" dy="0.35em" font-size="11" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">job 7</text><rect x="335" y="136" width="48" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="359" y="153" dy="0.35em" font-size="11" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">job 8</text><rect x="390" y="136" width="48" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="414" y="153" dy="0.35em" font-size="11" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">job 9</text><rect x="445" y="136" width="48" height="34" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="469" y="153" dy="0.35em" font-size="11" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">job 10</text><rect x="600" y="70" width="150" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="675" y="86" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">Worker 1</text><text x="675" y="104" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">runs the handler</text><line x1="510" y1="145" x2="596" y2="95" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="600" y="140" width="150" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="675" y="156" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">Worker 2</text><text x="675" y="174" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">runs the handler</text><line x1="510" y1="145" x2="596" y2="165" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="600" y="210" width="150" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="675" y="226" dy="0.35em" font-size="13.5" font-weight="700" fill="#065F46" text-anchor="middle">Worker 3</text><text x="675" y="244" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">runs the handler</text><line x1="510" y1="145" x2="596" y2="235" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="780" y="140" width="96" height="50" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="828" y="156" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">ACK</text><text x="828" y="174" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">job removed</text><line x1="754" y1="165" x2="776" y2="165" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><path d="M 675 264 C 675 320, 420 330, 400 192" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-active)"/><rect x="236.1" y="342" width="327.8" height="20" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/><text x="400" y="352" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">fail → retry later: 1 min, 2, 4, 8 … (+ jitter)</text><rect x="600" y="340" width="276" height="50" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="738" y="356" dy="0.35em" font-size="13.5" font-weight="700" fill="#9F1239" text-anchor="middle">Dead-letter queue</text><text x="738" y="374" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">out of retries: inspect, fix, replay</text><line x1="675" y1="264" x2="700" y2="336" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="32" y="230" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Visibility timeout: a job a</text><text x="32" y="250" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">worker took but never ACKed</text><text x="32" y="270" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">(it crashed) becomes visible</text><text x="32" y="290" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">again for another worker.</text><text x="32" y="330" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="start">Add workers to go faster:</text><text x="32" y="350" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">they share the queue.</text>
</svg>
