<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Five requests matched against a route table of method and path patterns, each calling one handler, with a 404 fallback" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Five requests matched against a route table of method and path patterns, each calling one handler, with a 404 fallback</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="440" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The router looks up method + path and calls exactly one handler</text><text x="147" y="66" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Incoming request</text><text x="470" y="66" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Route table</text><text x="775" y="66" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Handler</text><rect x="330" y="82" width="280" height="298" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><rect x="32" y="90" width="230" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="147" y="111" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GET /api/books</text><line x1="266" y1="111" x2="334" y2="111" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="340" y="90" width="260" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="352" y="111" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GET /api/books</text><line x1="604" y1="111" x2="666" y2="111" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="670" y="90" width="200" height="42" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="770" y="111" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">listBooks()</text><rect x="32" y="148" width="230" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="147" y="169" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">POST /api/books</text><line x1="266" y1="169" x2="334" y2="169" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="340" y="148" width="260" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="352" y="169" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">POST /api/books</text><line x1="604" y1="169" x2="666" y2="169" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="670" y="148" width="200" height="42" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="770" y="169" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">createBook()</text><rect x="32" y="206" width="230" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="147" y="227" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GET /api/books/42</text><line x1="266" y1="227" x2="334" y2="227" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="340" y="206" width="260" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="352" y="227" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GET /api/books/:id</text><line x1="604" y1="227" x2="666" y2="227" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="670" y="206" width="200" height="42" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="770" y="227" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">getBook(id = &quot;42&quot;)</text><rect x="32" y="264" width="230" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="147" y="285" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">DELETE /api/books/42</text><line x1="266" y1="285" x2="334" y2="285" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="340" y="264" width="260" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="352" y="285" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">DELETE /api/books/:id</text><line x1="604" y1="285" x2="666" y2="285" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="670" y="264" width="200" height="42" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="770" y="285" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">deleteBook(id = &quot;42&quot;)</text><rect x="32" y="322" width="230" height="42" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="147" y="343" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GET /api/cart</text><line x1="266" y1="343" x2="334" y2="343" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="340" y="322" width="260" height="42" rx="8" fill="#FFFFFF" stroke="#E11D48" stroke-width="1.5"/><text x="352" y="343" dy="0.35em" font-size="13" font-weight="500" fill="#E11D48" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">* (nothing matched)</text><line x1="604" y1="343" x2="666" y2="343" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="670" y="322" width="200" height="42" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="770" y="343" dy="0.35em" font-size="12.5" font-weight="700" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">notFound() → 404</text><line x1="32" y1="400" x2="868" y2="400" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="422" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#0A1633" font-weight="700">Same path, different method </tspan><tspan fill="#334155" font-weight="500">= a different key, so GET and POST /api/books never clash.</tspan></text>
</svg>
