<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="A redirect checks the code format, then the local cache, Redis and finally Postgres with request coalescing, returns 404, 410 or 302, and streams the click event asynchronously" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A redirect checks the code format, then the local cache, Redis and finally Postgres with request coalescing, returns 404, 410 or 302, and streams the click event asynchronously</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Serving GET /:code</text><rect x="40" y="80" width="145" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="112.5" y="99" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">valid code?</text><text x="112.5" y="117" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">regex check</text><line x1="187" y1="108" x2="221" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="204" y="96" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">yes</text><rect x="225" y="80" width="145" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="297.5" y="99" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">local LRU</text><text x="297.5" y="117" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">10 s, per process</text><line x1="372" y1="108" x2="406" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="389" y="96" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">miss</text><rect x="410" y="80" width="145" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="482.5" y="99" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">Redis</text><text x="482.5" y="117" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">1 h; &quot;missing&quot; 60 s</text><line x1="557" y1="108" x2="591" y2="108" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="574" y="96" dy="0.35em" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">miss</text><rect x="595" y="80" width="145" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="667.5" y="99" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Postgres</text><text x="667.5" y="117" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">one query per code</text><text x="112" y="160" dy="0.35em" font-size="11.5" font-weight="500" fill="#E11D48" text-anchor="middle">no → 404</text><text x="297" y="160" dy="0.35em" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">hit ↓</text><text x="482" y="160" dy="0.35em" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">hit ↓</text><text x="667" y="160" dy="0.35em" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">single-flight: 1,000</text><text x="667" y="176" dy="0.35em" font-size="11.5" font-weight="500" fill="#059669" text-anchor="middle">misses → 1 query</text><rect x="210" y="200" width="490" height="50" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="455" y="225" dy="0.35em" font-size="12" font-weight="700" fill="#0A1633" text-anchor="middle">expired? → 410 Gone · deleted or missing → 404 · otherwise 302 to the long URL</text><rect x="210" y="280" width="490" height="50" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="455" y="305" dy="0.35em" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">XADD clicks (fire and forget) · never awaited for the response</text><line x1="455" y1="252" x2="455" y2="276" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-active)"/><text x="32" y="366" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Measured on one machine: 6,595 req/s with a DB query and a DB click update per request, 9,777 req/s with caching and streamed clicks,</text><text x="32" y="386" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">and the database load fell from about 12,500 to under 1,000 queries per second.</text>
</svg>
