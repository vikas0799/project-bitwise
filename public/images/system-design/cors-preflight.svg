<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="The browser sends an OPTIONS preflight, the API approves the origin and method, then the browser sends the real PUT request" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The browser sends an OPTIONS preflight, the API approves the origin and method, then the browser sends the real PUT request</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">CORS preflight: the browser asks before sending a risky request</text><rect x="40" y="64" width="160" height="40" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="120" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="middle">Browser</text><text x="120" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">page on app.foodapp.in</text><line x1="120" y1="104" x2="120" y2="396" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><rect x="680" y="64" width="160" height="40" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="760" y="75" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">API server</text><text x="760" y="93" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">api.foodapp.in</text><line x1="760" y1="104" x2="760" y2="396" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 6"/><circle cx="90" cy="142" r="10" fill="#0A1633"/><text x="90" y="142" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M 120 134 C 160 134, 160 154, 124 154" fill="none" stroke="#0A1633" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><text x="168" y="144" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">your JS calls fetch() with PUT, JSON and a token</text><circle cx="90" cy="186" r="10" fill="#0A1633"/><text x="90" y="186" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><line x1="124" y1="186" x2="754" y2="186" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="225.7" y="164" width="428.6" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="440" y="174" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">OPTIONS /orders/7 (Origin, Access-Control-Request-Method: PUT)</text><circle cx="90" cy="230" r="10" fill="#0A1633"/><text x="90" y="230" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><line x1="756" y1="230" x2="126" y2="230" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="225.7" y="208" width="428.6" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="440" y="218" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">204 (Allow-Origin: https://app.foodapp.in, Allow-Methods: PUT)</text><circle cx="90" cy="274" r="10" fill="#0A1633"/><text x="90" y="274" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><line x1="124" y1="274" x2="754" y2="274" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="282.8" y="252" width="314.4" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="440" y="262" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">PUT /orders/7, the real request (with Origin)</text><circle cx="90" cy="318" r="10" fill="#0A1633"/><text x="90" y="318" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><line x1="756" y1="318" x2="126" y2="318" stroke="#0052CC" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="313" y="296" width="253.9" height="20" rx="10" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="440" y="306" dy="0.35em" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">200 OK + Access-Control-Allow-Origin</text><circle cx="90" cy="362" r="10" fill="#0A1633"/><text x="90" y="362" dy="0.35em" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><path d="M 