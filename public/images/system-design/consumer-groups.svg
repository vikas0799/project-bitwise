<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Three consumers in the fulfilment group each own two partitions, while the single analytics consumer reads all six partitions" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Three consumers in the fulfilment group each own two partitions, while the single analytics consumer reads all six partitions</title>
