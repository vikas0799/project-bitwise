<rect width="900" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Consumer groups: share work inside a group, every group gets everything</text><rect x="330" y="60" width="200" height="290" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="430" y="82" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">topic: orders</text><rect x="352" y="96" width="156" height="32" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="430" y="112" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">partition 0</text><rect x="352" y="136" width="156" height="32" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="430" y="152" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">partition 1</text><rect x="352" y="176" width="156" height="32" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="430" y="192" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">partition 2</text><rect x="352" y="216" width="156" height="32" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="430" y="232" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">partition 3</text><rect x="352" y="256" width="156" height="32" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="430" y="272" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">partition 4</text><rect x="352" y="296" width="156" height="32" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="430" y="312" dy="0.35em" font-size="12" font-weight="700" fill="#003A91" text-anchor="middle">partition 5</text><text x="150" y="72" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">group &quot;fulfilment&quot;</text><rect x="60" y="96" width="180" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="150" y="115" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">consumer 1</text><text x="150" y="133" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">partitions 1 and 4</text><line x1="244" y1="124" x2="348" y2="152" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><line x1="244" y1="124" x2="348" y2="272" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><rect x="60" y="186" width="180" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="150" y="205" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">consumer 2</text><text x="150" y="223" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">partitions 0 and 3</text><line x1="244" y1="214" x2="348" y2="112" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><line x1="244" y1="214" x2="348" y2="232" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><rect x="60" y="276" width="180" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="150" y="295" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">consumer 3</text><text x="150" y="313" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">partitions 2 and 5</text><line x1="244" y1="304" x2="348" y2="192" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><line x1="244" y1="304" x2="348" y2="312" stroke="#059669" stroke-width="1.5" stroke-linecap="round"/><text x="720" y="72" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">group &quot;analytics&quot;</text><rect x="620" y="176" width="200" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="720" y="195" dy="0.35em" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">one consumer</text><text x="720" y="213" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" 