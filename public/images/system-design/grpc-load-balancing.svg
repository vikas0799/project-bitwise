<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="A TCP load balancer sending every gRPC call on one connection to a single server, compared with an HTTP/2-aware proxy spreading calls across three servers" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A TCP load balancer sending every gRPC call on one connection to a single server, compared with an HTTP/2-aware proxy spreading calls across three servers</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="360" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Why gRPC needs a request-aware (L7) load balancer</text><text x="232" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#E11D48" text-anchor="middle">Connection-level balancing</text><rect x="32" y="150" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="87" y="169" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">client</text><text x="87" y="187" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">1 HTTP/2 conn</text><rect x="182" y="150" width="110" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="237" y="169" dy="0.35em" font-size="13" font-weight="700" fill="#92400E" text-anchor="middle">balancer</text><text x="237" y="187" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">L4 (TCP)</text><line x1="146" y1="178" x2="178" y2="178" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="332" y="90" width="100" height="46" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="382" y="104" dy="0.35em" font-size="12.5" font-weight="700" fill="#9F1239" text-anchor="middle">server A</text><text x="382" y="122" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">ALL calls</text><line x1="296" y1="178" x2="328" y2="113" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="332" y="160" width="100" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="382" y="174" dy="0.35em" font-size="12.5" font-weight="700" fill="#94A3B8" text-anchor="middle">server B</text><text x="382" y="192" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">idle</text><rect x="332" y="230" width="100" height="46" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="382" y="244" dy="0.35em" font-size="12.5" font-weight="700" fill="#94A3B8" text-anchor="middle">server C</text><text x="382" y="262" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">idle</text><text x="680" y="70" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">Per-call balancing</text><rect x="480" y="150" width="110" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="535" y="169" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle">client</text><text x="535" y="187" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">1 HTTP/2 conn</text><rect x="630" y="150" width="110" height="56" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="685" y="169" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle">proxy</text><text x="685" y="187" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">L7 (HTTP/2)</text><line x1="594" y1="178" x2="626" y2="178" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="780" y="90" width="100" height="46" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="830" y="104" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">server A</text><text x="830" y="122" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">1/3 of calls</text><line x1="744" y1="178" x2="776" y2="113" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="780" y="160" width="100" height="46" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="830" y="174" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">server B</text><text x="830" y="192" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">1/3 of calls</text><line x1="744" y1="178" x2="776" y2="183" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="780" y="230" width="100" height="46" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="830" y="244" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">server C</text><text x="830" y="262" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">1/3 of calls</text><line x1="744" y1="178" x2="776" y2="253" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><line x1="450" y1="64" x2="450" y2="300" stroke="#E2E8F0" stroke-width="1" stroke-linecap="round"/><text x="32" y="316" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">gRPC reuses one long-lived connection for many calls. A TCP balancer picks a server once per connection,</text><text x="32" y="336" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">so every call lands on the same server. Use Envoy/a service mesh, or client-side balancing, to spread each call.</text>
</svg>
