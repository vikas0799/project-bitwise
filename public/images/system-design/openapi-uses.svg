<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="A single OpenAPI file feeds interactive docs, linting, breaking-change checks, typed clients, request and response validation, mocks and AI tool definitions" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A single OpenAPI file feeds interactive docs, linting, breaking-change checks, typed clients, request and response validation, mocks and AI tool definitions</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="900" height="420" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">One spec, many uses</text><rect x="360" y="170" width="180" height="70" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="450" y="196" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">openapi.yaml</text><text x="450" y="214" dy="0.35em" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">the contract, in git</text><rect x="60" y="70" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="150" y="89" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">Interactive docs</text><text x="150" y="107" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Swagger UI, Redoc, Scalar</text><line x1="450" y1="170" x2="150" y2="126" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="360" y="66" width="180" height="56" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="450" y="85" dy="0.35em" font-size="12.5" font-weight="700" fill="#0A1633" text-anchor="middle">Lint</text><text x="450" y="103" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Redocly, Spectral</text><line x1="450" y1="170" x2="450" y2="122" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="660" y="70" width="180" height="56" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="750" y="89" dy="0.35em" font-size="12.5" font-weight="700" fill="#9F1239" text-anchor="middle">Breaking-change check</text><text x="750" y="107" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">oasdiff in CI</text><line x1="450" y1="170" x2="750" y2="126" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-bad)"/><rect x="60" y="300" width="180" height="56" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="150" y="319" dy="0.35em" font-size="12.5" font-weight="700" fill="#065F46" text-anchor="middle">Typed clients</text><text x="150" y="337" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">openapi-typescript + openapi-fetch</text><line x1="450" y1="240" x2="150" y2="300" stroke="#059669" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-good)"/><rect x="360" y="314" width="180" height="56" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="450" y="333" dy="0.35em" font-size="12.5" font-weight="700" fill="#92400E" text-anchor="middle">Request/response validation</text><text x="450" y="351" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">express-openapi-validator</text><line x1="450" y1="240" x2="450" y2="314" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-active)"/><rect x="660" y="300" width="180" height="56" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="750" y="319" dy="0.35em" font-size="12.5" font-weight="700" fill="#5B21B6" text-anchor="middle">Mocks and AI tools</text><text x="750" y="337" dy="0.35em" font-size="10" font-weight="500" fill="#64748B" text-anchor="middle">Prism mocks, agent tool schemas</text><line x1="450" y1="240" x2="750" y2="300" stroke="#7C3AED" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-special)"/><text x="32" y="404" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">Everything is generated from or checked against the same file, so docs, clients and server can’t quietly drift apart.</text>
</svg>
