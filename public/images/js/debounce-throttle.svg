ext><line x1="180" y1="160" x2="820" y2="160" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><circle cx="542.6666666666666" cy="160" r="9" fill="#059669"/><circle cx="777.3333333333334" cy="160" r="9" fill="#059669"/><text x="32" y="230" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="start">throttle</text><line x1="180" y1="230" x2="820" y2="230" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round"/><circle cx="180" cy="230" r="9" fill="#0052CC"/><circle cx="308" cy="230" r="9" fill="#0052CC"/><circle cx="606.6666666666666" cy="230" r="9" fill="#0052CC"/><text x="180" y="300" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0 ms</text><text x="393.3" y="300" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">500 ms</text><text x="606.7" y="300" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1000 ms</text><text x="820" y="300" dy="0.35em" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">1500 ms</text><text x="542.7" y="186" dy="0.35em" font-size="12" font-weight="500" fill="#059669" text-anchor="middle">fires 300 ms after typing stops</text><text x="308" y="256" dy="0.35em" font-size="12" font-weight="500" fill="#0052CC" text-anchor="middle">fires at most once every 300 ms</text>
</svg>
