<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-label="Nested global, outer and inner scopes with variable lookup going outward" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Nested global, outer and inner scopes with variable lookup going outward</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="780" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The scope chain: look in your own scope, then outward, never inward</text><rect x="24" y="56" width="732" height="324" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="44" y="78" dy="0.35em" font-size="14" font-weight="700" fill="#64748B" text-anchor="start">Global scope</text><text x="44" y="104" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">const app = &quot;Bitwise&quot;;</text><rect x="60" y="124" width="660" height="240" rx="16" fill="#E8F0FF" stroke="#0052CC" stroke-width="1.75"/><text x="80" y="146" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="start">function outer() scope</text><text x="80" y="172" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">const course = &quot;JS&quot;;</text><rect x="96" y="192" width="588" height="156" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="116" y="214" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="start">function inner() scope</text><text x="116" y="240" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">const topic = &quot;scope&quot;;</text><text x="116" y="270" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">console.log(topic, course, app);</text><text x="116" y="300" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">// &quot;scope&quot; &quot;JS&quot; &quot;Bitwise&quot;</text><line x1="560" y1="250" x2="560" y2="160" stroke="#0052CC" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-brand)"/><rect x="493.5" y="198" width="133" height="20" rx="10" fill="#FFFFFF" stroke="#8AB2FF" stroke-width="1"/><text x="560" y="208" dy="0.35em" font-size="12" font-weight="600" fill="#0052CC" text-anchor="middle">course: 1 level up</text><line x1="690" y1="250" x2="690" y2="92" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-active)"/><rect x="630.2" y="136" width="119.5" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="690" y="146" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">app: 2 levels up</text><text x="410" y="324" dy="0.35em" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">topic is found right here</text>
</svg>
