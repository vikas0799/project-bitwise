<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="The memory and execution phases of a JavaScript execution context and the call stack" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The memory and execution phases of a JavaScript execution context and the call stack</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="470" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Every script and function call runs in an execution context with two phases</text><rect x="24" y="58" width="260" height="250" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="40" y="80" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">Your code</text><text x="40" y="104" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">console.log(a);  // undefined</text><text x="40" y="130" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">var a = 10;</text><text x="40" y="156" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">let b = 20;</text><text x="40" y="182" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">function greet() {</text><text x="40" y="208" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  return &quot;hi&quot;;</text><text x="40" y="234" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">}</text><text x="40" y="260" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">greet();</text><line x1="290" y1="183" x2="312" y2="183" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="316" y="58" width="262" height="250" rx="14" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="332" y="80" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="start">1. Memory phase (hoisting)</text><rect x="332" y="96" width="70" height="38" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="367" y="115" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">a</text><rect x="410" y="96" width="152" height="38" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="486" y="115" dy="0.35em" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">undefined</text><rect x="332" y="156" width="70" height="38" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="367" y="175" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">b</text><rect x="410" y="156" width="152" height="38" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="486" y="175" dy="0.35em" font-size="12" font-weight="600" fill="#9F1239" text-anchor="middle">uninitialised (TDZ)</text><rect x="332" y="216" width="70" height="38" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="367" y="235" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">greet</text><rect x="410" y="216" width="152" height="38" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="486" y="235" dy="0.35em" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle">the whole function</text><text x="332" y="290" dy="0.35em" font-size="12" font-weight="500" fill="#0052CC" text-anchor="start">Memory is set up before any line runs</text><line x1="584" y1="183" x2="606" y2="183" stroke="#64748B" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-plain)"/><rect x="610" y="58" width="246" height="250" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="626" y="80" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="start">2. Execution phase</text><text x="626" y="100" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">log(a) prints undefined</text><text x="626" y="130" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">a becomes 10</text><text x="626" y="160" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">b becomes 20 (TDZ ends)</text><text x="626" y="190" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">greet() runs:</text><text x="626" y="220" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">a new context is pushed</text><text x="32" y="340" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">Call stack</text><rect x="32" y="356" width="220" height="36" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="142" y="374" dy="0.35em" font-size="13" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">greet() context</text><rect x="32" y="396" width="220" height="36" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="142" y="414" dy="0.35em" font-size="13" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Global context</text><text x="268" y="374" dy="0.35em" font-size="13" font-weight="500" fill="#0052CC" text-anchor="start">← top: running now, popped when it returns</text><text x="268" y="414" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">← created first, lives until the page or program ends</text>
</svg>
