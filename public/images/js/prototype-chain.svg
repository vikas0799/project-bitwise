<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-label="Prototype chains of a Student instance and a String object meeting at Object.prototype and ending at null" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Prototype chains of a Student instance and a String object meeting at Object.prototype and ending at null</title>
