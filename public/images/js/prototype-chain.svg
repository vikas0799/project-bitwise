<rect width="880" height="480" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The prototype chain: property lookup walks up until it finds a match or reaches null</text><text x="170" y="70" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">const s1 = new Student(&quot;Vikas&quot;)</text><rect x="60" y="84" width="220" height="52" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="74" y="102" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">s1</text><text x="74" y="126" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">name: &quot;Vikas&quot;</text><rect x="60" y="176" width="220" height="74" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="74" y="194" dy="0.35em" font-size="13.5" font-weight="700" fill="#003A91" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Student.prototype</text><text x="74" y="218" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">study()</text><text x="74" y="240" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">constructor</text><text x="650" y="70" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">const str = new String(&quot;john&quot;)</text><rect x="540" y="84" width="240" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="554" y="102" dy="0.35em" font-size="13.5" font-weight="700" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">str (String object)</text><text x="554" y="126" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">0: &quot;j&quot; … 3: &quot;n&quot;</text><text x="554" y="148" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">length: 4</text><rect x="540" y="198" width="240" height="74" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="554" y="216" dy="0.35em" font-size="13.5" font-weight="700" fill="#5B21B6" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">String.prototype</text><text x="554" y="240" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">toUpperCase()</text><text x="554" y="262" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">slice(), split() …</text><rect x="300" y="300" width="280" height="74" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="314" y="318" dy="0.35em" font-size="13.5" font-weight="700" fill="#92400E" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Object.prototype</text><text x="314" y="342" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">toString()</text><text x="314" y="364" dy="0.35em" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">hasOwnProperty()</text><rect x="390" y="420" width="100" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="440" y="437" dy="0.35em" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">null</text><line x1="170" y1="138" x2="170" y2="172" stroke="#0A1633" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="660" y1="160" x2="660" y2="194" stroke="#0A1633" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="200" y1="250" x2="330" y2="296" stroke="#0A1633" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="640" y1="286" x2="540" y2="312" stroke="#0A1633" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-ink)"/><line x1="440" y1="376" x2="440" y2="416" stroke="#0A1633" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="186" y="156" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">[[Prototype]]</text><text x="676" y="178" dy="0.35em" font-size="11.5" font-weight="500" fill="#64748B" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">[[Prototype]]</text><rect x="-10.6" y="430" width="341.3" height="20" rx="10" fill="#FFFFFF" stroke="#8AB2FF" stroke-width="1"/><text x="160" y="440" dy="0.35em" font-size="12" font-weight="600" fill="#0052CC" text-anchor="middle">s1.study(): not on s1, found on Student.prototype</text><rect x="556.2" y="430" width="287.5" height="20" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1"/><text x="700" y="440" dy="0.35em" font-size="12" font-weight="600" fill="#D97706" text-anchor="middle">str.toString(): found on Object.prototype</text>
</svg>
