<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="A counter function whose returned inner function keeps the count variable alive" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A counter function whose returned inner function keeps the count variable alive</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="840" height="400" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A closure: the inner function keeps its outer variables alive</text><rect x="24" y="56" width="360" height="320" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="40" y="78" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">Code</text><text x="40" y="100" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">function makeCounter() {</text><text x="40" y="124" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  let count = 0;</text><text x="40" y="148" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  return function () {</text><text x="40" y="172" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">    count++;</text><text x="40" y="196" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">    return count;</text><text x="40" y="220" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  };</text><text x="40" y="244" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">}</text><text x="40" y="268" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"></text><text x="40" y="292" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">const next = makeCounter();</text><text x="40" y="316" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">next();  // 1</text><text x="40" y="340" dy="0.35em" font-size="13" font-weight="500" fill="#0A1633" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">next();  // 2</text><rect x="420" y="70" width="390" height="88" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/><text x="440" y="94" dy="0.35em" font-size="13" font-weight="700" fill="#64748B" text-anchor="start">makeCounter() context</text><text x="440" y="120" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">finished and popped off the call stack…</text><text x="440" y="142" dy="0.35em" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">…but its variables are still reachable</text><rect x="420" y="200" width="170" height="48" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="505" y="224" dy="0.35em" font-size="13" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">next (function)</text><line x1="596" y1="224" x2="648" y2="224" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="622" y="270" dy="0.35em" font-size="11.5" font-weight="600" fill="#059669" text-anchor="middle">keeps a link</text><rect x="654" y="190" width="156" height="70" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="732" y="212" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">saved scope</text><text x="732" y="238" dy="0.35em" font-size="15" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">count: 2</text><text x="420" y="292" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">Each call to makeCounter() makes a fresh count,</text><text x="420" y="314" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">so two counters never share state.</text><text x="420" y="346" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">Used for private variables, factories, memoisation</text><text x="420" y="368" dy="0.35em" font-size="13" font-weight="600" fill="#0052CC" text-anchor="start">and every event handler that reads outer data.</text>
</svg>
