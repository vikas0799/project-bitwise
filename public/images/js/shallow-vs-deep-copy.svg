<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" role="img" aria-label="Memory picture of an object, its shallow copy sharing a nested object and its deep copy" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Memory picture of an object, its shallow copy sharing a nested object and its deep copy</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="860" height="380" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Shallow copy shares nested objects; deep copy duplicates them</text><rect x="40" y="70" width="200" height="86" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="140" y="89" dy="0.35em" font-size="13" font-weight="700" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">user</text><text x="56" y="116" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">name: &quot;Asha&quot;</text><text x="56" y="142" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">address: ●</text><rect x="330" y="70" width="200" height="86" rx="10" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="430" y="89" dy="0.35em" font-size="13" font-weight="700" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{ ...user }</text><text x="346" y="116" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">name: &quot;Asha&quot;</text><text x="346" y="142" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">address: ●</text><rect x="620" y="70" width="200" height="86" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="720" y="89" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">structuredClone(user)</text><text x="636" y="116" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">name: &quot;Asha&quot;</text><text x="636" y="142" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">address: ●</text><rect x="185" y="230" width="200" height="60" rx="10" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="285" y="249" dy="0.35em" font-size="13" font-weight="700" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">address (shared)</text><text x="201" y="276" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">city: &quot;Delhi&quot;</text><rect x="620" y="230" width="200" height="60" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="720" y="249" dy="0.35em" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">address (own copy)</text><text x="636" y="276" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">city: &quot;Delhi&quot;</text><path d="M 150 142 C 150 200, 230 200, 250 226" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-bad)"/><path d="M 440 142 C 440 200, 360 200, 330 226" fill="none" stroke="#E11D48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-bad)"/><path d="M 730 142 L 730 226" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><text x="32" y="330" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Change copy.address.city in the shallow copy and user.address.city changes too.</text><text x="32" y="354" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">The deep copy is fully independent.</text>
</svg>
