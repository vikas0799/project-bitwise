<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" role="img" aria-label="A flowchart for working out what this refers to in a JavaScript function call" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A flowchart for working out what this refers to in a JavaScript function call</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="860" height="540" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">What is `this`? Ask these questions in order</text><rect x="32" y="64" width="330" height="58" rx="14" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="197" y="93" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Is it an arrow function?</text><line x1="366" y1="93" x2="452" y2="93" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="409" y="81" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">yes</text><rect x="456" y="68" width="372" height="50" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="642" y="93" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">`this` of the surrounding code (arrows have no own this)</text><line x1="197" y1="126" x2="197" y2="156" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="208" y="142" dy="0.35em" font-size="12" font-weight="700" fill="#E11D48" text-anchor="start">no</text><rect x="32" y="160" width="330" height="58" rx="14" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="197" y="189" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Called with new?</text><line x1="366" y1="189" x2="452" y2="189" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="409" y="177" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">yes</text><rect x="456" y="164" width="372" height="50" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="642" y="189" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">the brand-new object being created</text><line x1="197" y1="222" x2="197" y2="252" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="208" y="238" dy="0.35em" font-size="12" font-weight="700" fill="#E11D48" text-anchor="start">no</text><rect x="32" y="256" width="330" height="58" rx="14" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="197" y="285" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Called with call(), apply() or bind()?</text><line x1="366" y1="285" x2="452" y2="285" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="409" y="273" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">yes</text><rect x="456" y="260" width="372" height="50" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="642" y="285" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">the object you passed in</text><line x1="197" y1="318" x2="197" y2="348" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="208" y="334" dy="0.35em" font-size="12" font-weight="700" fill="#E11D48" text-anchor="start">no</text><rect x="32" y="352" width="330" height="58" rx="14" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="197" y="381" dy="0.35em" font-size="14" font-weight="700" fill="#003A91" text-anchor="middle">Called as obj.method()?</text><line x1="366" y1="381" x2="452" y2="381" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="409" y="369" dy="0.35em" font-size="12" font-weight="700" fill="#059669" text-anchor="middle">yes</text><rect x="456" y="356" width="372" height="50" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="1.75"/><text x="642" y="381" dy="0.35em" font-size="13" font-weight="600" fill="#065F46" text-anchor="middle">obj, the object before the dot</text><line x1="197" y1="414" x2="197" y2="444" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="208" y="430" dy="0.35em" font-size="12" font-weight="700" fill="#E11D48" text-anchor="start">no</text><rect x="32" y="448" width="796" height="62" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="430" y="470" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">Default binding: a plain call like fn()</text><text x="430" y="492" dy="0.35em" font-size="12.5" font-weight="500" fill="#92400E" text-anchor="middle">undefined in strict mode (modules and classes are strict); globalThis in old sloppy scripts</text>
</svg>
