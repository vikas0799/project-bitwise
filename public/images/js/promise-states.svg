<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" role="img" aria-label="The three promise states pending, fulfilled and rejected and the handlers for each" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The three promise states pending, fulfilled and rejected and the handlers for each</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="820" height="340" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">A promise starts pending and settles exactly once</text><rect x="40" y="138" width="170" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="125" y="168" dy="0.35em" font-size="16" font-weight="600" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">pending</text><rect x="420" y="64" width="180" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="510" y="92" dy="0.35em" font-size="16" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">fulfilled</text><rect x="420" y="218" width="180" height="56" rx="8" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/><text x="510" y="246" dy="0.35em" font-size="16" font-weight="600" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">rejected</text><path d="M 214 158 C 300 150, 330 96, 416 92" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><rect x="245" y="97.8" width="110" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1"/><text x="300" y="108" dy="0.35em" font-size="12.5" font-weight="600" fill="#059669" text-anchor="middle">resolve(value)</text><path d="M 214 180 C 300 190, 330 244, 416 246" fill="none" stroke="#E11D48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-bad)"/><rect x="217" y="221.8" width="166" height="20.5" rx="10.25" fill="#FFFFFF" stroke="#FDA4AF" stroke-width="1"/><text x="300" y="232" dy="0.35em" font-size="12.5" font-weight="600" fill="#E11D48" text-anchor="middle">reject(error) or throw</text><line x1="604" y1="92" x2="660" y2="92" stroke="#059669" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="668" y="92" dy="0.35em" font-size="13" font-weight="600" fill="#059669" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">.then(value =&gt; …)</text><line x1="604" y1="246" x2="660" y2="246" stroke="#E11D48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-bad)"/><text x="668" y="246" dy="0.35em" font-size="13" font-weight="600" fill="#E11D48" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">.catch(error =&gt; …)</text><path d="M 610 128 C 700 150, 700 190, 610 210" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="708" y="169" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="start">.finally() runs either way</text><text x="32" y="312" dy="0.35em" font-size="14" font-weight="500" fill="#64748B" text-anchor="start">Once fulfilled or rejected (&quot;settled&quot;), a promise never changes state again.</text>
</svg>
