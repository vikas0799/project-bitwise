<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Steps of autoboxing from a primitive string to a temporary wrapper object and back" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Steps of autoboxing from a primitive string to a temporary wrapper object and back</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="280" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Autoboxing: how &quot;john&quot;.toUpperCase() works on a primitive</text><rect x="32" y="78" width="176" height="54" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="120" y="105" dy="0.35em" font-size="13.5" font-weight="600" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&quot;john&quot;</text><text x="120" y="150" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">a primitive string</text><line x1="212" y1="105" x2="238" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="244" y="78" width="176" height="54" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="332" y="105" dy="0.35em" font-size="13.5" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">new String(&quot;john&quot;)</text><text x="332" y="150" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">temporary wrapper</text><line x1="424" y1="105" x2="450" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="456" y="78" width="176" height="54" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="544" y="105" dy="0.35em" font-size="13.5" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">String.prototype</text><text x="544" y="150" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">toUpperCase found</text><line x1="636" y1="105" x2="662" y2="105" stroke="#0A1633" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="668" y="78" width="176" height="54" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="756" y="105" dy="0.35em" font-size="13.5" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&quot;JOHN&quot;</text><text x="756" y="150" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">the result</text><rect x="456" y="172" width="220" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="566" y="192" dy="0.35em" font-size="12.5" font-weight="500" fill="#64748B" text-anchor="middle">wrapper is thrown away</text><path d="M 334 160 C 334 192, 380 192, 452 192" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/><text x="32" y="246" dy="0.35em" font-size="15" text-anchor="start"><tspan fill="#334155" font-weight="500">That is also why </tspan><tspan fill="#0A1633" font-weight="700">&quot;john&quot;.age = 20</tspan><tspan fill="#334155" font-weight="500"> does nothing useful: the property lands on a wrapper that disappears at once.</tspan></text>
</svg>
