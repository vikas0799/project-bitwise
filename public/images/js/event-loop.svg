<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="The call stack, Web APIs, microtask queue and task queue of the JavaScript event loop" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>The call stack, Web APIs, microtask queue and task queue of the JavaScript event loop</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="880" height="520" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">The event loop: sync code first, then all microtasks, then one task</text><rect x="24" y="58" width="190" height="344" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="40" y="80" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">Call stack</text><rect x="40" y="94" width="158" height="38" rx="8" fill="#E8F0FF" stroke="#0052CC" stroke-width="2"/><text x="119" y="113" dy="0.35em" font-size="12.5" font-weight="600" fill="#003A91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">console.log(5)</text><rect x="40" y="142" width="158" height="38" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="119" y="161" dy="0.35em" font-size="12.5" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">main script</text><text x="119" y="380" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">one thing at a time</text><rect x="250" y="58" width="300" height="112" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><text x="266" y="80" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">Web APIs (browser) / libuv (Node)</text><rect x="266" y="96" width="84" height="34" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="308" y="113" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle">setTimeout</text><rect x="358" y="96" width="84" height="34" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="400" y="113" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle">fetch</text><rect x="450" y="96" width="84" height="34" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="492" y="113" dy="0.35em" font-size="12" font-weight="600" fill="#0A1633" text-anchor="middle">DOM events</text><text x="400" y="152" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">wait in the background, then queue a callback</text><rect x="250" y="190" width="604" height="96" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="266" y="212" dy="0.35em" font-size="14" font-weight="700" fill="#065F46" text-anchor="start">Microtask queue: emptied completely after each task</text><rect x="266" y="230" width="184" height="38" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="358" y="249" dy="0.35em" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">.then(() =&gt; log(3))</text><rect x="462" y="230" width="184" height="38" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="554" y="249" dy="0.35em" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">queueMicrotask(log 4)</text><rect x="658" y="230" width="184" height="38" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="750" y="249" dy="0.35em" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">code after await</text><rect x="250" y="306" width="604" height="96" rx="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="266" y="328" dy="0.35em" font-size="14" font-weight="700" fill="#92400E" text-anchor="start">Task (macrotask) queue: one task per loop turn</text><rect x="266" y="346" width="184" height="38" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="358" y="365" dy="0.35em" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">setTimeout(log 2)</text><rect x="462" y="346" width="184" height="38" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="554" y="365" dy="0.35em" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">click handler</text><rect x="658" y="346" width="184" height="38" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="750" y="365" dy="0.35em" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">message event</text><path d="M 214 120 C 232 120, 232 249, 262 249" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)"/><path d="M 214 150 C 236 150, 236 365, 262 365" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-active)"/><text x="40" y="436" dy="0.35em" font-size="14" font-weight="700" fill="#0A1633" text-anchor="start">Loop:</text><text x="92" y="436" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">1. Run the synchronous code until the call stack is empty.</text><text x="92" y="460" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">2. Run every microtask (and any microtasks they add).</text><text x="92" y="484" dy="0.35em" font-size="13" font-weight="500" fill="#334155" text-anchor="start">3. Take ONE task from the task queue, run it, then go back to step 2.</text>
</svg>
