<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-label="A click event travelling down through capture, reaching the target and bubbling back up" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>A click event travelling down through capture, reaching the target and bubbling back up</title>
<defs><marker id="arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker><marker id="arrow-brand" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0052CC"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker><marker id="arrow-good" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker><marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E11D48"/></marker><marker id="arrow-special" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0A1633"/></marker></defs>
<rect width="820" height="440" fill="#FFFFFF"/>
<text x="32" y="32" dy="0.35em" font-size="17" font-weight="700" fill="#0A1633" text-anchor="start">Event propagation: capture down, target, bubble up</text><rect x="250" y="64" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="410" y="84" dy="0.35em" font-size="14" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">window</text><rect x="250" y="120" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="410" y="140" dy="0.35em" font-size="14" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">document</text><rect x="250" y="176" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="410" y="196" dy="0.35em" font-size="14" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&lt;html&gt;</text><rect x="250" y="232" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="410" y="252" dy="0.35em" font-size="14" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&lt;body&gt;</text><rect x="250" y="288" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="410" y="308" dy="0.35em" font-size="14" font-weight="600" fill="#0A1633" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&lt;ul id=&quot;menu&quot;&gt;</text><rect x="250" y="344" width="320" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="410" y="364" dy="0.35em" font-size="14" font-weight="600" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&lt;li&gt; (clicked)</text><line x1="200" y1="70" x2="200" y2="364" stroke="#0052CC" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-brand)"/><text x="186" y="216" dy="0.35em" font-size="14" font-weight="700" fill="#0052CC" text-anchor="middle" transform="rotate(-90 186 216)">① capture phase</text><line x1="620" y1="364" x2="620" y2="70" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-good)"/><text x="636" y="216" dy="0.35em" font-size="14" font-weight="700" fill="#059669" text-anchor="middle" transform="rotate(90 636 216)">③ bubble phase</text><text x="410" y="400" dy="0.35em" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">② target phase</text><text x="690" y="120" dy="0.35em" font-size="12" font-weight="500" fill="#059669" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">addEventListener('click', fn)</text><text x="690" y="140" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">listens while bubbling (default)</text><text x="40" y="110" dy="0.35em" font-size="12" font-weight="500" fill="#0052CC" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{ capture: true }</text><text x="40" y="130" dy="0.35em" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">listens on the way down</text>
</svg>
